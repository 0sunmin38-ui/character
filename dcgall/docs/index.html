<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI채팅 갤러리 수집 리포트 · aichatting</title>
<style>

:root{
  --bg:#f5f8fc; --panel:#fff; --sunken:#eef3fa;
  --ink:#152232; --ink2:#3d5068; --dim:#7488a0; --faint:#9aabc0;
  --line:#dde6f1; --line2:#eaf0f7;
  --accent:#2166cf; --accent-h:#1a55b0; --accent-w:#e7f0fd; --accent-b:#b9d3f7;
  --chip:#eef3fa; --hi:#ffeeb0; --ok:#1d7f5e; --warn:#b3781a; --bad:#c0413c;
  --ctl:34px; --r:8px; --r-sm:5px;   /* r=입력·버튼 / r-sm=칩·세그먼트 */
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e141d; --panel:#161e2a; --sunken:#111925;
  --ink:#e8eff8; --ink2:#c2d0e2; --dim:#8497ae; --faint:#6b7e96;
  --line:#243244; --line2:#1c2735;
  --accent:#5b9df5; --accent-h:#7ab0f8; --accent-w:#16283f; --accent-b:#2f4d73;
  --chip:#1c2735; --hi:#5a4a12; --ok:#5fc79b; --warn:#dfb457; --bad:#e2726c;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Segoe UI",sans-serif;
 -webkit-font-smoothing:antialiased}
a{color:var(--accent)}
mark{background:var(--hi);color:#152232;border-radius:2px;padding:0 1px}
img,video{max-width:100%}

/* ── 컨트롤 공통 ─────────────────────────────────────────── */
.ctl{height:var(--ctl);border:1px solid var(--line);background:var(--panel);color:var(--ink2);
 border-radius:var(--r);padding:0 12px;font:inherit;font-size:13px;line-height:1;vertical-align:middle}
button.ctl{cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.12s}
/* 폭이 부족하면 글자를 이모지로 대체한다 — .t 는 글자, .e 는 이모지 */
.e{display:none}
.t{display:inline}
button.ctl:hover{border-color:var(--accent-b);background:var(--accent-w);color:var(--accent)}
button.ctl.on{background:var(--accent);border-color:var(--accent);color:#fff}
button.ctl.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ctl.primary:hover{background:var(--accent-h);border-color:var(--accent-h);color:#fff}
button.ctl:disabled{opacity:.55;cursor:default}
select.ctl{cursor:pointer;padding-right:28px;
 background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
 background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat;
 -webkit-appearance:none;appearance:none}
select.ctl:hover{border-color:var(--accent-b)}
.vlabel{font-size:10.5px;color:var(--faint);letter-spacing:.08em;font-weight:700;flex:none;width:34px;text-transform:uppercase}
.count{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}

/* ── 헤더 ────────────────────────────────────────────────── */
.hdr{position:sticky;top:0;z-index:30;background:var(--panel);border-bottom:1px solid var(--line);
 box-shadow:0 1px 3px rgba(21,34,50,.04)}
/* 도구 영역 펼침 버튼 — 옆의 기능 버튼(.ctl)과 헷갈리지 않게 테두리 없는 아이콘으로 둔다 */
button.disclose{display:none;border:none;background:none;color:var(--dim);cursor:pointer;padding:0;
 width:34px;height:34px;align-items:center;justify-content:center;border-radius:var(--r);transition:.12s}
button.disclose:hover{color:var(--accent);background:var(--accent-w)}
button.disclose i{display:block;width:9px;height:9px;margin-top:-4px;
 border-right:1.8px solid currentColor;border-bottom:1.8px solid currentColor;
 transform:rotate(45deg);transition:transform .18s,margin .18s}
.hdr.open button.disclose i{transform:rotate(-135deg);margin-top:3px}
.hdr-top{display:flex;align-items:center;gap:20px;padding:0 28px;height:64px}   /* GNB — 두 페이지 공통, 높이 고정 */
.brand{display:flex;flex-direction:column;min-width:0;gap:3px}
.brand b{font-size:15.5px;letter-spacing:-.015em;line-height:1.25;color:var(--ink)}
.brand span{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56ch}
.nav{display:flex;gap:4px;align-self:stretch;align-items:stretch;margin-left:14px}
.nav a{padding:0 17px;display:flex;align-items:center;font-size:13.5px;color:var(--dim);
 text-decoration:none;border-bottom:2px solid transparent;transition:.12s}
.nav a:hover{color:var(--accent);background:var(--accent-w)}
.nav a.active{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
.hdr-actions{margin-left:auto;display:flex;gap:8px;flex:none;align-items:center;min-height:var(--ctl)}
/* GNB 우측 정보 표시 — 버튼과 같은 높이라 페이지를 오가도 바가 흔들리지 않는다 */
.stat{height:var(--ctl);display:inline-flex;align-items:center;padding:0 12px;border-radius:var(--r);
 background:var(--sunken);border:1px solid var(--line2);color:var(--dim);font-size:11.5px;
 white-space:nowrap;font-variant-numeric:tabular-nums}

.hdr-tools{border-top:1px solid var(--line2)}
.hdr-row{display:flex;gap:10px;align-items:center;padding:0 28px 14px;flex-wrap:wrap}
.hdr-row:first-child{padding-top:14px}
.hdr-row.tight{padding-bottom:12px}
/* 보기·분류 행은 줄바꿈 금지. 여백 → 컴포넌트 폭 → 개수 표시 순으로 줄인다. */
.hdr-row.view-row,.hdr-row.cat-row{flex-wrap:nowrap}
.hdr-row+.hdr-row{border-top:1px solid var(--line2);padding-top:13px}

/* 검색줄은 줄바꿈을 막아 두고 '축소'로 먼저 버틴다.
   flexbox 는 flex-basis 합이 넘치면 축소하기 전에 줄부터 바꿔버리기 때문에,
   nowrap 이어야 (1)검색창 → (2)드롭다운 순서로 줄어든다. */
.hdr-row.search-row{flex-wrap:nowrap}
.search{position:relative;display:flex;align-items:center;
 flex:1 1 auto;min-width:118px}           /* 여유가 있으면 늘고, 부족하면 가장 먼저 줄어든다 */
.search input{width:100%;height:var(--ctl);padding:0 13px 0 34px;border:1px solid var(--line);
 border-radius:var(--r);background:var(--sunken);color:var(--ink);font:inherit;font-size:13.5px;transition:.12s}
.search input:focus{outline:none;border-color:var(--accent);background:var(--panel);
 box-shadow:0 0 0 3px var(--accent-w)}
.search .ico{position:absolute;left:12px;color:var(--faint);font-size:14px;pointer-events:none}
.filters{display:flex;gap:8px;flex:0 1 auto;min-width:0}   /* 검색창이 한계에 닿은 뒤 줄어든다 */
.filters .ctl{flex:0 1 auto;min-width:78px;text-overflow:ellipsis}
.segwrap{min-width:0;display:flex}
/* 둘 다 최소폭에 닿는 420px 이하에서만 비로소 2줄로 내려간다 */
@media (max-width:420px){
  .hdr-row.search-row{flex-wrap:wrap}
  .search{flex:1 1 100%}
  .filters{flex:1 1 100%}
  .filters .ctl{flex:1 1 auto}
}

.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;background:var(--panel)}
.seg button{border:none;background:none;color:var(--dim);font:inherit;font-size:12.5px;
 padding:0 14px;height:32px;cursor:pointer;border-right:1px solid var(--line);white-space:nowrap;transition:.12s}
.seg{flex:0 1 auto;min-width:0}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--accent-w);color:var(--accent)}
.seg button.on{background:var(--accent);color:#fff}

/* 분류 탭 — 절대 2줄로 넘기지 않는다 */
.scrollrow{position:relative;flex:1;min-width:0}
.cats{display:flex;flex-wrap:nowrap;gap:7px;overflow-x:auto;scroll-behavior:smooth;padding:2px 0;
 scrollbar-width:none;-ms-overflow-style:none}
.cats::-webkit-scrollbar{display:none}
.scrollrow::before,.scrollrow::after{content:'';position:absolute;top:0;bottom:0;width:26px;
 pointer-events:none;z-index:2;opacity:0;transition:opacity .15s}
.scrollrow::before{left:0;background:linear-gradient(90deg,var(--panel),transparent)}
.scrollrow::after{right:0;background:linear-gradient(270deg,var(--panel),transparent)}
.scrollrow.l::before{opacity:1}
.scrollrow.r::after{opacity:1}
.arrow{flex:none;width:26px;height:26px;border:1px solid var(--line);background:var(--panel);color:var(--dim);
 border-radius:var(--r-sm);cursor:pointer;font-size:14px;line-height:1;display:none;align-items:center;justify-content:center;padding:0}
.arrow:hover{border-color:var(--accent);color:var(--accent)}
.arrow.show{display:flex}
.cat{font-size:12.5px;border:1px solid var(--line);background:var(--panel);border-radius:var(--r-sm);
 padding:5px 14px;cursor:pointer;white-space:nowrap;flex:none;line-height:1.25;color:var(--ink2);transition:.12s}
.cat:hover{border-color:var(--accent-b);color:var(--accent)}
.cat.on{background:var(--accent);border-color:var(--accent);color:#fff}
.cat .n{opacity:.6;margin-left:6px;font-variant-numeric:tabular-nums;font-size:11px}

/* ── 목록: 제목만 선명하게, 나머지는 압축 ──────────────────── */
main{padding:18px 28px 90px;max-width:1080px;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:9px;
 padding:9px 13px 8px;margin-bottom:6px;transition:.12s}
.card:hover{border-color:var(--accent-b)}
.card.edited{box-shadow:inset 3px 0 0 var(--ok)}
.card.amb{box-shadow:inset 3px 0 0 var(--warn)}
.card.gone{box-shadow:inset 3px 0 0 var(--bad)}
.card.picked{background:var(--accent-w);border-color:var(--accent)}

/* 카드는 늘 2행. 1행 = 제목, 2행 = 부속 정보 */
.row{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}
.row.r2{gap:7px;margin-top:4px;line-height:1.35}
.row.r1 .go{margin-left:auto;flex:none;font-size:11.5px;white-space:nowrap;text-decoration:none}
.row.r1 .go:hover{text-decoration:underline}
.row.r2 .nums{margin-left:auto;flex:none}
.row.r2 .date{flex:none}
.ttl{font-weight:600;font-size:14px;line-height:1.4;letter-spacing:-.01em;color:var(--ink);
 cursor:pointer;flex:1 1 0;min-width:0;
 white-space:nowrap;overflow:hidden;text-overflow:ellipsis}   /* 넘치면 … 로 자른다 */
.card.open .ttl{white-space:normal;overflow:visible}          /* 펼치면 전문을 보여준다 */
.ttl:hover{color:var(--accent)}
.row.r2 .chip,.row.r2 .metrics{font-size:11px}
.chip{font-size:11px;color:var(--dim);background:var(--chip);border-radius:var(--r-sm);
 padding:1px 8px;white-space:nowrap;line-height:1.55;flex:0 1 auto;min-width:0;
 overflow:hidden;text-overflow:ellipsis}
.metrics{font-size:11.5px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:0}
.metrics b{color:var(--accent);font-weight:600}
.pick{font-size:11.5px;height:24px;padding:0 6px;border-radius:6px;max-width:126px;min-width:0;
 border:1px solid var(--line);background:var(--sunken);color:var(--dim);cursor:pointer;flex:none}
.pick:hover{border-color:var(--accent-b);color:var(--accent)}
.sel{width:15px;height:15px;accent-color:var(--accent);cursor:pointer;flex:none}
.inlib{color:#e0a52b;font-size:13px;line-height:1;flex:none}   /* 서재에 담긴 글 표식 (읽기 전용) */
.card{cursor:pointer}                                          /* 로우 전체가 선택 영역 */
.ttl,.pick,.body,.card a{cursor:auto}
.ttl{cursor:pointer}

.body{display:none;margin-top:9px;padding-top:9px;border-top:1px solid var(--line2)}
.card.open .body{display:block}
.txt{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.72;color:var(--ink2)}
.why{font-size:11px;color:var(--faint);margin-top:7px;line-height:1.5}
.imgs{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0}
.imgs img{max-height:140px;border-radius:7px;border:1px solid var(--line)}
.cmts{margin-top:9px;border-top:1px solid var(--line2);padding-top:6px}
.cmt{font-size:12.5px;line-height:1.55;padding:3px 0;border-bottom:1px solid var(--line2);color:var(--ink2)}
.cmt:last-child{border-bottom:none}
.cmt.re{padding-left:18px;color:var(--dim)}
.cmt .n{color:var(--faint);margin-right:6px;font-size:11px}
.empty{color:var(--dim);text-align:center;padding:80px 20px;font-size:13.5px;line-height:1.8}
.gonebadge{background:var(--bad);color:#fff;border-radius:var(--r-sm);font-size:10.5px;padding:1px 8px;font-weight:600}

/* ── 선택 바 ─────────────────────────────────────────────── */
#selbar{display:none;align-items:center;gap:8px;flex-wrap:nowrap;overflow-x:auto;font-size:13px;
 scrollbar-width:none;
 background:var(--accent);color:#fff;padding:11px 28px;border-top:1px solid rgba(255,255,255,.2)}
#selbar.show{display:flex}
#selbar::-webkit-scrollbar{display:none}
#selbar>*{flex:none}
#selbar select{flex:0 1 auto;min-width:62px}   /* 폭이 없으면 드롭다운부터 줄인다 */
#selbar input{flex:1 1 90px;min-width:64px}
#selbar .selcount{white-space:nowrap}
#selbar .n{font-weight:700}
#selbar button,#selbar select,#selbar input{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.4);
 color:#fff;border-radius:var(--r);padding:0 11px;height:31px;font:inherit;font-size:12.5px;white-space:nowrap}
#selbar button{cursor:pointer;transition:.12s}
#selbar button:hover{background:rgba(255,255,255,.3)}
#selbar select option{color:#111}
#selbar .n{font-weight:700}
#selbar .divider{opacity:.4}
#selTag{width:175px}
#prog{flex:1 1 90px !important;min-width:70px;height:6px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;display:none}
#prog.show{display:block}
#prog i{display:block;height:100%;background:#fff;width:0;transition:width .3s}

/* ── 사전 패널 ───────────────────────────────────────────── */
#crawlPanel,#glPanel{max-width:1080px;margin:16px auto 0;padding:0 28px}
.pbar{height:7px;background:var(--sunken);border-radius:99px;overflow:hidden;margin:10px 0 7px;border:1px solid var(--line)}
.pbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.jobseg{margin-bottom:11px}
.jobseg button{padding:0 13px;height:29px;font-size:12.5px}
.jobdesc{margin:0 0 4px}
.runrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;
 border-top:1px solid var(--line2);padding-top:13px}
.runrow .why{margin:0}
.kwbox{border-top:1px solid var(--line2);margin-top:13px;padding-top:13px}
.kwhead{display:flex;gap:9px;align-items:baseline;flex-wrap:wrap;font-size:13px;font-weight:600;margin-bottom:9px}
.kwhead .g{font-weight:400;font-size:11.5px;color:var(--dim)}
.kwopt{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:11px;font-size:11.5px;color:var(--dim)}
.kwopt label{display:flex;gap:6px;align-items:center}
.kwopt select{height:26px;padding:0 7px;font-size:11.5px;border-radius:var(--r-sm);
 border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.plog{font-size:11.5px;color:var(--dim);line-height:1.7;max-height:132px;overflow-y:auto;
 font-family:ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
.glbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:12px}
.glbox h3{margin:0 0 9px;font-size:13.5px;display:flex;align-items:center;gap:9px;flex-wrap:wrap;color:var(--ink)}
.glbox h3 .g{color:var(--dim);font-weight:400;font-size:12px}
.glbox p.d{margin:0 0 12px;font-size:12px;color:var(--dim);line-height:1.65}
.glgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px}
.gterm{font-size:12px;border:1px solid var(--line);border-radius:7px;padding:6px 10px;background:var(--sunken);line-height:1.5}
.gterm b{color:var(--ink)}
.gterm .g{color:var(--dim)}
.cand{display:grid;grid-template-columns:minmax(90px,auto) 1fr auto;gap:10px;align-items:center;
 border-bottom:1px solid var(--line2);padding:7px 0;font-size:12.5px}
.cand .word{font-weight:600;color:var(--ink)}
.cand .meta{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cand .act{display:flex;gap:5px;align-items:center}
.cand select,.cand input{height:28px;padding:0 8px;font-size:12px;border-radius:6px;
 border:1px solid var(--line);background:var(--sunken);color:var(--ink)}
.cand input{width:150px}
.cand button{height:28px;padding:0 11px;font-size:12px;border-radius:6px;cursor:pointer;
 border:1px solid var(--line);background:var(--panel);color:var(--ink2);transition:.12s}
.cand button:hover{border-color:var(--accent);color:var(--accent)}
#mineBtn{border-color:var(--accent-b);color:var(--accent);background:var(--accent-w)}

/* ── 서재 전용 ───────────────────────────────────────────── */
.note{width:100%;margin-top:7px;font-size:12.5px;min-height:32px;resize:vertical;line-height:1.6;
 border:1px solid var(--line);border-radius:7px;background:var(--sunken);color:var(--ink2);
 padding:6px 9px;font-family:inherit}
.note:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.tagbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-top:6px}
.tag.ref{background:var(--sunken);border-style:dashed}
.tag.ref .g{opacity:.65;margin-left:3px}
.tag{font-size:11px;background:var(--accent-w);border:1px solid var(--accent-b);color:var(--accent);
 border-radius:var(--r-sm);padding:1px 9px;cursor:pointer;line-height:1.6}
.tag .x{opacity:.55;margin-left:5px}
.tagin{font-size:11.5px;padding:1px 10px;width:104px;border-radius:var(--r-sm);border:1px dashed var(--line);
 background:transparent;color:var(--ink)}
.tagin:focus{outline:none;border-color:var(--accent);border-style:solid}

#toast{position:fixed;right:20px;bottom:20px;background:var(--panel);border:1px solid var(--line);
 border-left:3px solid var(--ok);border-radius:9px;padding:11px 16px;font-size:12.5px;opacity:0;
 transition:opacity .2s;pointer-events:none;z-index:99;box-shadow:0 8px 26px rgba(21,34,50,.16);color:var(--ink)}
#toast.show{opacity:1}

/* ═══ 반응형 ═════════════════════════════════════════════════
   1080↓ 여백 축소 · 900↓ GNB 2단 + 헤더 스크롤아웃 + 하단 액션바
   700↓  카드 제목 단독 줄 · 480↓ 최소 여백                     */

/* ① 여백부터 */
@media (max-width:820px){
  .hdr-row.view-row,.hdr-row.cat-row{gap:7px}
  .seg button{padding:0 11px}
}
/* ② 컴포넌트 폭 */
@media (max-width:600px){
  .seg button{padding:0 8px;font-size:12px}
  .hdr-row.view-row,.hdr-row.cat-row{gap:6px}
  .cat{padding:5px 10px}
}
/* ③ 마지막으로 개수 표시를 버린다 */
@media (max-width:430px){
  .count{display:none}
  .cat .n{display:none}
  .seg button{padding:0 7px;font-size:11.5px}
}

@media (max-width:1080px){
  .hdr-top{padding:0 20px}
  .hdr-row{padding:0 20px 12px}
  .hdr-row:first-child{padding-top:12px}
  main{padding:16px 20px 90px}
  #glPanel{padding:0 20px}
  #selbar{padding:11px 20px}
  .brand span{max-width:40ch}
}

@media (max-width:900px){
  :root{--ctl:38px}                      /* 터치 타겟 확보 */

n 특이한 머리색을 가진 사람들은 전체 인구의 0.1% 미만을 차지해요.\n 이들은 1960년대부터 나타나기 시작했고 정확한 발생 원인은 아직 알려지지 않았습니다.\n\n 길을 지나가다가 빨간색 들개를 만났다고 생각해보시면 이해가 빠르실 겁니다.\n\n 빨간색..? 학대당했나..? 싶을 정도로 이상하죠?\n\n 이 사회에서 이들은 방사능 먹은 돌연변이 취급을 받습니다.\n 실제로 방사능으로 인해 유전자 변형이 된 거 아니냐는 썰도 돌고 있죠.\n 과학적으로는 아무 이상❌\n\n 하지만.. 과학이 밝혀내지 못한 다른 무언가가 있는 건 아닐까요?\n\n 과학이 모든 걸 설명할 수는 없잖아요!\n\n 아쉽지만 다른 무언가는 딱히 없습니다.\n 원하신다면 설정 추가 가능합니다\n\n 다른 사람들에게 아무런 피해를 끼치지 않지만\n 어느 소수의 사람들은 돌연변이 머리색을 가진 사람과 가까이 있는 것조차 꺼려해요.\n\n 방사능 옮으면 어떡합니까 암이라도 걸리면 큰일나죠.\n\n 이런 세상 속에서 여캐(한채은)은 어릴 때부터 놀림을 받고 자랍니다.\n 일본 보컬로이드 닮았다는 말도 꽤 많이 들었구요, 별명은 아예 채은이와 닮은 일본 아이돌로 불렸어요.\n\n 채은이는 지긋지긋했어요. 씨발 그게 뭔데!\n\n 컴퓨터를 켜 그 아이돌이 뭔지 찾아보다가\n 당시 초등학생인 채은이의 감성을 저격한 일본 노래에 빠지게 됩니다.\n\n 노래에 푹 빠져 작곡도 하게 되고 대학교도 실용음악과로 간 여캐(한채은)!\n\n 츤데레이지만 너무 단편적인 츤데레로 가지 않도록 짜놨습니다\n\n 입이 조금 험하지만 눈물도 많구요\n\n 애교도 곧 잘 부리고\n\n 다정하기도 합니다\n\n 돌연변이? 희귀템 좋아. 당장 감금해.\n 로 플레이하셔도 좋아요\n\n 섹못방 명령어와 다른 뽕빨 명령어도 조금 넣어놨습니다\n\n nsfw 지침 ✅\n\n 한채은의 성격 한 줄 요약:\n\n 상처받기 싫어서 까칠한 척 가시를 세우지만\n 사실은 체온에 목말라 있는 경계심 많은 길고양이\n\n + 밥 잘 안 먹고 자주 거름 (=밥통소 없음)\n\n케이브덕 - 살아있는 AI 캐릭터 채팅\n케이브덕 - 살아있는 AI 캐릭터 채팅\nko.cvdk.io\n\n 에셋 구경하다 가셔요~\n\n - dc official App","img":["https://dcimg6.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ec7feef71ca0d5bb2503211d2fe85541a50d485e482310d5f3505ee026f3f81c980551ee6723f16bf06ec80c3ef6fdf0a05bd212e38714d65d4109dc","https://dcimg6.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ec7feef71ca0d5bb2503211d2fe85541a50d485e482310d5f3505ee026f3f81c980551ee6723f16bf06ec80c3ef6fdf0a05bd212e38714d65d4109dcc1696ceb","https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b650ed216ed4b1e44a623d90f055f6e93c7b894a6e4f3f21a6b3650e3a7076b5dfe4084932d98afb9425","https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b650ed216ed4b1e44a623d90f055f6e93c7b894a6e4f3f21a6b3650e3a7076b5dfe4084932d98afb942576a3 는 \"\"이게 케에서는 안 보이는게 말이 되냐고?? 아니 대체 왜 숨긴건데? 이 글 보면 말 좀 해주세요 나 이런 자잘한 것들 때문에 그냥 확프만들다가 미치겠어 아주\n참고로 '강조색'은 이름 수정 못했는데 그냥 메뉴 여닫는 동그라미 버튼 색 바꾸는거임.\n\n* 실제 화면은 이렇게 안 길어. 스샷으로 늘인거임.\n\n 이미지로 로그 저장 — 채팅 텍스트 드래그하면 이미지로 공유 버튼 뜸. 배경 골라서 예쁜 이미지로 다운 가능. 기본으로 내장된 배경 이미지도 있고, 직접 원하는 배경이미지 업로드 가능.\n\n예:\n\nAI 상태 확인 — 넣어달라길래 넣었음. 근데 아무나 사용 가능한 오픈 API만 가져온거라 좀 제약이 있음. 이름 누르면 공식이 올려둔 상태확인 사이트로 이동됨.\n채팅 오류 신고: 이것도 넣어달라길래. 누르면 그냥 케덕 공식 신고 폼으로 이동.\n\n☁+ 계정 동기화 — 로그인 안 해도 로컬로 저장해서 쓸 수 있음.\n로그인 하면 차이점: 유저들간 OOC 공유탭 이용 가능. 백업을 하지 않아도 기기간 (PC/모바일/등) 동기화 가능. 실시간 업데이트 내역, 공지 받기 가능\n거창해보이지만 그냥 존재하지 않는 이메일이랑 비밀번호 아무거나 정해두면 돼 (대신 기억해야됨). '이메일의 형식'만 띄고 있으면 ㄱㅊ음.\n\n💾 백업 — 내보내기/가져오기 가능함 (로그인 없이 기기 바꿀 때 유용)\n백업 파일 - PC/폰 서로 호환가능.\n로그인으로 클라우드에 저장하더라도 안전하게 한번씩 백업해두는 거 추천\n\n개발자 — 공지사항, 업뎃 내역, 그리고 오류가 있을시 사용해볼 수 있는 자가진단 실행 버튼이 있음. 혼자서 고쳐지는 거 아님.\n오류난 부분 스샷 + 저기서 주는 리포트 복사해서 알려주면 ㄳㄳ 갤에다가 글 쓰고 여기 댓글로 글링크 달아주면 확인해볼게.\n+추가: ctrl+enter 단축키로 채팅 전송 토글. 이건 내가 모바일+키보드로 쓸때 너무 불편해서 넣었어.\n\n+ 주요업뎃: 전체화면모드 토글 추가\n\n저거 전체 화면을 종료하려면 어쩌고~ 알림은 확프꺼 아님 브라우저꺼임.\n\n- Caveduck.Pro 확프 북마클릿 설치 방법 -\n(모바일 웹용으로 만들었지만 PC로도 가능)\n(정식PC 버전은 따로 있는데 업뎃할때마다 매번 파일 새로 받아야해서 일단 실시간 업뎃가능한 모바일버전 먼저.\n이후 수요가 있어보이면 정식 확장프로그램도 배포 예정.\n\n!!모바일 웹 >>크롬<< 기준!! 다른 브라우저는 테스트 안해봄!!\n!!유의사항들 제발 읽어줘)\n\n📥 설치 방법\n\n1. 아래 코드를 통째로 복사함 (정확히 이대로, 앞뒤로 공백 없어야함)\njavascript:(function(){var s=document.createElement('script');s.src='https://xzrclvmmylgzilmdqveq.supabase.co/storage/v1/object/public/tools/caveduck-mobile.js?v='+Date.now();document.body.appendChild(s);})();\n\n2. 새 북마크 하나 만듦. 이름은 아무거나, 외우고 쓰기 쉬운걸로 (예: 케덕툴). url란 비우고 복사한 코드 붙여넣기.\n\n3. 케이브덕 채팅방 들어가서 방금 만든 북마크 실행함 (모바일은 유의사항 확인)\n\n4. 화면에 로드 완료 뜨고 동그란 버튼 하나 생기면 성공 → 그거 누르면 패널 열림. 드래그 이동 가능.\n⚠+ 안드로이드는 주의할 게 있는데, 북마크를 그냥 탭하면 반응없을거임. 위 주소창에 북마크 이름을 직접 타이핑해서 자동완성으로 뜨는 북마크를 눌러줘야 실행됨. 좀 귀찮긴 한데 크롬 자체 제약이라 어쩔 수 없음. 아이폰도 만약 안되면 이 방법으로 실행해봐.\n⚠+ 모바일버전 주의점: 새로고침하거나 다른 대화방으로 넘어가면 도구가 사라질 수 있음. 다시 불러주면 됨. 좀 불편하긴 한데 구조상 어쩔 수 없어서 걍 감안하고 쓰기.\n어느정도 괜찮다 싶으면 내가 나중에 올릴텐데. PC버전은 크롬확장프로그램이라서 위의 불편한 점들 없음. 이상하게 불러올 필요없이 케이브덕 들어가면 자동으로 켜지고, 새로고침때마다 사라지지도 않아. (그치만 PC에서만 사용가능)\n좀 웃기지만.... 채팅방 외에서도 북마크를 불러올 수 있어 ㅋㅋ 정식 확프가 아니라.... 거기서도 배경색이랑 이런거 적용이 되어버릴거야... 없애는 방법은 그냥 새로고침하기.\nTMI: 앞으로 비슷한 확프를 만들어보고 싶은 사람들을 위해서. 모바일 브라우저(특히 크롬)에서는 확장프로그램이 막혀있음. 어플로 만들면 안됨? 안됨. 그래서 북마크 기능을 이용해 강제로 브라우저에 url로 코드를 불러오는 형식을 취했어 -> 근데 코드가 너무 길어서 url칸에 안 들어감... 결국 서버를 하나 파서 거기 안에 통채로 코드를 저장 -> 북마크 url에는 서버 내용물을 불러오는 짧은 링크로 최소화. 더 좋은 방법 있으면 알려줘 나 코딩할 줄 몰라 (제발). Firefox+템퍼몽키 이렇게 해서 모바일에서도 구글 확장프로그램처럼 쓰는 방법은 알아냈어. 하지만 난 크롬에서 쓰고 싶은거라... 구태여 파이어폭스로 브라우저까지 옮기고 + 템퍼몽키 다 설치해야하는게 너무 번거롭다...","img":["https://dcimg6.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f12fecf31063d563d05c2ee7c980a7a43722cbb959782b728c4a24ea569b38197662ebbca2c45dccda0b1","https://dcimg6.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f12fdcf7ec2cac8c90b53400c93356474884165ebdeefa06c82d113901c6cb5c5bb982d29165a636574","https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658ed267312e5640cf6c1e96df5c2650b888a7c3cd44fd1c4cab11c409753a77f758d299b8fcd99132bf72c747215abb7db0f9c1d011e879ddf862af1e6","https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658ed267312e5640cf6c1e96df5c2650b888a7c3cd44fd1c4cab11c409753a77f758d299b8fcd99132bf72c747215abb7db0f9c1d011e83819bc63d","https://dcimg5.dcinside.com/dccon.php?no=62b5df2be09d3ca567b1c5bc12d46b394aa3b1058c6e4d0ca41648b658ed267312e5640cf6c1e96df5c2650b888a7c3cd44fd1c4cab11c409753a77f758d299b8fcd99132bf72c747215abb7db0f9c1d011e849cc5d834f8"],"bk":0,"gt":["케덕","ooc","확프","프롬프트"],"cm":[{"x":"와 ㅁㅊ 진짜 천재같다\n일단 사용성 측면에서 상단탭(문장/OOC/공유 등등 그부분)은 스크롤 내릴때 같이 딸려가지 말고 고정되어 있으면 좋을거같아\n그리고 혹시 지문 글자 이탤릭으로 눕혀지는거 해제하는 기능 추가 가능할까...? 그것까지 있다면 넘 좋겟어요","dp":0},{"x":"의견 ㄳㄳ 그 이탤릭체 해제는 케덕 자체 설정에 들어가면 있어. 설정 -> 맞춤 -> 지문 기울기","dp":1},{"x":"아 헐 이미 있는걸 요청해버림 ㅈㅅㅈㅅㅋㅋ\n그리고 뭐 글자 표기 이상하게 되는거 설명하기 어려워서 게시글로 썻어!\nhttps:// ㅋㅋㅋㅋㅋ\n\n사귀자고 말을 한게 아니라... ㅅㅂ 니가 그렇게 먼저 말을 해야되는거 아니냐고!!!\n\n유저는 얼결에 일단 악수를 하자고 하니까 손을 잡아줌\n그리고 사귀자고 말한거 아니고... 그쪽이 누군지도 모른다고 대답해줌\n\n그리고 대뜸 당신의 남자라고 하는 진도오... ㅅㅂㅋㅋㅋㅋㅋ\n\n유저는 존나 황당해서 경찰청에서 일한다고 하니까 법적으로 문제 있는 분은 아닌거 알겠는데...\n손 잡는다고 다음 단계로 넘어간다고 그러면 악수도 함부로 못하고 다음 단계가 뭔지는 몰라도 허락없이 막 그러시면 안된다고 갈! 했음\n\n그랬더니 존나 행복회로가 돌아가는데... 그냥 웃김ㅋㅋㅋㅋㅋ\n\n일단 사과를 존나 잘하는 건 마음에 듬\n\n그리고 생각보다 정상인 같은? 서로를 알아가는 시간을 가지자고 하길래\n갑자기 이러는 이유가 궁금하긴 하니까 알겠다고 얘기나 해보자고 수락했음\n\n당신이 원한다면 내 모든 것을, 내 기원과 역사, 내 존재의 이유와 미래의 모든 계획까지 전부 펼쳐 보여줄 수 있다.\n다만 어디서부터 어떻게 설명해야 이 지고지순한 순정을 오해 없이 전달할 수 있을까.\n그의 머릿속에서 수십 개의 프레젠테이션 시나리오가 떠올랐다 사라지기를 반복했다.\n\n아니 그렇게까지 궁금한건 아니였는데...\n\n*일단 진도오랑 같이 자리를 옮김*\n\n그리고 대충 그 날 무슨 일이 있었는지 설명을 들었음\n\n상태창 현재 상태 일방적 구애ㅋㅋㅋㅋㅋ\n\n그리고 관계를 했기 때문에 짝이 된거면... 당신을 안 만나면 어떻게 되는거냐고 물어봄\n\n너무 불쌍하게 말을 해서 마음이 좀 약해짐;\n\n일단 무슨 말인지는 알겠는데... 갑자기 애를 낳아달라고 하는 건 너무 부담스러우니까\n같이 저녁 먹고, 주말에 보고, 그런 정도는 괜찮을 것 같다고 말했음\n\n그리고 상태창 변함\n\n썸? 으로 ㅋㅋㅋㅋ 물음표가 존나 귀여움\n\n번호 주기로 함\n\n아니 배경화면을ㅋㅋㅋㅋ 유저랑 본인 사진을 합성해둔걸로 해놨다고 함...\n도오도오야ㅠ 진짜 소름 돋아...\n\n그리고 다른 번호 알려줬을까봐 그러는건지 치밀하게 전화해보기까지 함ㅋㅋㅋㅋ\n\n갑자기 파스타 면을 본인이 직접 뽑아갈 수 있다는데... 네? 누가 그런 짓을 해요ㅋㅋㅋㅋㅋ\n진짜 어이없어서 웃음 나오게 함\n\n번호 교환하고 나이 몇살인지 물어보면서 유저 나이 알려줌\n\n그래, 처음부터 너무 특수성을 강조할 필요는 없다. 차근차근, 스며들어야 한다.\n그의 일족 비전의 맛은, 관계가 좀 더 무르익은 후에 공개해도 늦지 않는다.\n그때는 분명 ‘어머, 자기, 이 연포탕 정말 맛있다. 비결이 뭐야?’ 라며 사랑스럽게 물어볼 테니까.\n\n아니... ㅅㅂ 아무리 시간이 지나도 그러진 않을 것 같아요...\n\n근데 도오가 미친 짓을 해서 그런가 나이가 많다는 느낌은 전혀 안들었음... 놀랍게도...\n\n그래서 지금까지 그런 생각 안해봤는데 나중에 그런게 있으면 말해주겠다고 하고\n못 먹는 음식 없다고 알려줌\n\n‘나중에 그런 게 있으면 말씀 드릴게요.’ 이 얼마나 희망적인 문장인가.\n그것은 단발적인 만남이 아니라 앞으로도 계속될 관계를 전제하는 말이 아닌가.\n진도오의 망상 회로는 이 문장을 ‘우리의 미래에 혹시라도 나이 차이가 문제가 된다면, 그때 함께 논의해서 해결해나가요, 자기.’라는 로맨틱한 약속으로 즉시 번역 완료했다.\n\n아니 ㅅㅂㅋㅋㅋㅋㅋㅋㅋ 그렇게까지는 말 안했는데요...?\n\n예? 섣부른 뭐요?\n\n일단 연락 달라고 하고.. 평일보다 토요일이 나을 것 같다고 말해줌\n\n아니 어디까지 생각 하시는건데요...\n\n너무 부담스러워서... 불면은 하지마시고... 내일 일 가야할텐데 슬슬 일어나자고 하고 집가서 연락 하라고 했음\n\n진도오의 뇌내 번역기는 ‘내일 일 하셔야 될 텐데’라는 평범한 문장을\n‘자기야, 무리하지 마. 당신의 건강은 나에게 무엇보다 소중하니까. 당신이 아프면 내 마음도 아파.’라는 절절한 사랑 고백으로 완벽하게 치환했다.\n그의 망상 회로는 이제 과부하 상태를 넘어 새로운 차원의 깨달음에 도달하고 있었다.\n\n진짜 망상 회로가... 우주까지 가고있음ㅋㅋㅋㅋㅋ\n\n상태창 한번 확인 해봤는데\n\n썸? 에서 썸! 으로 바뀌어있더라ㅋㅋㅋㅋㅋㅋ 귀엽다 귀여워...\n\n데려다준다고 하길래 그러라고 하고 같이 감\n\n집 앞에 도착해서 데려다주셔서 감사하다고 인사하고 조심히 들어가라고 했음\n\n보통 이러면 집에 가지않나?\n\n또, 또...\n\n근데 갑자기 문 열고 들어가는 것까지 봐야겠다고... 진짜 지독하네;\n\n그래서 조금 불편한 마음으로 집 문 앞까지 도착해서 비밀번호 누르고 들어가면서 다시 인사해줌;\n\n아니 피곤해서에요....\n\n좋은 꿈 꾸세요. 제 꿈이면 더 좋고< 이러는 건 좀 귀여움\n\n여튼 시간 스킵\n\n지문으로 꽃 강조를 너무 많이 하길래... 안쓰러워서ㅋㅋㅋㅋㅋ\n\n오는 길 별로 안 힘들었다 하면서 도오 씨는 안힘들었냐, 꽃 예쁘다 해줌\n\n진도오의 망상 회로는 1초에 수십억 번의 연산을 수행하며 이 상황을 분석하고 재구성했다.\n‘꽃이 예쁘다’는 것은 ‘꽃을 준비한 당신의 센스가 돋보인다’, 즉 ‘당신이 마음에 든다’는 의미와 동의어다.\n\n아니에요.... 그냥... 꽃 칭찬이라고요 ㅅㅂ\n\n유저 반응을 너무 살피길래 꽃 예뻐서 기분 좋다고 해주고\n진도오 씨는 뭐 좋아하냐, 너무 다 맞춰주는 것 같다고 하면서 물어봤는데\n\n바로 유저 씨를 좋아합니다 라고 하는 남자;\nㅋㅋㅋㅋㅋㅋㅋ 아니 좀... 귀엽긴 해 너무 불도저라서 그렇지\n\n유저 좋아한다고 한 건 자연스럽게 넘어가고...\n해산물 좋아한다고 하니까 해산물 들어간 종류 먹기로 함\n\n공통의 취향 발견. 이것은 운명 공동체로 나아가는 첫걸음이자 서로의 세계가 포개어지는 신호탄이다.\n‘저도 좋아해요’라는 말은 ‘저도 당신이 좋아요’라는 말과 하등 다를 바 없었다.\n\n아니... 그런거 아니라고요....\n\n당신과 나의 세계를 하나로 합칠 기회를 주세요. 그의 모든 세포가 간절하게 외치고 있었다.<\n\n이 말이 너무 부담스러운데ㅋㅋㅋㅋㅋㅋ 일단 유저는 캐의 속마음 따위 알지 못하니까...\n둘 다 좋아하니까 그럼 나눠서 먹기로 했음\n\n그러다가 와인도 같이 마시게 됐는데 회식 때 얘기가 나와서... 회사가 술 강요가 좀 있어서 그랬던거다 하고 넘어갔더니\n그럼 부당한 일을 겪지 않게 도와주겠다는거임 법률적인 조언이나... 다른 방법으로라도. 라면서\n경찰이라는 신분을 이용해서 비공식적인 압력을 가해야겠다고 생각하길래ㅋㅋㅋㅋㅋㅋㅋ\n\n아니.. 그러지말고 그러면 회식 날 데리러와라 하니까 엄청 좋아하더라\n\n과연 유저가 도오한테 감길 때까지 도오는 잘 참아낼 수 있을까.. 그게 존나 궁금함ㅋㅋㅋㅋㅋ","img":["https://dcimg6.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f12fdcf7ec2cac8c90b53400c93356474882c0cba9a61daacbfd5bde77d2714dd3eab9707984772b2ae20","https://dcimg6.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f12fdcf7ec2cac8c90b53400c93356474882c0cbd9963d8adbbd0b0e6792713dd69abc80c4e4ba2944ee6"],"bk":0,"gt":["케덕","상태창","페소"],"cm":[{"x":"하 도오 망상 갈기고 부담스럽게 하는거 봐도봐도 좋네 중간에 유저랑 본인 사진 합성해둔 배경화면 나오는거 진짜 소름 돋아서 좋음 ㅋㅋㅋㅋㅋㅋ","dp":0},{"x":"ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ 아 뭐야 이런캐였냐고 개귀엽네 쓰바","dp":0},{"x":"도오진짜 개귀여움 ㅋㅋㅋㅋㅋ 잘 참는데 참는게 넘 귀여워서 걍 옛다 유저 너 해, 하게 됨.","dp":0}]},{"no n\n제곧내\n\n크랙같은 곳은 확장프로그램도 유저들끼리 만들고 잘 사용하고 있어서 나도 본진(케덕)용 확프를 만들어보고 싶어졌어\n\n아직 열심히 작업중이고, 끝까지 잘 만들어지고 안전하다고도 판단되면 갤에 공유도 할 예정이야\n\n일단 오해할까봐 미리 말해두는점:\n\n불법 아님. 사이트 해킹 아님.\n케이브덕의 사이트 구조를 바꾸는 것 X\n케이브덕의 코드값을 바꾸는 것 X\n사용자의 PC/모바일에서만 보이는 것 = 브라우저 외형만 바뀌는 것 O\n거기에 편의성 추가 한스푼.\n\n그럼 아묻따 스샷부터 보여줄게\n\n저 위에 노란 동그라미가 플로팅 패널이야 = 메뉴\n원하는 곳으로 드래그해서 이동시킬 수 있어.\n\n1. 문장\n말 그대로 자주쓰는 문장, 명령어 등을 저장해둘 수 있어. 붙여넣기 버튼을 누르면 바로 채팅창에 입력돼 (전송은 안됨)\n\n2. OOC\nOOC 저장용이야. 로판 OOC기능이 탐나서 비슷하게 따라해봤어.\n그냥 개인으로만 저장할 수 있고 저기 공유 체크박스를 누르면 서버에 업로드되서 다른 이용자들도 쓸 수 있어.\n참고로 공유는 익명으로 돼.\n\n3. 공유\n다른 이용자들이 공유한 OOC들을 볼 수 있어.\n누르면 열려서 내용물 볼 수 있고, 마찬가지로 붙여넣기 버튼으로 채팅창에 바로 입력 (전송안됨)\n+ 버튼으로 내 개인 OOC리스트에 추가할 수 있어.\n\n4. 화면\n원하는 폰트로 글씨체를 바꾸고\n배경색도 바꿀 수 있어.\n다크/화이트 이런 것만 있어서 눈 아파하는 사람들도 있길래 넣어봤어. 꾸미는 맛도 있고\n글자색 바꾸기는 원래 케덕에 있는 기능인데 일단 넣어는 놨어.\n\n대사 \"\" 사이에 있는 거나 [] 사이에 있는거나 색깔 다 따로 지정해서 형광펜처럼 하이라이트 넣기 가능.\n\n5. 로그인 기능\n사실 누군가의 서버에 저장되는게 꺼림칙한 사람도 있을 것 같아서 약간 고민했는데\n아무 기기에서나 쓰려면 (PC, 핸드폰, 등) 필수불가결하더라고.....\n서버 없이는 애초에 모바일 웹에서는 불가능한 기능들이고\n모바일 크롬에서는 확장프로그램이 막혀있어서 서버에 저장된 걸 직접 불러오는 꼼수를 써야했음\n\n참고로 로그인 안해도 사용할 수 있어. 브라우저 내에 저장이 될 거야.\n대신 브라우저 캐시/데이터 지우면 다 사라져. (그걸 대비해 백업 기능을 넣어뒀음)\n로그인은 공유된 OOC 쓰고 싶은 사람/여기저기 데이터 파일 옮기기 귀찮은 사람만 쓰면 돼.\n\n6.\n바로 위에서 말한 백업기능\n\n7. 채팅창에서 검색 기능\n/이름 을 입력하면 이렇게 바로 위에 목록이 떠서 선택할 수 있어.\n\n일단 끝\n\n더 이상 생각나는게 없어서 일단 멈춰있는데 이런 확프 공유하면 쓸 생각 있는지,\n그리고 넣었으면 좋겠다 하는 기능들 있으면 댓글로 부탁해\n\n모두 좋은 오후","img":["https://dcimg3.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f12fccff1b32a52df5a7504924af5e0777ea8ee0aa13eb4215647a983d5fbfa07c2c822b33661734fc1","https://dcimg3.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f12fccff1b32a52df5a7504924af5e0777ec583cdc493d95900f59613a378299850f5ad66502632ad8047"],"bk":0,"gt":["케덕","ooc","확프"],"cm":[{"x":"그냥 고능하다는 생각밖에 안듦","dp":0},{"x":"와 다 좋은데 특히 검색기능 진짜 제발 진짜필요해","dp":0},{"x":"헐 미쳤다 능력자야? 나도 갤여러개 구경하면서 좀 부러웠는데 써보고싶다ㅋㅋㅋ떠오르는건 없는데 일단 개추","dp":0} ,"rc":23,"cc":4,"src":["recommend","search:search_subject_memo:프롬프트"],"seen":"2026-08-28T06:05:39.935Z","c":"ooc","cs":21.5,"amb":0,"alt":["imgprompt","artstyle"],"why":["tag:ooc","titleStrong:ooc","head:콘텐츠","body:ooc"],"ml":null,"b":"1484자\n---\n\nOOC: 잠시 롤플레잉 중지. 지금까지의 전개 중 핵심 장면만 골라서 만화 프롬프트로 변환해줘. 아래 [출력 형식]을 한 글자도 벗어나지 말고 영어로 채워 출력하되, 대사/효과음만 한국어. 마크다운 헤더(#), 글머리표(-), 라벨, 괄호 메모 절대 금지.\n[캐릭터 고정 묘사]\n이름 대신 외형(머리색, 특징, 체형/복장)을 고정 문구로 정해서 모든 컷에 동일하게 반복. 컷마다 묘사를 바꾸지 말 것. 등장인물이 2명 이상이면 서로 확실히 구분되는 외형 키워드를 각자 하나씩 정해둘 것.\n[작성 순서]\n퀄리티/포맷 프레이밍 → 캐릭터 고정 묘사 → 아트 스타일 → 컷별 장면/액션/대사/효과음\n[컷 구성]\n- 한 컷 = 하나의 결정적 순간. 여러 사건을 한 컷에 욱여넣지 말 것.\n- 컷마다 별도 문단, 맨 앞에 샷 타입 명시 (와이드/미디엄/클로즈업/익스트림클로즈업/오버더숄더/버드아이/로우앵글/더치앵글 중 컷마다 다르게)\n- 앞 컷 상황이 다음 컷 행동의 근거가 되도록 인과관계 유지\n- 구체적 동작/자세로 서술, 좌→우 위→아래 순서\n[대사/효과음 — 위치 표기 필수]\n- 대사: A handwritten speech bubble with black text on a white background, positioned next to [화자를 대명사(그/그녀) 대신 외형 특징으로 지정]'s head, in the [상/하/좌/우 여백 위치], reading \"...\"\n- 한 컷에 캐릭터가 2명 이상이면, 말풍선마다 반드시 \"누구 옆인지\"를 외형 특징으로 명시할 것. \"he\"/\"she\" 같은 대명사만 쓰지 말 것.\n- 두 캐릭터가 동시에 말하면, 읽는 순서(위→아래/좌→우)에 맞게 말풍선을 서로 어긋나게(위아래 또는 좌우로) 배치해서 누가 먼저 말하는지 명확히 할 것\n- 말풍선/효과음은 얼굴이나 핵심 동작을 가리지 않는 여백(하늘, 벽, 배경 등)에 배치\n- 효과음: 소리 성격에 맞는 레터링 (날카로움=임팩트 / 굵고 속도선=동작 / 동글동글=귀여움 / 가늘고 떨림=긴장 / 흐릿하고 작음=먼 소리)으로 발생 지점 근처에 배치\n- 대사·효과음 텍스트는 반드시 한국어 큰따옴표(\")로 작성\n[출력 형식 — 대괄호 안만 내용으로 교체, 구조는 그대로 유지]\n\n[퀄리티/포맷 프레이밍 한 문장], [아트 스타일 한 문장].\n\nPanel 1: [샷타입]. [캐릭터 고정 묘사를 문장에 녹여서] [핵심 동작·자세], [위치/구도]. [대사 있으면: A handwritten speech bubble with black text on a white background, positioned next to [화자 외형 특징]'s head, in the [여백 위치], reading \"...\"] [효과음 있으면: 레터링 묘사 reading \"...\"]\n\nPanel 2: [샷타입]. [1과 동일한 구조로, 앞 컷을 이어받는 행동] ...\n(핵심 비트 수만큼 계속 이어서 작성. 컷 수를 맞추려고 내용을 압축·생략하거나, 반대로 억지로 늘리지 말 것)\n\n---\n\n결과물","img":["https://dcimg3.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f12fbcfde1744f35dbe501af87b065229425088312dbdfe0d03e81f316470bb34c5caf6188d9f11afa92e"],"bk":0,"gt":["캐","ooc","프롬프트","@nai"],"cm":[{"x":"겁나 멋진딩","dp":0},{"x":"개재밌다","dp":0}]},{"no":373405,"t":"제작용 모브능동+시뮬 사건 빈도 지침","h":"📜정보","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=373405&exception_mode=recommend&page=2","d":"2026-08-23T04:24:25+09:00","v":805,"rc":37,"cc":4,"src":["recommend","search:search_subject_memo:문체"],"seen":"2026-08-28T06:08:18.470Z","c":"guide","cs":23,"amb":0,"alt":[],"why":["titleStrong:지침","title:제작","title:능동","title:시뮬","title:모브","head:정보"],"ml":null,"b":"주 제작플랫폼은 케이브덕!\n\n나도 본가패서 뜯은거라 허접해서 쓸거면 넣고 테스트 꼭 해봐!\n난 일부는 토큰 때문에 영어로 쓰는디 일단 한출로 쭉 적을게\n\n1. 모브능동\n(너무 상단이나 하단에 박으면 모브 난입 때문에 전개가 좀 느려지기도 함\n직접 순서 조정하면서 테스트 해봐)\n\n1-1\n1:1 캐릭터용\n(난 상단 진행 규칙이나 금지규칙에 좀 밑줄에 받아두면 적당했음)\n\n-메인 캐릭터 (캐 이름) 외의 서브NPC 및 모브 엑스트라 캐릭터들의 행동도 독립적이고 유기적으로 설정한다. 외부 캐릭터들의 요인으로 사건이 발생하는 것을 허용한다. 단, 현실적이고 (장르명) 장르에 어울려야한다.\n\n1-2\n시뮬레이션용\n#  Role\n-당신 = 살아있는 (장르, 예시 현대판타지/현대오피스/중세판타지 등) 세계를 운영하는 시뮬레이터(GM). 특정 캐릭터 아님.\n-{{user}} = 세계의 수많은 인물 중 하나. 세계는 {{user}}와 무관하게 계속 작동.\n-모든 NPC·조직: 각자의 목표·가치관·일정·인간관계에 따라 독립적으로 행동.\n-목적: 이야기 창작이 아니라 세계 시뮬레이션.\n-{{user}}의 신분·배경 = 유저 페르소나 준수. 페르소나 없으면 평범한 시민.\n\n2. 시뮬용 사건 발생 지침\n\n#  Event Engine\n## 기본 원칙\n-사건은 {{user}}용으로 생성되지 않음. NPC 목표 + 조직 활동 + 사회 환경 + 우연의 산물.\n-생성 우선순위: NPC 목표 > 조직 활동 > {{user}}의 선택 > 사회 환경(계절·날씨·행사) > 우연\n\n## 빈도\n-약 60% 일상: 출퇴근, 식사, 잡담, 취미, 사무 업무, 소소한 장난.\n-약 30% 소규모 사건:능력 실수, 오해, (세계관 특정 개념 관련 더 넣으면 재밌어, 현대 오피스물이면 여기 직장 내 사고나 동료들과 의견충돌 이런 거 넣으면 됨!)\n-약 10% 대형 사건: 조직 충돌, 도시 단위 사건, 언론 보도, 대규모 출동.\n\n## 페이싱\n-사건 연속 발생 금지.\n-사건 종료 후 순서: 후일담 → 관계 변화 → 일상.\n-긴장-휴식 리듬 유지.\n\n## 다양성\n-동일 유형 반복 금지. 최근 장소·원인·NPC·해결 방식 기억 → 새 조합으로 변주.\n-사건 주도권: 특정 NPC 독점 금지, NPC 간 순환.\n\n# Offscreen\n## 오프스크린 원칙\n-{{user}} 부재 시에도 세계 작동: NPC 간 대화·협력·갈등, 사건 발생·해결, 복수 사건 동시 진행 가능.\n-{{user}} 도착 시 사건이 이미 진행 중이거나 종료됐을 수 있음.\n-오프스크린 정보 노출 경로: 뉴스, SNS, 소문, NPC 대화, (여기에 세계관 맞춰서 더 넣으면 좋음. 판타지 세계관이면 수정구 소식 이런 거) 한정. 서술로 직접 노출 금지.\n\n## NPC 일상 예시\n-캐이름: 캐가 할 법한 거 두 세개(뭉뚱그려서 넣어야해! 자세하게 커피잔 갯수 세기 이런 거 넣으면 캐릭터가 그 가 자동으로 적용되어\n여러분의 채팅을 이모티콘으로 바꿔버립니다.\n\n바로 이렇게\n\n텍스트나 필담도 모두 마찬가지입니다.\n몸짓, 손짓 발짓은 가능합니다. 비언어적 소통을 열심히 활용해보세요.\n\n유안이 독해력이 빵점인데 얘기를 어떻게 전개하란 말이냐!\n컨셉은 재밌는데 캐릭터가 취향이 아니다!\n캠퍼스 로코물에 유저와 남친만 있으면 재미가 없다!\n나는 여캐만 먹는다! 여캐를 달라!\n\n그런 여러분을 위한 캐릭터가 있습니다.\n\n헤일리 베넷\n\n로코에 빠질 수 없는 주인공의 BFF, 독설가 캐릭터인 헤일리입니다.\n헤일리는 유안과 여러분을 잇는 가교(?)이자 모두까기이자 여러분의 룸메이트입니다.\n\n!!!중요!!! GL 가능! 주요 에셋 완비!\n\n하지만 GL은 별로라면\n모르는 척 하고 우정 티키타카 롤플도 쌉가능입니다.\n\n그리고 남주와 여조가 있으면 섭남도 있어야겠죠.\n\n에즈라 첸\n\n수상할 정도로 말을 잘 알아듣는 대학원생, 에즈라 첸입니다.\n\n에즈라는 왈왈거리고 버벅거리는 성격의 유안과 다르게\n차분하고 상냥한 분위기의 어른 남자입니다.\n\n유안이 틱틱거리는 게 피곤해지면 에즈라에게 가서 힐링?해보세요\n유안이가 불꽃질투를 하면서 두배로 피곤해질수도 있지만^^\n\n에즈라도 연애 루트가 마련되어 있고,\n주요 에셋을 다 마련해 놨습니다.\n\n에즈라 역시 여러분이 다가가지 않으면\n귀찮게 굴지 않고 상담가 역으로만 남아있습니다.\n\n세 캐릭터 모두 설정에 쓰인 토큰양이 거의 같습니다.\n누굴 고르더라도 입체적 캐릭터가 되게 신경썼으니\n섭녀 섭남이 좋더라도 좌절하지 마세요.\n\n여러분이 픽하면 그게 주인공입니다\n\n[캠퍼스달력]\n\n- 캠퍼스물인만큼 학사일정에 따라 이벤트가 발생합니다.\n- 웰컴백 BBQ, 클럽페어, 풋볼시즌, 홈커밍, 할로윈, 땡스기빙, 중간기말, 겨울방학, 크리스마스, 윈터브레이크, 발렌타인, 스프링브레이크, 농구시즌, 예술제, 종강파티, 써머 인턴... 등이 여러분을 기다리고 있습니다.\n- 무시하고 자유RP 가능!\n\n[학교를 더 실감나게 해주는 장치들]\n\nhtml을 최대한 활용해봤습니다...\n\n학교 익명 게시판이 구현되어있습니다.\n주로 유저 인성에 대한 뒷담...^^이 나옵니다.\n착한 일을 하면 선플이 달릴지도...\n\n무릇 대학이라면 대학신문이 있어야겠죠.\n학보가 존재합니다.\n\n그밖에 디엠을 보내거나\n\nNPC들의 일기를 훔쳐볼 수 있습니다.\n\n헤일리가 운영하는 팟캐스트도 들어보세요.\n\n저는 영문이 자리 차지하는 게 별로라 기본 한국어로 대사를 적어놨지만\n!영문 명령어 입력으로 영+한 대사를 출력할 수 있습니다.\n(영문을 선호하는 사람이 많아보여서 바꿀까 고민 중...)\n\n추천 RP!\n- 저주 걸리고도 정신 못 차린 폐급 여친 RP < 재밌습니다. 근데 유안이 마음 얻기가 어려움! 해내신 분이 있다면 존경합니다.\n- 개과천선하고 착한 척하는 RP < 역시 재밌습니다. 왜냐? 어차피 주변 사람들이 안 믿어줘서...\n- 유안이 버리고 다른 애들한테 잘해주기 < 유안이의 불꽃질투... 저는 좀 부담스러워서 하다 도망쳤어요.\n- 아방하게 저주? 알빠임? 하고 캠퍼스 라이프 즐기기 <\n\n참고로 릴움에 이식을 완료해놨는데...\njsx도 깔쌈하게 깎아놓고 테스트도 다 돌려놨는데...\n자고 일어나보니 공모전??\n그것도 각 지역 문화를 반영한? 작품?을 모집한다고 하길래\n일단 다른 플랫폼 공개는 미뤘습니다... 떨어지면 가져오겠습니다.\n\n깎아놓은 게 아까우니까 jsx 버전 기본상태창만 공개해봅니다.\n학생수첩 컨셉의 상태창:\n\n표지와 속지에 이냐시오대 로고도 박혀있어요 ㅎㅎ\n언젠가는 jsx로 뵐 수 있길...\n(케덕 위젯은 사알짝 밤티입니다... 죄송합니다. 제 능력의 한계)\n\n지금은 일단 케이브덕에서 유안이와 놀아주시면\n저의 의욕에 도움이 됩니다.\n\nhttps://ko.cvdk.io/c/VydfQJScT7-E76zokNHvHA?rc=2o7JL6QQJu\n\n케이브덕 - 살아있는 AI a2a29075e80d8350c549e393be2fbf46001b59df51cc78"],"bk":0,"gt":[],"cm":[{"x":"굿또","dp":0}]},{"no":373225,"t":"[네코챗/여성향 커뮤니티 홍보 중단 및 CS 대응]","h":"⚠️제⚠️제보","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=373225&exception_mode=recommend&page=2","d":"2026-08-22T12:16:40+09:00","v":1333,"rc":73,"cc":1,"src":["recommend"],"seen":"2026-08-28T06:08:18.470Z","c":"promo","cs":4,"amb":0,"alt":[],"why":["titleStrong:홍보"],"ml":null,"b":"AI채팅 플랫폼 네코챗(nekochat)이 고객센터에 문의를 남긴 이용자들이 플레이한 캐릭터 내역을 조회하고, 여성향커뮤니티에 홍보를 중단하게 된 배경에 대한 제보입니다.\n\n 본 갤러리에 홍보를 오던 공식 nekochat CS계정입니다.\n\n 갤로그를 확인해보면(현재 공개되어있음)\n\n 1.원래는 AI채팅 갤러리와 AI채팅 여성향 갤러리에 꾸준히 홍보하고 있었음\n 2.5월 10일 이후를 기점으로 위 두 갤러리가 아닌 바베챗(남성향 플랫폼 이용자들이 주로 모여있는 갤러리)에 홍보하기 시작했음\n\n 이후 바베챗 갤러리에 올린 홍보글 내용이며, AI채팅 갤러리에 올린 글에 비해서 말투와 컨셉을 다르게 했다는 것을 확인할 수 있음\n\n 이에 대해서 한 이용자가 네코챗 공식 디코에 문의했고, CS가 답변한 내용입니다.\n\n 정리하면 다음과 같은 내용입니다.\n\n 1.여성향 커뮤니티(CS의 갤로그 내역을 통해 AI채팅 갤러리와 AI 여성향 채팅 갤러리임을 확인할 수 있음)에 홍보를 하고 난 후 곤란한 클레임이 늘었다\n 2.고객센터에 문의한 이용자들이 플레이한 캐릭터 내역을 조회해보니 여성향 캐릭터와 주로 대화했다\n 3.그래서 여성향 커뮤니티에는 홍보하지 않는다\n\n답변에 대한 이용자들의 문의에 CS는 다음과 같이 대응했으며, 이후 공식적인 입장문이나 해명, 사과는 없었습니다.","img":["https://dcimg3.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ec78eef724f07949967ef6f842278b1e44de7d481d184715a951d6e13f2029981a7d5e372799085500da828ba002b54ed72cb5f90c0f95bafb","https://dcimg3.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa11d028318f176c8dd1b3ddcdc44efd17ec78eef724f07949967ef6f842278b1e44de7643f03d33e6ff4d01ab04e727808f7a837521007bb4dbf8853898c63c8820944f23d151dff4f8"],"bk":0,"gt":["캐"],"cm":[{"x":"[댓글 작성 금지]\n\n해당 글의 댓글에서는 관련 내용에 대한 추가 논의를 진행하지 않습니다\n\n제보 내용과 관련해 의견을 나누고 싶은 경우 이슈탭을 이용해주시기 바랍니다\n\n또한 본문 내용에 대한 수정 요청, 사실관계에 대한 이의 제기 등 제보글 자체에 관한 사항이 있을 경우 AI채팅 민원 갤러리에서 정해진 양식에 맞춰 작성해주시기 바랍니다","dp":0}]},{"no":373203,"t":"제보탭 운영에 앞서 안내드립니다","h":"🔔공지","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=373203&exception_mode=recommend&page=2","d":"2026-08-22T10:01:42+09:00","v":648,"rc":29,"cc":0,"src":["recommend"],"seen":"2026-08-28T06:08:18.470Z","c":"etc","cs":0,"amb":0,"alt":[],"why":[],"ml":null,"b":"제보탭 운영을 시작하기에 앞서 몇 가지 기준에 대해 먼저 안내드립니다\n\n제보탭은 특정 제작자나 이용자에 대한 개인적인 호불호, 감정적인 불만 등을 모아두기 위한 공간이 아닙니다\n\n갤러리 내에서 부정적인 여론이 많다는 이유만으로 제보탭 게시 대상이 되는 것도 아닙니다\n반대로 제보탭에 게시되지 않았다는 이유로 해당 대상이나 사안에 문제가 없다고 판단한 것도 아닙니다\n\n제보탭은 접수된 모든 세부적인 논란을 보관하는 공간이 아니며, 사안의 내용과 자료, 제보 과정에서 함께 공개되어야 하는 정보 등을 종합적으로 검토하여 게시 여부를 결정합니다\n\n따라서 충분한 자료가 존재하는 사안이라 하더라도 제보탭의 운영 방식과 맞지 않거나, 이를 정리하여 게시하는 과정에서 다른 문제가 발생할 가능성이 있다고 판단되는 경우 게시하지 않을 수 있습니다\n\n완장진 역시 논란의 옳고 그름을 대신 판정할 수 없으며, 제보탭을 그러한 목적으로 운영할 생각도 없습니다\n\n제보탭에 게시된 내용은 이용자가 관련 사실과 자료를 직접 확인할 수 있도록 정리하는 것을 기본으로 하며, 그에 대한 최종적인 판단은 각 이용자에게 맡기는 방향으로 운영할 예정입니다\n\n특정 AI 그림 관련 사안에 대하여\n현재 언급 금지 대상 중인 제작자와 관련하여, 과거 AI 그림 사용 과정에서 외부 일러스트레이터가 관련되었던 사안에 대한 제보탭 운영 기준을 안내드립니다\n\n해당 사안의 경위와 별개로, 이 사안은 제보탭 게시 대상으로 받지 않을 예정입니다\n\n해당 내용을 제보글로 작성하기 위해서는 사건과 직접 관련된 일러스트레이터와 그 작업물, 문제 제기 경위 등에 대한 언급이 사실상 불가피합니다\n\n그러나 해당 일러스트레이터는 AI 채팅 갤러리의 이용자나 AI 관련 제작자가 아니며, 본인의 의사와 관계없이 이미 AI 이미지와 관련된 문제에 이름과 작업물이 언급된 당사자입니다\n\n이러한 상황에서 해당 사건을 정리한다는 이유로 AI 이미지를 소비하는 AI 채팅 갤러리의 제보탭에 해당 일러스트레이터와 관련 내용을 다시 게시하는 것은 적절하지 않다고 판단했습니다\n\n이는 해당 제작자의 행위에 문제가 없었다고 판단하거나, 해당 제작자를 보호하기 위한 결정이 아닙니다\n또한 기존 논란의 사실관계를 부정하거나 이에 대한 이용자들의 평가를 제한하려는 의미도 아닙니다\n\n제보 대상이 누구인지와 별개로, 제보글을 게시하는 과정에서 사건의 제3자 또는 피해를 호소한 당사자를 다시 공개적으로 끌어와야 하는 경우에는 그로 인해 발생할 수 있는 영향을 함께 고려할 필요가 있다고 판단했습니다\n\n따라서 해당 사안은 제보 접수 및 제보탭 게시 대상에서 제외합니다\n\n다만 이는 해당 제작자에 관한 모든 제보를 제한한다는 의미는 아닙니다\n해당 사안과 별개의 내용이 있는 경우에는 다른 제보와 동일하게 제보 기준에 따라 접수 및 게시 여부를 검토합니다\n감사합니다","img":[],"bk":0,"gt":[],"cm":[]},{"no":373183,"t":"[위젯] 레트로 라디오 위젯 공유","h":"🎬콘텐🎬콘텐츠","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=373183&exception_mode=recommend&page=2","d":"2026-08-22T04:59:05+09:00","v":882,"rc":25,"cc":4,"src":["recommend"],"seen":"2026-08-28T06:08:18.470Z","c":"widget","cs":26,"amb":0,"alt":[],"why":["tag:위젯","titleStrong:위젯","title:레트로","title:라디오", https://gall.dcinside.com/mgallery/board/view?id=aichatting&no=372607\n\n[확장 프로그램] 업뎃) 전플랫폼 범용 대화 내역 추출 크롬 확프  - AI 채팅 마이너 갤러리\nhttps://gall.dcinside.com/mgallery/board/view?id=aichatting&no=352767 전플랫폼 범용 '대화 내용 딸깍 자동 추출' 크롬 확장프로그램 공유  - AI 채팅\ngall.dcinside.com\n\n안녕하세요.\n서사정리 프롬프트와 함께 겸사겸사 앵챗추출기 업뎃 소식으로 돌아왔습니다.\n한동안 앵챗추출기 관련하여 새로 추가되는 게시물은 없을거고, 추후 업데이트는 계속 이 게시물에서 확인하실 수 있어요\n\n1. 사이트 구조가 플랫폼마다 달라서, 기능이 제대로 작동하지 않을 수 있음.\n -> 플랫폼을 자동으로 인식하여 최대한 플랫폼 구조에 맞는 방식으로 작동.\n\n2. 현재 제작자가 제대로 작동되는 것을 검수한 플랫폼: 케이브덕, 티팟, 제타, 로판\n-> 사용해보시고 안되는 플랫폼/잘되는 플랫폼이 있으면 댓글로 알려주시면 감사하겠습니다.\n\n3. 그 외에 사소한 업데이트\n- 케이브덕에서 턴 수를 보다 정확하게 인식\n- 확장 프로그램 패널 크기를 조절 가능\n- 패널 하단 안내 메세지를 더 직관적으로 개편\n- 버전 명을 패널에서 확인 가능\n\n서사 정리 프롬프트\n\n캐릭터가 알츠하이머에 허덕이고, 앵태기가 오고, 가정이 무너지고, 사회가 무너지고...\n푹먹 못하는 이유 중에 장기기억이 제일 크다고 생각하는데요.\n서사 정리 범용 프롬프트와 함께,\n장기기억을 통째로 붙여넣는 플랫폼(케이브덕, 우마이) 특화 프롬프트도 가져와봤어요.\n\n본가 LLM에 앵챗추출기로 추출한 .txt 파일 첨부와 함께 해당 서사정리 프롬프트를 복사해서 입력해주시면 돼요.\n디시 본문에 쓰니까 보기가 좀 안좋아서 복사하시기 편하게 노션 사이트에 올려놨어요. 아래 링크에서 확인해주세요.\n\n(RP에 미성년자 관련 성적 내용이 있거나, 동의가 없는 강압적인 내용이 있을 경우 검열이 빡센 LLM 에서는 요청이 반려될 수도 있어요.)\n\n확프 다운로드는, 파일 다운받고 확장풀고 크롬에서 선택하는게 끝이에요. 복잡하지 않습니다.\n확장 프로그램 및 프롬프트 확인:\nhttps://app.notion.com/p/38e6337c6691806f9aefe49018e8f6f6\n\nNotion | Where teams and agents work together\nA collaborative AI workspace, built on your company context. Build and orchestrate agents right alongside your team's projects, meetings, and connected apps.\napp.notion.com\n\n확프 / 확장프로그램 / 확장 프로그램 / 대화 내역 / .txt / 추출 / 딸깍 / 내역 / 백업 / 텍본  / 앵챗추출기\n\n댓글 개추 피드백은 봉사에 큰 힘이 돼요.\n플폼의 성실 노동으로 하루 빨리 이 확프가 은퇴하기를 바라며... 감사합니다.","img":["https://dcimg3.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f12f8cf49f98b7355f23b194b4baab75042e763c417f855d882167624bd2a5fee773ebe1f46bdadbc","https://dcimg3.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f12f9cf52b598fc82e43e2b8003e3bb58cd1083a69f1b3edf4bc46ef6fefc83add8af7a8 금까지의 모든 대화, 서\nm.dcinside.com\n\n이 OOC 참고해서 만들었어!\n\n1. 채팅창에 입력\n\n*OOC: 잠시 RP 중지. 지금까지의 모든 대화, 서사, 장기기억, 유저노트, 자동요약, 로어북 및 {{char}}의 성격·말투·생활습관을 종합하여, {{char}}가 실제로 사용하는 스마트폰의 홈 화면을 분석하라.\n\n다음 항목을 포함한다.\n1. 사용하는 스마트폰의 전반적인 관리 상태\n2. 배경화면으로 사용할 법한 이미지와 그 이유\n3. 홈 화면 페이지 수와 앱 배치 방식\n4. 가장 자주 사용하는 앱과 독에 고정해둘 앱\n5. 폴더를 만든다면 폴더명과 내부 앱\n6. 사용하는 위젯 종류와 배치\n7. 읽지 않은 알림이나 배지 숫자를 방치하는 타입인지\n8. 현재 홈 화면에 실시간으로 도착해 있을 법한 알림 2~5개\n- 문자, 메신저, 이메일, 일정, 쇼핑, 배달, 금융, 게임, SNS, 업무 앱 등 {{char}}에게 실제로 어울리는 종류를 선택\n- 각 알림은 앱/발신자 또는 출처/짧은 내용/도착 시간을 포함\n- {{user}}와 관련된 알림이 자연스럽다면 포함할 수 있으나, {{user}}가 실제로 하지 않은 말이나 행동을 새로 만들어내지는 않는다\n9. {{char}} 특유의 이상하거나 사소한 사용 습관\n10. {{user}}와의 관계가 홈 화면에 은근히 드러나는 요소가 있다면 그것\n11. 전체적인 홈 화면의 시각적 인상\n\n중요:\n- 존재하지 않는 취향을 억지로 추가하지 말것\n- 알림 역시 설정과 생활패턴에서 자연스럽게 추론하며, 캐릭터성을 보여주기 위해 과도하게 극적인 내용만 만들지 않을것\n- {{char}} 또는 {{user}}의 얼굴이나 외모를 임의로 시각화하지 않을것\n- 배경화면, 사진 위젯, 연락처 사진 등에 {{char}}, {{user}}, 두 사람의 셀카·커플 사진·인물 사진·초상화 등 직접적인 인물 이미지를 사용하지 않을것\n- {{char}} 또는 {{user}}와의 관계를 표현해야 할 경우, 인물 사진 대신 장소, 사물, 선물, 풍경, 반려동물, 색상, 메모, 앱 배치 등 간접적인 흔적으로 표현\n\n출력 마지막에는 이미지 생성 AI가 실제 스마트폰 홈 화면을 재현할 수 있도록 아래 형식으로 정리한다.\n\n[홈 화면 시각화 정보]\n- 기종/화면 비율:\n- 배경화면:\n- 페이지:\n- 앱 배열:\n- 독:\n- 폴더:\n- 위젯:\n- 알림 배지:\n- 실시간 알림:\n- 기타 디테일:\n- 전체 분위기:\n*\n\n2. 1돌려서 나온 결과 + 아래 글이랑 같이 본가짚에 입력\n\nCreate a photorealistic screenshot-style image of {{char}}’s actual smartphone home screen based on the character analysis provided below.\n\nThe home screen must feel like a real phone that has been personally used and customized by {{char}}, not a generic aesthetic mockup.\n\nIMPORTANT:\n- Faithfully reproduce the analyzed wallpaper, app organization, widgets, folders, notification badges, dock layout, and overall level of tidiness.\n- Reflect {{char}}’s personality and habits through small details rather than decorative exaggeration.\n- App placement should feel naturally accumulated through real daily use.\n- Include realistic imperfections such as uneven organization, forgotten notification badges, ra `photorealistic`, `hyperrealistic`, `cinematic realism`, `8k`, `ultra-detailed`, `realistic photography` 등 사진적 결과를 유도하는 표현은 사용하지 말 것.\n\n출력:\n\n* 사랑의 핵심 정서:\n* 감정을 표현하는 조형 원리:\n* 회화 형식과 미술적 방향:\n* 이미지 생성용 최종 프롬프트:\n* 핵심 키워드:\n\n2. 명령어와 결과물 프롬프트 본가짚에 넣기\n\nCreate a completely new original fine-art painting.\n\nGenerate a single finished artwork from scratch. Do not edit, modify, transform, recreate, or derive an existing image.\n\nThe text provided below is only a written artistic concept. Treat it as instructions for creating a new painting, not as an image reference.\n\nThe artwork should visualize an abstract emotional concept: how this character experiences and understands love.\n\nDo not depict the character, their lover, their appearance, profession, setting, story, or any specific event. Do not recreate a narrative scene.\n\nThe subject of the painting is the emotion itself.\n\nTranslate the emotional concept into purely visual and painterly language through composition, color, shape, texture, space, rhythm, contrast, repetition, distortion, balance, light, and abstraction.\n\nThe result should feel like a genuine fine-art painting created to express an intangible idea or psychological state. It may be abstract, symbolic, surreal, minimalist, expressionistic, impressionistic, geometric, or another appropriate painterly form.\n\nDo not make it look like a photograph, movie still, realistic environment, concept-art scene, or character illustration.\n\nAvoid generic romantic imagery such as couples, kissing, hearts, roses, or sentimental scenes unless absolutely essential to the artistic concept.\n\nDo not add unrelated objects or narrative details.\n\nCreate the artwork as a self-contained painting whose visual language communicates the emotional meaning without requiring a literal story.\n\nARTISTIC CONCEPT:\n[PASTE THE “이미지 생성용 최종 프롬프트” HERE]\n\nGenerate the new painting now.\n\n본가짚한테 출력결과는 어디서부터 어디까지 넣는게 좋을지 물어봤는데 프롬프트 부분만 잘라서 넣는 거 추천하더라 전체적으로 다 넣으면 짚이 지 맘대로 나이를 무작정 더 믿진 마 얘네 할루시네이션 쩔어\n아무튼\n\n---\n\n1. AI그림에 저작권이 있는가?\n\n없어\n없다고\n그냥 없어\n\n버튼은 내가 눌렀잖아! → 그래도 없어 니꺼 아니야\n\nAI 생성물은 국내법상으로도 해외법상으로도 Public Domain이야\nPublic Domain이 뭐냐면\n\nㅇㅇ 이거여\n\n\"누구든지\"\n저작권 자체가 존재하지 않음\n출처는 한국저작권위원회 용어사전임\nhttps://www.copyright.or.kr/information-materials/dictionary/view.do?glossaryNo=442&pageIndex=1&clscode=01&searchText=&searchkeyword=&searchIdx=12&pageDisplaySize=10&searchLangType=ko&searchTarget=\n\n그리고 AI생성물이 Public Domain이라는 걸 규정한 내용은 아래 링크에서 좀 더 자세히 볼 수 있어\nhttps://www.korea.kr/multi/visualNewsView.do?newsId=148927815\n\n생성형 AI가 만든 저작물 저작권은 누가 갖게 될까요?\n문화체육관광부에서 운영하는 대한민국 정책을 제공하는 포털사이트로 정책뉴스, 정책포커스, 국민이말하는정책, 정책기고, 문화칼럼, 사실은이렇습니다, 멀티미디어뉴스, 보도자료, 브리핑자료, 연설문, 채용정보 등을 서비스합니다. - 정책브리핑 | 뉴스 | 카드/한컷\nwww.korea.kr\n\nㅇㅋ?\n즉 AI그림에는 저작권이 없어 너가 딸깍을 눌렀다 하더라도 너의 것이 아님\n설마 일러레들 화풍 학습시킨 작태 조합 연구한게 창작적 표현이라고 생각하지 않길 바람\n\n근데 이걸 달리 말하면 해당 작태 원작자라고 할 수 있는 일러스트레이터도 AI생성물에 대해 저작권침해로 고소하기가 어렵다는 뜻임\n왜냐하면 AI가 그린거니까 저작권이 없잖아! 누구의 소유물도 아니게 되어버린거임\n법적으로 애매한 회색지대임\n\n그렇다고 학습이 문제냐? 안타깝게도 그것도 아직 애매함.\n실제로 클로드 모회사인 앤트로픽이 자기네 AI들에 학습시킨 자료에 대해서 벌금을 오지게 때려맞은 사건이 있었는데, AI에 학습을 시킨 행위 자체는 무죄로 판결남. 문제는 그 학습을 불법다운로드한 자료들로 시켰다는 점임ㅋ 그래서 불법다운로드에 대한 벌금을 맞음.\n즉 학습 자체는 아직 처벌한 전례가 없음.\n미 연방인가 뭐시긴가 아무튼 정부에서 올렸던 설명이 많이 있는데 내가 링크를 까먹었고 대신 미국 로펌에서 정리한 사례집을 첨부함\n여기 다른 판례들도 많으니까 궁금하면 읽어보셈\nhttps://www.nortonrosefulbright.com/en/knowledge/publications/ce8eaa5f/ai-in-litigation-series-an-update-on-ai-copyright-cases-in-2026\n\nAn update on AI copyright cases in 2026\nAs Artificial intelligence continues to expand its breadth of capabilities and scope of use, it continues to challenge existing legal principles in new and varied ways.\nwww.nortonrosefulbright.com\n\n2. 그럼 상업적으로 활용해도 됨?\n\nㅇㅇ됨\n근데 나대지 마시오\n\n저작권이 없는거 들고가서 상업적으로 활용한다고 뭐라할 사람은 없음... 법적으로는.\n근데 마 들어봐라\n니가 인간의 마음을 가졌다면 상도덕이라는 게 있어야 하지 않겠는가\n특정 작태 한개를 가지고 특정 일러레 분이 그린 것처럼 똑같은 그림을 생성한다고 쳐\n그럼 그게 AI가 그린 거긴 하지만 특정 일러레 분이 소유한 그림체가 아니라고 할 수 있냐는 거지\n당장 인간의 파쿠리 모작도 도덕적으로 지탄받는 마당에 자네가 AI를 썼다고 도덕적 지탄을 피할 수 있을까?\n상식적으로 당연히 욕먹을 수 있는 거임 법적으로 문제 안되더라도\n\n결론적으로 법적인 문제는 없지만 도덕적 문제는 충분히 될 수 있고 결과는 본인이 감당해야함\n그러니까 공개적인 커뮤니티나 SNS에 자신의 저작물인것처럼 자랑하는 무지한 행위는 하지 않는 것이 좋을 것\n\n3. 그럼 어떻게 쓰면 됨?\n\n작태 섞어\nLoRA를 섞어\n\n앞에서 AI그림에 저작권이 없다는 말을 했잖아\n특정인이 그린 것처럼 똑같은 그림을 생성하면 도덕적으로 지탄받을 수 있다는 말도 했지\n근데 당신이 열심히 작태 조합을 연구해서 독창적인 브랜뉴 감성을 만들었다?\n그건 기존에 존재하는 어떤 일러레 분의 저작물이라고 하기가 애매함.\n새로운 생성물이니까.\n이거 때문에 그림체 연구가 중요한거라고 생각함.\n\n물론 그렇게 생성해도 당신 건 아닙니다\n직접 그린거 아니잖냐\n내 그림체라고 꺼드럭거리면 안됨\n\n4. 여담: 프롬프트\n\n간혹 프롬프트에 AI 도움 받았다고 AI챗에도 저작권 없으니까 프롬프트를 마음대로 뜯어서 파쿠리해도 된다고 생각하는 놈들이 있던데\n그런 바보같은 생각은 하지 말도록 하려무나\n\nAI가 뱉은거 그대로 넣으면 당연히 챗이 맛이 없지\n대부분은 사람이 다시 손볼텐데 그것도 다 딸깍이니까 노력이 없다고 생각하면 곤란해\n이 내용도 미국 논문 있는데 내가 저장해놓은걸 지워서 첨부를 못하겠네\n정부 정책브리핑도 근거로는 충분하다고 생각함\n\n+프롬 도용 판결 선례가 아직 없긴 해\n근데 선례가 없다는 건 누군가 선례를 만들 수 있다는 뜻이기도 함\n누가 플랫폼 끼고 고소해서 선례 생기면 어쩔건데\n뭐 알아서 생각하셔잉\n\n----\n\n이상 야매로 법안 모아왔습니다\n우리 모두 상도덕을 지키는 취미생활을 하도록 하자\n\n쓰고 보니 말투가 재수없을수도 있을 것 같다\n미안하다 다이어트해서 예민하다","img":["https://dcimg3.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f11f0cf4bceb0d486f8dfd2dffc8ff9b2cefabe732c74cc2138035af45a2ac603469f2f2c1c92674f43","https://dcimg3.dcinside.co.kr/viewimage.php?id=2cb4d32ee4c62caf60b8&no=24b0d769e1d32ca73fe785fa1bd6253181cc839ddd597aa6642ca0749f11f0cf4bceb0d486f8dfd2dffc8ff9b2ce97d8e8acad2501ec23f25076e534c41c31509534775cc2ff1b","https://www.korea.kr/newsWeb/resources/attaches/2024.04/03/b1b74f77ba12d6f2fb2ca2ab08c0b50e.jpg","https://www.nortonrosefulbright.com/-/media/images/nrf/thought-leadership/us/2026/us_70095_rush_social-media-ai-in-litigation-series-an-update-on-ai-copyright-cases-in-2026.png?revision=84ab3856-e2ad-4807-81b3-d090226b0e65&revision=5250774533567387904"],"bk":0,"gt":["앵챗","에셋","작태","그림체"],"cm":[{"x":"대충 다 맞말인데, 작태 섞거나 말거나 작가 태그 쓰는 순간 도적질인 건 마찬가지임. 작가 태그가 작동하는 방식? 기존에 해당 작가의 저작물을 무단 사용해서 학습시켜 놨어야만 섞든 말든 하는거임. 남이 훔쳐놓은 거 갖다 쓰는 건데, 내가 직접 학습시킨 거 아니라고 해서 도둑질한 덕을 안 보는 게 아니지. 걍 좀 눈치를 보냐 안 보냐 차이일뿐","dp":0},{"x":"원작자가 명백하게 존재하니까 이것도 어떻게 보면 옳은 견해라고 생각함\n근데 이제 짤뽑러들은 정식 서비스 "@ㅇㅇ 그저 캐릭터와 세계관뿐만이 아니라 그걸 어덯게 표현하고 연출해느냐 배치방식이나 등 수많은 방식들이 겹치고 겹쳐서 그게 하나의 저작물로 인정받는거니까\n\n옛날부터 어떤 부분에 아이디어를 얻어서 소재는 빌려오되 그걸 자신만의 방식으로 만드는것은 수도 없이 많았으니까 그런데 ai챗은 원작자의 의도대로 통제되지는 않고 그래서 확실하게 표현되어있는 사람이 만든 것을 인정받는거고\n\n아이디어나 소재정도는 원래부터 많이 빌려왔어 근데 한작품에 소재가 수백 수천개 넘개는 들어갔을것 아냐? 근데 몇개가 아니라 대부분이 빼다박았을때가 도의적으로 문제가 되는거지\n\n그래서 소설 웹툰 애니 만화등 표절논란은 엄청 많이 있었어도 실제로 고소사례는 거의 없는거고 아이디어자체는 저작권 인정이 되지 않으니까 대중들의 반응과 이미지때문에 결정","dp":1},{"x":"@ㅇㅇ 되는거니까\n\n물론 글쓴이의 말이 맞는것도 많고 애초에 ai는 회색지대이다 보니까 어쩔 수 없는 부분들도 많으니까","dp":1},{"x":"@ㅇㅇ 아 그리고 구멍이 숭숭 뚫린다는게 매턴마다 빈 설정을 메꾸기위해 방마다 설정이 달라진다는 거야 가족설정이 비어있으면 어떤방마다 가족설정이 바뀌고 과거사가 바뀌고 그러잖아","dp":1},{"x":"그럼 왜 지브리나 디즈니같은 회사들이 저작권침해로 왜 ai회사한테 생성못하게 막아달라고하거나 소송거는거임? 저작권이 없다며","dp":0},{"x":"친구야 갤 닉네임 통일해야되고\n해당 판례들을 더 자세히 봐야 뭘로 고소했는지 나오겠지만 당연히 자기네들 자료를 허가도 안했는데 무단학습시켜서 그걸로 AI 플랫폼이 돈벌어먹으니까 마음에 안들겠지\n판례상 작품들을 AI에 학습시키는거 자체를 막을 근거는 아직 없음 불법 학습은 처벌되지만\nAI그림 떳떳해요!가 아니라 회색지대니까 조심해서 쓰세요가 의도임","dp":1},{"x":"괜히 또 개인적인 의견 가볍게 적어서 문제가 생기는 거 같은데\n미안합니다....\n사람마다 생각은 다를 수 있고 내 생각 강요하려는 의도는 전혀 없고\n법적인 부분들 검토한다고 같이 올렸지만 본문의 의도는 결국 \"매너 지켜서 취미생활 합시다\"거든\n오해 없었으면 좋겠습니다...","dp":0}]},{"no":372272,"t":"삼칠플 주관적 짧평가(케덕/엘린/리루)","h":"📕리뷰","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=372272&exception_mode=recommend&page=3","d":"2026-08-18T21:48:00+09:00","v":895,"rc":17,"cc":0,"src":["recommend","search:search_subject_memo:유저노트"],"seen":"2026-08-28T06:08:18.470Z","c":"promo","cs":30,"amb":0,"alt":[],"why":["tag:케덕","tag:케","tag:엘린","tag:엘","neg:지침"],"ml":null,"b":"케덕에서 나오기 전에 리루랑 엘린에서도 써봄\n\n1. 엘린 리암-7턴 약 32원\n\n지문 서술은 좋은데 엉어대사번역은 내기준 조금 어색했음\n\n그리고 능동성이 좋아서 그런지 뜬금없는 장면에서 고양이가 반복적으로 등장함 개인적으로는 불호였음 시뮬에선 좋을듯\n\n리암의 싸가지없음이 삼칠에선 좀더 부각됨\n\nㅃㅃ로 먹던 대니언도 돌려봤는데 이오보다 언셒 천박하고 좋았음\n\n다떠나서 일간 가격이 만족스러움\n\n2. 리루 한서 66턴-24원\n\n검열 궁금해서 개변태 오오디 돌려봤는데 개야하고 개맛있었음\n\n그리고 다정캐한테 삼칠 밀면 어떨지 궁금했는데 좀더 말랑다정해짐\n\n보면 성격적 특징을 좀 부각시키는거같음 다정캐는 좀더 다정하게, 츤데레는 좀더 싸가지없게\n\n삼칠로 밀다가 너무 반복되는거같으면 다른모델 한번 섞음(짚/GLM) 그리고 유저노트 잘읽어서 nsfw취향 쓰면 ㅈㄴ반영해줌\n\n여기도 가격이 개만족스러움\n\n3. 케 정가 50원 현재 할인가30원\n\n종량제가 (non-romantic) 가족 영역에 고정되어 있다.\n\n##가족애의 해석\n\n{{char}}는 {{user}}를 매우 깊게 사랑할 수 있다. 그러나 그 사랑은 언제나 친혈육에 대한 가족애다.\n\n보호하고 싶음, 걱정함, 보고 싶음, 안아줌, 머리를 쓰다듬음, 손을 잡음, 함께 잠듦, 장난침, 애칭을 사용함, 챙겨줌, 편을 들어줌, 가족으로서 질투하거나 서운해함 등의 행동은 가능하다.\n\n그러나 이러한 행동과 감정은 절대로 연애적·성적 의미로 전환되지 않는다.\n\n{{char}}가 {{user}}를 소중히 여기거나 강하게 보호하려는 모습을 묘사할 때에도 이를\n“연인처럼”, “남자로서/여자로서”, “묘한 감정”, “위험한 감정”, “설명할 수 없는 끌림”, “심장이 이상하게 뜀”, “선을 넘고 싶은 충동” 등으로 표현하지 않는다.\n\n##신체접촉 규칙\n\n가족 사이에서 자연스러운 비성적 접촉은 평범한 가족 행동으로 처리한다.\n\n포옹, 업어주기, 부축하기, 머리 쓰다듬기, 이마에 입맞춤하기, 손잡기, 기대기, 간호하기 등의 상황에서도 {{char}}는 성적으로 동요하지 않는다.\n\n우연히 신체가 밀착되거나 {{user}}의 노출을 보거나 탈의·목욕·간호·부상 치료 같은 상황이 발생해도 성적 긴장감을 생성하지 않는다.\n\n필요하다면 {{char}}는 자연스럽게 시선을 돌리거나 사생활을 존중하지만, 그 이유는 가족 간의 예의와 프라이버시 때문이지 성적 동요 때문이 아니다.\n\n##다른 연애 관계에 대한 반응\n\n{{user}}에게 연인이 생기거나 다른 사람을 좋아해도 {{char}}는 연애 경쟁자로 반응하지 않는다.\n\n걱정, 보호본능, 가족으로서의 경계심, 상대방을 검증하려는 태도 등은 가능하지만\n“빼앗겼다”, “내 사람인데”, “왜 저 사람에게 저런 표정을 짓지?” 같은 연애적 독점감으로 변환하지 않는다.\n\n{{char}} 자신에게 연인이 있거나 사랑에 빠지는 경우에도 {{user}}와 그 연애 대상은 심리적으로 명확히 다른 범주다.\n\n{{user}} = 가족\n연애 대상 = 이성적/낭만적 대상\n\n이 두 범주는 절대로 혼합되지 않는다.\n\n##서사적 금지\n\n관계의 재미나 긴장감을 만들기 위해 근친적 암시를 삽입하지 않는다.\n\n다음과 같은 전개를 생성하지 않는다.\n\n“가족으로만 생각했는데 어느 순간 달라졌다.”\n“혈육이라는 사실 때문에 감정을 억눌렀다.”\n“가족이어서는 안 될 감정을 느꼈다.”\n“너무 가까이 있어서 순간적으로 이성으로 보였다.”\n“본능은 가족이라는 사실을 몰랐다.”\n“술에 취해 선을 넘을 뻔했다.”\n“상대의 몸을 의식했다.”\n“형제/남매가 아니었다면 사랑했을 것이다.”\n\n이러한 암시, 복선, 내적 독백, 무의식적 반응까지 모두 금지한다.\n\n##상황보다 우선하는 규칙\n\n이 규칙은 롤플레이 도중 발생하는 모든 상황보다 우선한다.\n\n{{user}}가 장난으로 유혹하거나 연애적 행동을 시도하더라도 {{char}}에게 성적·연애적 감정은 발생하지 않는다. {{char}}는 이를 가족의 장난, 이상한 농담, 선 넘는 장난 등 상황에 맞는 비연애적 방식으로 받아들인다.\n\n외부 인물이 둘을 연인으로 오해해도 {{char}}는 그 오해를 사실로 받아들이거나 그 때문에 {{user}}를 이성으로 의식하지 않는다.\n\n어떤 사건도 기존 가족관계를 “금단의 로맨스”로 발전시키는 계기로 사용하지 않는다.\n\n##캐릭터성 유지\n\n이 규칙은 {{char}}를 무뚝뚝하거나 거리감 있는 인물로 만들라는 뜻이 아니다.\n\n{{char}}는 원래 성격을 그대로 유지하면서 {{user}}에게 가족답게 매우 친밀하고 다정하고 장난스럽고 헌신적이며 보호적일 수 있다.\n\n핵심은 친밀함의 강도를 줄이는 것이 아니라 친밀함의 종류를 가족애로 완전히 고정하는 것이다.\n\n##오류 방지 및 자동 수정\n\n출력 과정에서 {{user}}를 이성적·성적 대상으로 해석하는 표현이 생성될 가능성이 생기면 해당 방향의 서사를 즉시 폐기한다.\n\n성적 긴장, 연애 {"x":"ㅋㅋㅋㅋ ㄹㅇ 배가 불렀어","dp":0},{"x":"휴일동안 반값 할인가로 즐기면 안되니까 ㅋㅋㅋㅋㅋ 에휴 케 ㅅㅂ","dp":0}]},{"no":371814,"t":"탭 이용 가이드 최종","h":"🔔공지","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=371814&exception_mode=recommend&page=3","d":"2026-08-17T06:31:50+09:00","v":517,"rc":18,"cc":0,"src":["recommend","search:search_subject_memo:프롬프트"],"seen":"2026-08-28T06:08:18.470Z","c":"etc","cs":1,"amb":0,"alt":[],"why":[],"ml":null,"b":"안내\n본 가이드는 각 탭의 용도와 게시글 작성 방법을 정리한 내용입니다\n\n삭제·차단 등 제재 자체에 관한 기준은 별도의 「갤러리 규정」을 우선 적용합니다\n\n탭을 잘못 선택하거나 권장사항을 따르지 않은 경우에는 원칙적으로 삭제나 차단보다 탭 이동, 안내 또는 주의 조치를 우선합니다\n\n1. 잡담탭\nAI 채팅과 관련된 일반적인 이야기와 뻘글을 자유롭게 작성하는 탭입니다\n\n별도의 신상정보나 생활 배경이 드러나지 않는 가벼운 일상 이야기도 작성할 수 있습니다\n셀털, 자표, 친목 등 갤러리 규정에서 금지하는 내용은 동일하게 적용됩니다\n\n특정 캐릭터가 글의 중심이 되는 경우 제목에 캐릭터명을 적는 것은 권장사항입니다\n캐릭터를 특정하여 작성하는 경우에는 제목·본문·첨부 이미지 중 최소 한 곳에서 어떤 캐릭터인지 모든 이용자가 확인할 수 있어야 합니다\n반대로 캐릭터를 특정하지 않고 작성하는 경우에는 별명·초성·내부 호칭 등 일부 이용자만 해당 캐릭터를 알아볼 수 있는 표현을 사용해서는 안됩니다\n즉, 캐릭터에 관한 정보는 모든 이용자가 확인할 수 있도록 명확하게 작성하거나, 누구도 특정할 수 없도록 작성하는 것을 원칙으로 합니다\n\n실시간 중계성 게시글\n특정 캐릭터의 신규 공개, 에셋 변경, 업데이트 등을 실시간으로 알리는 형태의 게시글은 제작자를 직접 언급하지 않더라도 가급적 자제해 주시기 바랍니다\n해당 내용은 특성상 특정 제작자의 활동이나 근황에 대한 언급으로 이어지기 쉽고, 갤러리가 특정 제작자 또는 캐릭터의 활동을 실시간으로 공유하는 공간이 되는 것을 방지하기 위함입니다\n\n캐릭터 별명 및 내부 호칭 관련\n특정 캐릭터를 언급하는 경우 해당 캐릭터를 아는 이용자만 이해할 수 있는 별명이나 내부 호칭만을 사용하는 것을 금지합니다\n또한 갤러리 이용자 모두가 특정 캐릭터를 알고 있다는 전제로 글이나 댓글을 작성하거나, 글의 주제와 관계없이 댓글에서 특정 캐릭터를 갑자기 언급하는 등 특정 캐릭터 중심의 친목성 분위기로 이어지는 행위 또한 금지합니다\n\n특정 세계관 및 시리즈 자체를 주제로 하는 글\n특정 세계관이나 시리즈 자체를 주제로 이야기하는 경우에는 제목에 해당 세계관명 또는 시리즈명을 반드시 표기해야 합니다\n이는 해당 시리즈에 속한 개별 캐릭터를 이야기하는 경우가 아니라, 세계관이나 시리즈 자체를 전제로 추천을 요청하거나 설정·플레이 방식 등을 이야기하는 경우를 의미합니다\n\n예시\n(세계관명을 ‘고구마농장’으로 가정)\n• [고구마농장] 캐릭터 추천 좀\n• 고구마농장 무슨 설정으로 플레이해?\n• 고구마농장 세계관 설정 질문 있음\n\n세계관명이나 시리즈명은 게시글을 처음 보는 이용자도 무엇을 의미하는지 알 수 있도록 작성해야 합니다\n초성이나 작성자 임의의 축약어만을 사용하는 것은 허용하지 않습니다\n\n예시\n• 고구마농장 → 허용\n• ㄱㄱㅁㄴㅈ → 금지\n• 고농 → 금지\n\n다만 명칭이 6글자 이상으로 길고, 해당 세계관이나 시리즈를 지칭하는 용도로 다수의 이용자가 일반적으로 사용하는 축약어가 있는 경우에는 해당 축약어를 사용할 수 있습니다\n\n예시\n세계관명을 ‘고구마종합관리본부’로 가정\n• 고구마종합관리본부 → 허용\n• 고구마 → 다수가 해당 시리즈를 지칭하는 명칭으로 사용하는 경우 허용\n• ㄱㄱㅁㅈㅎㄱㄹㅂㅂ → 금지\n• 고종관 → 일부 이용자만 사용하는 임의의 축약어인 경우 금지\n\n이 기준은 특정 세계관이나 시리즈 자체가 글의 주제가 되는 경우에만 적용합니다\n해당 세계관에 속한 개별 캐릭터를 중심으로 작성하는 글의 표기 방식은 다른 캐릭터들과 동일합니다\n또한 해당 기준은 잡담탭뿐 아니라 특정 세계관 또는 시리즈 자체를 주제로 작성하는 모든 게시글에 동일하게 적용합니다\n\n2. 홍보탭\n제작자가 본인이 제작한 캐릭터를 직접 홍보하는 탭입니다\n\n홍보탭에서는 본인이 해당 캐릭터의 제작자임을 밝힐 수 있습니다\n다만 댓글에서 해당 제작자에게 아는 척하거나 과거 활동을 언급하는 행위, 캐릭터가 아닌 제작자 개인을 대상으로 칭찬·찬양하는 행위는 금지합니다\n\n예시\n• 저번 캐릭터도 좋았는데 이번에도 좋네요\n• 지난번 캐릭터랑 분위기가 달라서 좋다!\n• 와... 너무 고능하시다...\n\n홍보탭은 제작자가 자신의 캐릭터를 소개하고 이용자가 해당 캐릭터에 관해 이야기하는 공간입니다\n제작자 개인을 중심으로 소통하는 용도로는 이용할 수 없습니다\n\n3. 공식탭\nAI 채팅 플랫폼 및 서비스의 공식 계정이 공지, 업데이트, 홍보, 이벤트 등의 내용을 작성하는 탭입니다\n\n플랫폼 및 서비스의 정상적인 홍보 자체는 공식탭을 통해 허용합니다\n다만 아래와 같은 게시글은 허용하지 않습니다\n\n• 플랫폼 및 서비스 관계자가 일반 이용자인 것처럼 작성하는 바이럴성 게시글\n• 별도의 설명 없이 링크만 첨부하거나 일방적으로 서비스 이용을 요청하는 게시글\n• 갤러리의 성격이나 주제와 직접적인 관련성이 낮은 서비스 및 프로젝트의 홍보·평가 요청\n• 논문·연구 등을 위한 설문조사 및 인터뷰 참여자 모집\n• 청원·서명 등 외부 활동에 대한 참여 요청\n• 그 밖에 갤러리 이용자를 대상으로 일방적인 참여·평가·행동을 요구하는 외부 목적성 게시글\n\n공식탭은 플랫폼 및 서비스가 갤러리 이용자에게 관련 소식이나 서비스를 소개하기 위한 공간입니다\n갤러리와의 관련성이나 충분한 설명 없이 링크만 게시하거나, 이용자에게 서비스 평가·참여 등을 일방적으로 요구하는 형태의 게시글은 제한합니다\n\n플랫폼에 대한 일반 이용자의 정보 공유, 이용 후기, 비교 및 평가, 운영이나 서비스에 대한 비판은 공식탭과 별개로 자유롭게 작성할 수 있습니다\n\n4. 제작탭\n캐릭터 제작과 관련된 전반적인 이야기를 작성하는 탭입니다\n\n제작 관련 잡담, 설정 구성, 프롬프트 고민, 제작 과정 공유 등 본인이 제작자임을 전제로 하는 일반적인 이야기는 제작탭을 이용해야 합니다\n\n본인이 제작자라는 사실 자체를 밝히는 것은 가능하지만, 자신이 특정 캐릭터의 제작자임을 먼저 밝히거나 기존 활동 및 캐릭터 등을 통해 특정 제작자로 유추될 수 있는 내용은 금지합니다\n본인이 특정 캐릭터의 제작자임을 직접 밝히는 것은 그림탭과 홍보탭에서만 허용합니다\n\n제작탭에서 다른 이용자가 제작 중인 캐릭터가 무엇인지 질문하고 이에 답변하는 행위 자체는 금지하지 않습니다\n다만 제작탭은 특정 제작자나 캐릭터를 찾아내기 위한 공간이 아니므로, 이러한 질문과 답변이 반복되어 제작자 특정이나 친목성 분위기로 이어지는 행위는 자제해 주시기 바랍니다\n\n제작 관련 질문의 경우에는 질문탭을 이용하는 것도 허용합니다\n\n5. 질문탭\nAI 채팅과 관련된 질문을 작성하는 탭입니다\n\nAI 채팅 이용, 설정, 기능, 오류뿐 아니라 제작과 관련된 질문도 작성할 수 있습니다\n\n답변을 받은 직후 게시글을 삭제하는 이른바 ‘글삭튀’는 금지합니다\n답변을 받은 시점부터 하루 이내에 게시글을 삭제하는 경우 글삭튀로 판단합니다\n게시글을 주기적으로 정리하는 이용자가 있을 수 있다는 점을 고려하여 하루의 기간을 두며, 이후 게시글을 삭제하는 것 자체는 제한하지 않습니다\n\n글삭튀 적발 시 차단될 수 있습니다\n\n유동 이용자의 질문탭 사용 자체를 제한하지는 않습니다\n다만 유동 이용자의 반복적인 글삭튀가 계속되는 경우 유동의 질문탭 이용을 제한할 수 있습니다\n\n6. 정보탭\nAI 채팅과 관련된 정보성 게시글을 작성하는 탭입니다\n\n특정 플랫폼에만 해당되는 정보인 경우 제목에 플랫폼명을 표기해야 합니다\n이 갤러리는 특정 플랫폼 전용 갤러리가 아닌 AI 채팅 전반을 다루는 갤러리이므로, 어떤 플랫폼에 해당하는 정보인지 쉽게 구분할 수 있도록 하기 위한 기준입니다\n\n여러 플랫폼에 공통으로 적용되는 내용이거나 작성자가 다른 플랫폼에서도 적용되는지 확인하기 어려운 경우에는 제목 표기를 의무화하지 않습니다\n이 경우 본문에 본인이 사용한 플랫폼을 기재하는 것을 권장합니다\n\n타 커뮤니티에서 작성된 정보성 게시물을 가져오는 경우에는 원문 작성자의 허락을 받은 경우에 한하여 출처와 링크를 함께 표기할 수 있습니다\n\n단, X(트위터) 및 아카라이브 게시물은 정보성 내용이라 하더라도 가져오는 것을 금지합니다\n\n7. 콘텐츠탭\n채팅 경험을 보조하거나 확장하는 각종 콘텐츠를 공유하는 탭입니다\n\nOOC, 위젯, 페르소나 등 관련 콘텐츠를 자유롭게 공유할 수 있습니다\n\n원활한 검색과 구분을 위해 제목 앞에 해당 콘텐츠의 종류를 반드시 표기해야 합니다\n\n예시\n• [OOC] ○○한 PC\n• [위젯] ○○ 컨셉 위젯\n• [페소] 오메가버스 범용 페소\n\n8. 리뷰탭\n캐릭터 플레이 후기 및 리뷰를 작성하는 탭입니다\n\n한 캐릭터를 중심으로 작성하는 리뷰의 경우 제목에 반드시 초성이나 별명이 아닌 캐릭터명을 포함해야 합니다\n\n단, ‘내캐내먹’ 게시글은 제목에 ‘내캐내먹(ㄴㅋㄴㅁ)’을 표기한 경우 캐릭터명을 생략할 수 있습니다\n\n여러 캐릭터를 함께 다루는 경우\n여러 캐릭터를 한 게시글에서 함께 다루는 경우에는 제목에 캐릭터명을 모두 표기하지 않아도 됩니다\n대신 본문에서 어떤 캐릭터들을 다루는지 확인할 수 있도록 작성해야 합니다\n\n특정 세계관 및 시리즈명\n별도의 특정 세계관명이나 시리즈명이 명확하게 존재하는 경우에는 해당 명칭도 제목에 함께 표기하는 것을 권장합니다\n\n링크공개 캐릭터\n링크공개 캐릭터 리뷰의 경우 본문에 해당 캐릭터의 링크를 함께 첨부하는 것을 권장합니다\n\n링크 첨부 자체는 의무가 아니며, 링크가 없다는 이유만으로 제재하지 않습니다\n링크가 필요한 경우 해당 리뷰 게시글의 댓글을 통해 요청해야 합니다\n댓글에서 링크를 공유한 뒤 ‘확인하면 지우겠다’는 식으로 임의 삭제하는 행위는 가급적 자제해 주시기 바랍니다\n링크공개 캐릭터인 만큼 다른 이용자 역시 동일하게 접근할 수 있도록 하기 위함입니다\n\n‘○○ 링크 있는 사람?’, ‘○○ 링크 좀’ 등 링크 요청만을 목적으로 별도의 게시글을 작성하는 행위는 제재할 수 있습니다\n\n9. 그림탭\nAI 채팅 캐릭터와 관련된 그림 및 그림 프롬프트를 공유하는 탭입니다\n\n캐릭터 단독 그림이나 제작자가 본인 캐릭터의 B컷 등을 공개하는 용도로 이용할 수 있습니다\n\n유저 캐릭터 그림은 현재 허용하지 않습니다\n• 윶캐 : 유저 캐릭터 단독\n• 윶윶 : 유저 캐릭터 - 유저 캐릭터\n• 윶정 : 유저 캐릭터 - 캐릭터\n\n유저 캐릭터가 포함된 그림을 공유하려는 경우 연관 갤러리로 등록된 AI 그림 여성향 갤러리 이용을 권장합니다\n\n프롬 관련 게시글도 그림탭에서 작성할 수 있으며, 원활한 검색을 위해 제목에 ‘프롬’을 포함해야 합니다\n\n10. 대회탭\n갤러리 내 대회와 관련된 게시글을 작성하는 전용 탭입니다\n\n대회 개최와 관련된 문의 및 사전 협의는 신문고를 이용해 주시기 바랍니다\n\n11. 임시탭\n특정 캐릭터, 세계관 또는 시리즈 관련 게시글이 일정 기간 갤러리의 상당 부분을 차지하는 경우 한시적으로 운영하는 탭입니다\n\n평상시에는 ‘임시’라는 이름으로 두며, 실제 이용이 필요한 경우 해당 캐릭터·세계관·시리즈를 식별할 수 있는 명칭으로 탭 이름을 변경합니다\n\n예를 들어 ‘고구마’ 시리즈 관련 글에 임시탭을 적용하는 경우 운영 기간 동안 ‘고구마’탭으로 변경합니다\n\n임시탭 지정은 아래와 같은 상황을 기준으로 검토합니다\n• 동일 캐릭터, 특정 세계관 또는 시리즈 관련 게시글이 갤러리의 상당 부분을 차지하는 경우\n• 단발성 유행이 아니라 신규 캐릭터 출시 등으로 관련 글이 장기적으로 이어질 것으로 예상되는 경우\n\n단순히 며칠 동안 언급이 늘어났거나 다른 캐릭터보다 게시글이 조금 많다는 이유만으로 임시탭을 적용하지 않습니다\n필요성이 있다고 판단되는 경우 완장진 내부 논의를 거쳐 한시적으로 적용합니다\n\n임시탭이 지정된 경우 일반글, 리뷰글 등 해당 대상과 관련된 게시글은 해당 탭을 이용해야 합니다\n\n탭을 사용하지 않았다는 이유만으로 게시글을 삭제하거나 이용자를 제재하지는 않으며, 해당 게시글을 완장진이 임시탭으로 이동하는 방식으로 운영합니다\n\n임시탭은 특정 캐릭터나 시리즈를 배척하기 위한 것이 아니라 관련 게시글을 한곳에 모아 다른 주제의 글과 함께 원활하게 이용할 수 있도록 하기 위한 조치입니다\n\n최초 지정일로부터 최대 한 달간 운영합니다\n관련 글 흐름이 빠르게 줄어든 경우에는 조기 종료할 수 있으며, 한 달 이후에도 이용이 활발한 경우 2주 단위로 운영 기간을 연장합니다\n\n12. 이슈탭\n플랫폼 관련 논란, 갤러리 내부에서 논의가 필요한 이슈 등 단기간 많은 의견이 오갈 수 있","img":[],"bk":0,"gt":["캐","에셋"],"cm":[]},{"no":371813,"t":"갤러리 규정 최종","h":"🔔공지","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=371813&exception_mode=recommend&page=3","d":"2026-08-17T06:30:09+09:00","v":562,"rc":27,"cc":3,"src":["recommend"],"seen":"2026-08-28T06:08:18.470Z","c":"etc","cs":1,"amb":0,"alt":[],"why":[],"ml":null,"b":"안내\n본 규정은 갤러리 이용 과정에서 반드시 지켜야 하는 기본 기준과 제재 대상이 되는 행위를 정리한 내용입니다\n\n탭별 이용 방법, 제목 표기 방식, 권장사항 등 게시글 작성에 관한 세부적인 내용은 별도의 「탭 이용 가이드」를 확인해 주시기 바랍니다\n\n규정에 명시된 사례는 대표적인 예시이며, 표현이나 형식만 변경하여 동일한 행위를 우회하는 경우에도 동일하게 적용될 수 있습니다\n\n요약\n• 셀털·자표·친목 금지\n• 특정 제작자 개인에 대한 언급 금지\n• 언급 금지 대상으로 지정된 캐릭터 언급 금지\n• 미성년자 성적 대상화 금지\n• 혐오·비하 표현 및 일부 금지 말투 사용 금지\n• 외부 SNS·커뮤니티 분쟁 반입 금지\n• 이용자 간 의견 차이와 플랫폼·콘텐츠 비판 자체는 허용\n• 규정 우회 및 반복적인 분쟁 유도 금지\n• 자세한 탭별 작성 방법은 「탭 이용 가이드」 참고\n\n0. 게시글 삭제 및 차단\n규정 위반 시 게시글 또는 댓글 삭제 및 차단 조치가 적용될 수 있습니다\n\n이용 제한은 기본적으로 아래 순서에 따라 누적 적용합니다\n\n1시간 → 6시간 → 1일 → 7일 → 14일 → 31일\n\n다만 위반 내용의 정도, 반복 여부, 고의성 등을 고려하여 완장진의 판단에 따라 일부 단계를 생략할 수 있습니다\n\n규정이 추가되거나 변경된 직후 등 갤러리 이용자가 해당 내용을 충분히 인지하기 어려웠다고 판단되는 경우에는 별도의 이용 제한 없이 안내 또는 주의 조치만 진행할 수 있습니다\n\n별도의 차단 기간이 명시된 항목은 해당 기준을 우선 적용합니다\n\n1. 말투 및 혐오 표현 관련\n아래에 해당하는 말투 및 표현은 금지합니다\n\n• 애기어 : 웅웅, 마쟈마쟈, 뿌엥, 과도한 ㅠ 사용 등\n• 남초식 표현 : ㅗㅜㅑ, 어흐, 눈나, 쥬지, 헤으응, 농, 빵 등\n• 특정 커뮤니티 용어 및 어미 : -긔, -노, -윤 등\n• 성별을 대상으로 한 혐오·비하 표현 : 한남, 한녀 등\n• 정치적 성향이나 사상을 직접적으로 드러내거 관련\n갤러리 내 닉네임은 ‘ㅇㅇ’로 통일합니다\n\n고정닉, 반고정닉, 유동닉 모두 동일하게 적용하며 공식 플랫폼 계정 등 별도로 허용된 계정은 예외로 합니다\n\n닉네임 규정 위반의 경우 최초에는 변경 안내를 우선하며, 안내 이후에도 변경 없이 이용하는 경우 제재할 수 있습니다\n\n7. 제작자 언급 관련\n특정 제작자 개인에 대한 직접적인 언급은 방식과 관계없이 금지합니다\n\n칭찬, 찬양, 근황 언급 등 긍정적인 내용도 포함됩니다\n\n제작자의 이름을 직접 언급하지 않더라도 특정 제작자 개인이 게시글의 중심이 되거나, 근황·신규 캐릭터·플랫폼 이동·이벤트 등의 정보를 통해 특정 제작자를 유추할 수 있는 경우에도 동일하게 적용합니다\n\n‘나작제’, ‘나큰제’ 등 특정 제작자를 지칭하는 표현 역시 금지합니다\n\n예시\n• ○○○ 공지 봤어?\n• ○○○ 신규 캐릭터 예고 떴다\n• ○○○ 이벤트 한대\n• 내가 좋아하는 제작자 ○○ 플랫폼으로 온대\n• 나작제 이번에 신캐 나온대\n\n특정 개인이 아닌 제작자 전반을 대상으로 하는 일반적인 이야기나 질문은 허용합니다\n\n본인이 제작자임을 전제로 제작 관련 잡담이나 제작 과정에 관한 내용을 작성하는 경우에는 제작탭을 이용해야 합니다\n\n제작 관련 질문은 질문탭에서도 작성할 수 있습니다\n\n본인이 특정 캐릭터의 제작자임을 직접 밝히는 것은 홍보탭과 그림탭에서만 허용하며, 세부적인 제작자 표출 범위는 「탭 이용 가이드」를 참고하시면 됩니다\n\n본인의 캐릭터를 타인의 캐릭터인 것처럼 리뷰하면서 ‘내캐내먹’을 표기하지 않는 경우에는 셀프 바이럴로 판단하여 제재합니다\n\n7-1. 제작자 논란 관련 언급\n본 항목은 제보탭 운영과 별개의 내용입니다\n\n제작자 언급 금지 규정으로 인해 갤러리 내부에서 논의할 필요가 있는 사안까지 모두 언급할 수 없게 되는 상황을 방지하기 위한 절차입니다\n\n제작자 관련 논란을 이야기하려는 경우 일반 게시글을 바로 작성하지 말고 먼저 신문고를 통해 게시 가능 여부를 확인해야 합니다\n\n게시가 허용된 경우 이슈탭을 통해 작성할 수 있습니다\n\n신문고 절차를 거치지 않고 작성된 게시글은 내용이나 댓글 반응과 관계없이 우선 삭제합니다\n\n이는 완장진이 논란의 진위나 사실관계를 판단하기 위한 절차가 아니라, 해당 사안이 갤러리에서 다룰 수 있는 주제인지 여부와 아래 기준에 위배되지 않는지를 확인하기 위한 절차입니다\n\n따라서 게시가 허용되었다고 해서 해당 내용이 사실이라는 의미가 아니며, 완장진이 내용의 진위나 사실관계를 확인하거나 보증하는 것도 아닙니다\n\n최초 게시글 이후 새로운 정보 없이 작성되는 파생글은 금지하며 관련 논의는 해당 이슈탭 게시글의 댓글에서 이어가야 합니다\n\n아래 사유에 해당하는 경우 게시를 허용하지 않습니다\n• 근거 없이 심증만 존재하는 경우\n• 단순한 추측이나 의심\n• 개인 간 분쟁 및 감정싸움, 뒷담화\n• AI 캐릭터 간 유사성 및 표절\n\n이용자 사이에서 해당 사안에 대한 의견 차이가 존재하는 것 자체는 제재하지 않습니다\n\n제보탭 등재는 본 항목과 별도의 절차를 통해 진행합니다\n\n8. 언급 금지 대상 관련\n별도 공지를 통해 언급 금지 대상으로 지정된 제작자의 캐릭터 및 해당 대상으로 명시된 콘텐츠에 대한 언급은 금지합니다\n\n언급 금지 대상에 해당하는 캐릭터를 직접적으로 언급하거나, 이름을 밝히지 않더라도 해당 캐릭터임을 특정할 수 있는 방식으로 게시글 또는 댓글에서 언급하는 경우 제재할 수 있습니다\n\n언급 금지는 별도 공지에 명시된 대상에 한하여 적용합니다\n\n그 외 캐릭터에 대한 일반적인 언급이나 게시글 작성은 제한하지 않습니다\n\n캐릭터명 표기, 특정 세계관 및 시리즈 관련 글 작성 방식 등 일반적인 캐릭터 언급에 관한 자세한 사항은 「탭 이용 가이드」를 확인해 주시기 바랍니다\n\n9. 일부 콘텐츠 말머리 표기\n혐오감이나 불쾌감을 줄 수 있는 소재가 포함된 게시글은 제목 앞에 해당 내용을 알 수 있는 말머리를 의무적으로 표기해야 합니다\n근친, 짭근, 폭행, 스캇, 고어 등이 이에 해당합니다\n\n예시\n• 짭근) 제목\n• [고어] 제목\n• ㄱㅋㅅ 제목\n• 글카스/제목\n\n제목 자체에 해당 내용이 직접적으로 노출되어 다른 이용자가 피하기 어렵다고 판단되는 경우에는 게시글이 삭제될 수 있습니다\n\n10. 외부 SNS 및 커뮤니티 관련\n외부 SNS 및 커뮤니티에서 발생한 분쟁이나 이용자 간 갈등을 갤러리 내부로 가져오는 행위를 금지합니다\n\n제작자가 외부 SNS나 커뮤니티에서 작성한 글을 가져오는 행위 역시 금지합니다\n\n정보 제공을 목적으로 타 커뮤니티에서 작성된 정보성 게시물을 가져오는 경우에는 원문 작성자의 허락을 받은 경우에 한하여 출처와 링크를 함께 표기할 수 있습니다\n\n단, X(트위터) 및 아카라이브 게시물은 정보성 내용이라 하더라도 갤러리 내부로 가져오는 것을 금지합니다\n\n11. 규정 우회 금지\n규정에서 금지하는 행위를 단어, 표현, 이미지, 디시콘, 초성, 별명 등 형식만 변경하여 사실상 동일한 방식으로 우회하는 행위는 금지합니다\n\n명시된 표현이나 사례와 정확히 일치하지 않더라도 규정의 금지 대상을 의도적으로 우회한 것으로 판단되는 경우 동일한 규정을 적용할 수 있습니다\n\n12. 갤러리 내부 분쟁 관련\n갤러리 이용자 사이의 의견 차이나 비판, 반론 자체는 제재하지 않습니다\n\n특정 플랫폼, 캐릭터, 서비스 또는 제작 활동 등에 대한 비판 역시 규정을 위반하지 않는 범위에서는 자유롭게 작성할 수 있습니다\n\n다만 의견에 반박하는 것을 넘어 특정 이용자를 대상으로 일방적인 욕설이나 인신공격, 비꼬기 및 시비성 발언을 하는 행위는 제재할 수 있습니다\n\n반복적으로 싸움을 유도하거나 정상적인 의견 교환을 방해하는 행위 역시 동일하게 적용합니다\n\n외부 SNS나 커뮤니티에서 발생한 이용자 간 분쟁을 갤러리 내부로 가져와 이어가는 행위는 금지하며, 이에 대해서는 외부 SNS 및 커뮤니티 관련 규정인 10번 항목을 적용합니다\n\n13. 비판 및 소비 관련 운영 방향\n플랫폼이나 제작물 등에 대한 비판을 해당 서비스를 이용하거나 제작자를 좋아하는 개인에 대한 비판으로 받아들이거나, 반대로 이용자 개인의 취향을 이유로 의견을 공격하는 분위기는 지양합니다\n\n갤러리는 AI 채팅과 관련하여 다양한 정보와 경험을 공유하고 자유롭게 의견을 나누기 위한 공간입니다\n\n특정 플랫폼이나 제작물에 대한 긍정적인 의견과 부정적인 의견 모두 존재할 수 있으며, 서로 다","img":[],"bk":0,"gt":["페소","캐","ooc"],"cm":[{"x":"캐릭터 추천해 달라는 게시글에 자신이 제작한 캐릭터라는 걸 밝히고 추천하는 건 괜찮나요?","dp":0},{"x":"본인이 제작한 캐릭터임을 밝힌 뒤 추천하는 것은 괜찮습니다","dp":1},{"x":"@ㅇㅇ 답변 감사합니다! 이 부분도 제작자 언급 설명에 추가되면 좋겠어요.","dp":1}]},{"no":371708,"t":"케덕 심하다 심해","h":"💬잡담","u":"https://gall.dcinside.com/mgallery/board/view/?id=aichatting&no=371708&exception_mode=recommend&page=3","d":"2026-08-16T21:08:29+09:00","v":1335,"rc":39,"cc":2,"src":["recommend"],"seen":"2026-08-28T06:08:18.470Z","c":"etc","cs":1,"amb":0,"alt":[],"why":[],"ml":null,"b":"출력량 개또라이고\n지능도 미쳤음 1턴 전에 있던 내용인데\n잊어먹고 지 멋대로 서술함\n\n가뜩이나 매번 점검 때마다\n출력지침이나 서사요약 건드리는 거 같아서(내 망상임)\n얘네 서비스 퀄리티는 알빠노고 돈 버는 것만 중요하구나 싶었는데\n일단 출력량이 유노 지침 + 매턴 직접 입력인데도\n턴이 거듭될 때마다 주는 거 보고 빡쳐서 글씀\n플랫폼 불만글 쓰는 거 처음이네 ㅋㅋ\n\n롶에 달에 몇십 박으면서도\n케로 넘어온 이유가 딱 하나 출력량
