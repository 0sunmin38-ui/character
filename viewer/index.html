<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>character — 작업 뷰어</title>
<style>
:root{
  --bg:#faf9f7; --panel:#fff; --line:#e5e1db; --ink:#2b2723; --dim:#8a8179;
  --accent:#7c5cff; --won:#3f8f5f; --jung:#3b7bbf; --jak:#c98a2e; --bad:#c0392b;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#17161a; --panel:#1f1e23; --line:#34323a; --ink:#e8e5e0; --dim:#918a83;
  --won:#63b183; --jung:#6ba4dd; --jak:#e0aa5a; --bad:#e07b6e;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,sans-serif;}
button,input,select,textarea{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:var(--sw,250px) 5px 1fr 5px var(--cw,300px);
  grid-template-rows:44px 1fr;height:100vh}
.rz{cursor:col-resize;background:var(--line);opacity:.35;transition:opacity .15s}
.rz:hover,.rz.drag{opacity:1;background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
#app.nos{grid-template-columns:0 5px 1fr 5px var(--cw,300px)}
#app.noc{grid-template-columns:var(--sw,250px) 5px 1fr 5px 0}
#app.nos.noc{grid-template-columns:0 5px 1fr 5px 0}
/* 접을 때 display:none 을 쓰면 그리드 아이템이 앞 칼럼으로 밀린다.
   칼럼 폭만 0 으로 두고 내용은 잘라낸다. */
#app.nos #side,#app.noc #cart{overflow:hidden;border:none}
/* 담은 태그를 안 쓰는 그룹에서만 우측 리사이저를 죽인다.
   이미지 그룹에서는 접혀 있어도 드래그로 되살릴 수 있어야 한다. */
#app:not([data-g=img]) #rzR{pointer-events:none;opacity:0}
header{grid-column:1/-1;display:flex;align-items:center;gap:4px;padding:0 12px;
  background:var(--panel);border-bottom:1px solid var(--line)}
header .brand{font-weight:700;margin-right:12px;letter-spacing:-.3px}
header .sp{flex:1}
.tab{padding:5px 13px;border:1px solid transparent;border-radius:7px;background:none;cursor:pointer;color:var(--dim)}
.tab:hover{background:var(--bg)}
.tab.on{background:var(--bg);border-color:var(--line);color:var(--ink);font-weight:600}
.sep{width:1px;height:18px;background:var(--line);margin:0 5px}
.grp-t.on{background:var(--accent);color:#fff;border-color:var(--accent)}
#subs{display:flex;gap:3px}
#subs .tab{padding:4px 11px;font-size:13px}
.blk{margin:0 0 12px}
.blk label{display:block;font-weight:700;font-size:13px;margin-bottom:3px}
.blk .hint{font-weight:400;color:var(--dim);font-size:12px;margin-left:6px}
.blk textarea{min-height:56px}
.cnt{font-family:var(--mono);font-size:12px;color:var(--dim)}
.blk label{display:flex;align-items:baseline;gap:6px}
.blk .bc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);font-weight:400}
.blk .bc.z{opacity:.35}
.sum{display:flex;gap:18px;flex-wrap:wrap;align-items:center;padding:10px 14px;margin-bottom:14px;
  border:1px solid var(--line);border-radius:9px;background:var(--panel);position:sticky;top:0;z-index:2}
.sum b{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-.5px}
.sum .u{font-size:11px;color:var(--dim);margin-left:2px}
.sum .it{display:flex;flex-direction:column;gap:1px}
.sum .k{font-size:11px;color:var(--dim)}
.sum input{width:82px;padding:3px 7px;border:1px solid var(--line);border-radius:6px;background:var(--bg);
  font-family:var(--mono);font-size:12px}
.gauge{flex:1;min-width:120px;height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--won);transition:width .15s}
.gauge i.warn{background:var(--jak)} .gauge i.over{background:var(--bad)}
.over-t{color:var(--bad);font-weight:700}
#side,#cart{background:var(--panel);overflow:auto}
#side{border-right:1px solid var(--line)}
#cart{border-left:1px solid var(--line);display:flex;flex-direction:column}
main{overflow:auto;padding:22px 30px}
.muted{color:var(--dim)}
.grp{padding:9px 12px 3px;font-size:11px;font-weight:700;color:var(--dim);letter-spacing:.6px;
  cursor:pointer;user-select:none;display:flex;align-items:center;gap:4px}
.grp:hover{color:var(--ink)}
.grp .ar{display:inline-block;transition:transform .15s;font-size:9px}
.grp.fold .ar{transform:rotate(-90deg)}
.grp .n{margin-left:auto;font-weight:400;opacity:.6}
.f{display:flex;align-items:center;gap:6px;padding:4px 12px;cursor:pointer;font-size:13px;
  border-left:2px solid transparent}
.f:hover{background:var(--bg)}
.f.on{background:var(--bg);border-left-color:var(--accent);font-weight:600}
.f span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.dot.원문{background:var(--won)} .dot.정리{background:var(--jung)}
.dot.작업{background:var(--jak)} .dot.csv{background:var(--dim)}
.badge{display:inline-block;padding:1px 7px;border-radius:5px;font-size:11px;font-weight:700;
  border:1px solid currentColor}
.badge.원문{color:var(--won)} .badge.정리{color:var(--jung)} .badge.작업{color:var(--jak)}
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input[type=search],.bar select,.bar input[type=text]{
  padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
.bar input[type=search]{min-width:210px}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel);z-index:1;font-size:12px;color:var(--dim)}
tbody tr:hover{background:var(--panel)}
code,.tag{font-family:var(--mono);font-size:12.5px}
.tag{cursor:pointer;padding:1px 5px;border-radius:5px;background:var(--panel);border:1px solid var(--line)}
.tag:hover{border-color:var(--accent)}
.nsfw{color:var(--bad);font-weight:700;font-size:11px}
#cart .head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
/* 패널이 좁아지면 단계적으로 줄인다 — lg → md → sm */
#cart .head .ttl-lg,#cart .head .ttl-md,#cart .head .ttl-sm{white-space:nowrap}
#cart .head .ttl-md,#cart .head .ttl-sm{display:none}
#cart .clear-i{display:none}          /* 기본은 lg — 텍스트 버튼 */
#cart[data-w=md] .head .ttl-lg{display:none} #cart[data-w=md] .head .ttl-md{display:inline}
#cart[data-w=sm] .head .ttl-lg{display:none} #cart[data-w=sm] .head .ttl-sm{display:inline}
#cart[data-w=sm] .head{padding:10px 6px;justify-content:center}
#cart[data-w=sm] #clear{padding:3px 6px}
#cart[data-w=sm] .clear-t{display:none}
#cart[data-w=md] .clear-i,#cart[data-w=sm] .clear-i{display:inline}
#cart[data-w=md] .clear-t{display:none}
#cart[data-w=md] .ci select{width:60px}
#cart[data-w=sm] .ci{padding:5px 6px;gap:4px}
#cart[data-w=sm] .ci select{display:none}
#side[data-w=sm] .grp .n{display:none}
#side[data-w=sm] .f{padding:4px 7px}
#cart .list{flex:1;overflow:auto}
.ci{padding:6px 12px;border-bottom:1px solid var(--line);display:flex;gap:6px;align-items:center}
.ci select{flex:none;width:88px;padding:2px 4px;border:1px solid var(--line);border-radius:5px;
  background:var(--bg);font-size:11px}
.ci .t{flex:1;font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .x{cursor:pointer;color:var(--dim);border:none;background:none;padding:0 2px}
.ci .x:hover{color:var(--bad)}
.md pre{position:relative}
.md pre .cp{position:absolute;top:6px;right:6px;padding:2px 9px;font-size:11px;
  border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--dim);
  cursor:pointer;opacity:0;transition:opacity .15s}
.md pre:hover .cp{opacity:1}
.md pre .cp:hover{color:var(--ink);border-color:var(--accent)}
pre{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px;
  overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
textarea{width:100%;min-height:130px;padding:11px;border:1px solid var(--line);border-radius:9px;
  background:var(--panel);font-family:var(--mono);font-size:12.5px;resize:vertical}
.md h1{font-size:23px;margin:0 0 4px;letter-spacing:-.4px}
.md h2{font-size:18px;margin:26px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--line)}
.md h3{font-size:15px;margin:20px 0 6px}
.md h4{font-size:14px;margin:16px 0 4px}
.md blockquote{margin:10px 0;padding:8px 13px;border-left:3px solid var(--line);
  background:var(--panel);border-radius:0 7px 7px 0;color:var(--dim)}
.md blockquote strong{color:var(--ink)}
.md table{margin:10px 0}
.md ul,.md ol{padding-left:20px;margin:8px 0}
.md li{margin:2px 0}
.md hr{border:none;border-top:1px solid var(--line);margin:20px 0}
.md a{color:var(--accent)}
.md code{background:var(--panel);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
.md pre code{background:none;border:none;padding:0}
.res{margin:8px 0;padding:10px 13px;border:1px solid var(--line);border-radius:9px;background:var(--panel)}
.res.ok{border-left:3px solid var(--won)} .res.no{border-left:3px solid var(--bad)}
.slot{display:grid;grid-template-columns:36px 118px 1fr;gap:8px;padding:3px 0;
  border-bottom:1px solid var(--line);align-items:baseline}
.slot .n{font-family:var(--mono);color:var(--dim);font-size:12px}
.slot .v{font-family:var(--mono);font-size:12.5px}
.slot.empty{opacity:.35}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:var(--bg);padding:8px 18px;border-radius:20px;font-size:13px;opacity:0;
  transition:opacity .2s;pointer-events:none;z-index:99}
.toast.on{opacity:1}
@media(max-width:1000px){#app{grid-template-columns:1fr}#side,#cart,.rz{display:none}}
</style>

<body>
<div id="app">
  <header>
    <div class="brand">character</div>
    <button class="tab grp-t on" data-g="read">읽기</button>
    <button class="tab grp-t" data-g="img">이미지</button>
    <button class="tab grp-t" data-g="bot">챗봇</button>
    <span class="sep" id="subsep" hidden></span>
    <span id="subs"></span>
    <div class="sp"></div>
    <button class="tab" id="reload" title="저장소 다시 읽기 (터미널에서 만든 파일 반영)">↻</button>
    <button class="tab" id="tgS" title="파일 목록 접기/펼치기">◧</button>
    <span class="muted" id="stat">불러오는 중…</span>
  </header>
  <nav id="side"></nav>
  <div class="rz" id="rzL" title="드래그로 너비 조절 · 더블클릭으로 접기"></div>
  <main id="main"></main>
  <div class="rz" id="rzR" title="드래그로 너비 조절 · 더블클릭으로 접기"></div>
  <aside id="cart">
    <div class="head">
      <strong><span class="ttl-lg">담은 태그</span><span class="ttl-md">태그</span><span class="ttl-sm">태</span></strong>
      <span class="muted" id="cn">0</span>
      <div class="sp" style="flex:1"></div>
      <button class="btn" id="clear" title="비우기" style="padding:3px 9px;font-size:12px">
        <span class="clear-t">비우기</span><span class="clear-i">✕</span></button>
    </div>
    <div class="list" id="clist"></div>
  </aside>
</div>
<div class="toast" id="toast"></div>

<script>
/* ─────────────────────────────────────────────
   character 작업 뷰어
   - 저장소 파일을 런타임에 읽는다. 데이터를 박아넣지 않는다.
   - 디렉터리 목록으로 파일을 자동 발견하므로 파일을 추가해도 코드를 고칠 필요 없다.
     (python3 -m http.server 의 자동 인덱스를 이용)
   ───────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKIP = /^(\.|dcgall\/|viewer\/|node_modules)/;
/* 뷰어가 viewer/ 안에 있으므로 저장소 루트를 기준으로 잡는다. */
const ROOT = location.pathname.replace(/viewer\/[^/]*$/, '');

const SLOTS = ['00 카메라·구도','01 성별','02 캐릭터','03 시선','04 얼굴','05 머리','06 상체','07 하체',
'08 신체 상태','09 직업·종족','10 캐릭터 상황','11 자세','12 동작','13 감정','14 장르','15 재질','16 구조',
'17 상의','18 겉옷·팔','19 하의·다리','20 머리·목','21 팔·허리','22 다리·메인','23 신발','24 배경',
'25 소품','26 분위기'];

const S = { files:[], md:{}, dict:[], style:[], artist:[], links:[],
            tagset:new Set(), preset_vocab:new Set(), presets:{Q:{},N:{}},
            cart:[], cur:null, tab:'read', group:'read', static:false };

/* ── 저장소 훑기 ────────────────────────────── */
async function listDir(path){
  const r = await fetch(path);
  if(!r.ok) throw new Error(path+' '+r.status);
  const html = await r.text();
  const out = [];
  for(const m of html.matchAll(/href="([^"]+)"/g)){
    let h = decodeURIComponent(m[1]);
    if(h.startsWith('/')||h.startsWith('?')||h.startsWith('..')||h==='./') continue;
    out.push(path + h);
  }
  return out;
}
async function walk(path, depth=0){
  if(depth > 4) return [];
  let items;
  try{ items = await listDir(path); }catch{ return []; }
  const files = [];
  for(const it of items){
    const rel = it.slice(ROOT.length);
    if(SKIP.test(rel.replace(/^\//,''))) continue;
    if(it.endsWith('/')) files.push(...await walk(it, depth+1));
    else if(/\.(md|csv)$/i.test(it)) files.push(rel);
  }
  return files;
}

/* ── CSV ────────────────────────────────────── */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  text = text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  const hdr = rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(c=>c.trim()))
             .map(r=>Object.fromEntries(hdr.map((h,i)=>[h,(r[i]??'').trim()])));
}

/* ── 아주 작은 마크다운 렌더러 ─────────────────
   CDN 의존 없이 저장소 문서(제목·표·코드·목록·인용)를 렌더한다. */
function inline(s){
  return esc(s)
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMD(src){
  const L = src.split('\n'), out=[]; let i=0;
  const flushList = (tag, items)=> out.push(`<${tag}>`+items.map(x=>`<li>${inline(x)}</li>`).join('')+`</${tag}>`);
  while(i<L.length){
    const l = L[i];
    if(/^```/.test(l)){
      const buf=[]; i++;
      while(i<L.length && !/^```/.test(L[i])) buf.push(L[i++]);
      i++; out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>'); continue;
    }
    if(/^\s*\|/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(L[i+1]||'')){
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head = cells(l); i+=2; const body=[];
      while(i<L.length && /^\s*\|/.test(L[i])) body.push(cells(L[i++]));
      out.push('<table><thead><tr>'+head.map(h=>`<th>${inline(h)}</th>`).join('')+'</tr></thead><tbody>'
        +body.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table>');
      continue;
    }
    let m;
    if(m=l.match(/^(#{1,4})\s+(.*)$/)){ out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if(/^\s*(---|===)\s*$/.test(l)){ out.push('<hr>'); i++; continue; }
    if(/^>\s?/.test(l)){
      const buf=[]; while(i<L.length && /^>\s?/.test(L[i])) buf.push(L[i++].replace(/^>\s?/,''));
      out.push('<blockquote>'+renderMD(buf.join('\n'))+'</blockquote>'); continue;
    }
    if(/^\s*[-*]\s+/.test(l)){
      const buf=[]; while(i<L.length && /^\s*[-*]\s+/.test(L[i])) buf.push(L[i++].replace(/^\s*[-*]\s+/,''));
      flushList('ul',buf); continue;
    }
    if(/^\s*\d+\.\s+/.test(l)){
      const buf=[]; while(i<L.length && /^\s*\d+\.\s+/.test(L[i])) buf.push(L[i++].replace(/^\s*\d+\.\s+/,''));
      flushList('ol',buf); continue;
    }
    if(l.trim()===''){ i++; continue; }
    const buf=[]; while(i<L.length && L[i].trim() && !/^(#{1,4}\s|>|\s*[-*]\s|\s*\d+\.\s|```|\s*\|)/.test(L[i])) buf.push(L[i++]);
    out.push('<p>'+inline(buf.join(' '))+'</p>');
  }
  return out.join('\n');
}
const gradeOf = src => (src.split('\n')[0].match(/\[(원문|정리|작업|도구)\]/)||[])[1] || '';

/* ── 로드 ───────────────────────────────────── */
const norm = t => t.replace(/_/g,' ').trim().toLowerCase();
async function boot(){
  /* GitHub Pages 처럼 디렉터리 목록을 주지 않는 곳에서는 manifest.json 을 쓴다.
     로컬에서 파일을 추가했는데 목록에 없다면 node viewer/build-manifest.mjs 로 다시 만든다. */
  try{
    const r = await fetch(ROOT+'viewer/manifest.json', {cache:'no-store'});
    if(r.ok){ S.files = (await r.json()).files; S.static = true; }
  }catch{}
  if(!S.files.length){ try{ S.files = await walk(ROOT); }catch{} }
  if(!S.files.length){
    $('#main').innerHTML='<p class="res no">파일 목록을 읽지 못했습니다.<br>'
      +'로컬이면 저장소 루트에서 <code>node viewer/serve.mjs</code> 로 열고,<br>'
      +'정적 호스팅이면 <code>node viewer/build-manifest.mjs</code> 로 목록을 만들어 커밋하세요.</p>';
    return;
  }
  if(!S.files.length){ $('#main').innerHTML='<p class="res no">파일을 찾지 못했습니다. 디렉터리 목록을 제공하는 서버로 열어주세요.</p>'; return; }

  const get = async p => (await fetch(ROOT + p)).text();
  const find = re => S.files.find(f=>re.test(f));

  await Promise.all(S.files.filter(f=>f.endsWith('.md')).map(async f=>{ S.md[f]=await get(f); }));

  const d=find(/1-태그사전\.csv$/), st=find(/1-스타일태그\.csv$/), ar=find(/1-작가태그\.csv$/);
  if(d)  S.dict   = parseCSV(await get(d));
  if(st) S.style  = parseCSV(await get(st));
  if(ar) S.artist = parseCSV(await get(ar));
  for(const f of S.files.filter(f=>/참고링크\.csv$/.test(f)))
    S.links.push(...parseCSV(await get(f)).map(r=>({...r,_src:f.includes('챗봇')?'챗봇':'이미지'})));

  for(const r of S.dict) for(const t of (r['태그']||'').split(',')) if(t.trim()) S.tagset.add(norm(t));
  for(const r of S.style) if(r['태그']) S.tagset.add(norm(r['태그']));
  for(const r of S.artist) if(r['태그']) S.tagset.add(norm(r['태그']));

  for(const f of S.files.filter(f=>/스타일프리셋\/.*\.md$/.test(f))){
    const src=S.md[f]||''; const kind=/부정/.test(f)?'N':'Q';
    for(const m of src.matchAll(/^## ([QN]\d+)[^\n]*\n(?:[\s\S]*?)```\n([\s\S]*?)```/gm))
      S.presets[kind][m[1]] = m[2].trim();
  }
  /* 프리셋에 쓰인 어휘도 '아는 태그'로 친다.
     태그사전은 2022년 danbooru 기준이라 8k · dramatic contrast 같은
     퀄리티·조명 어휘가 아예 없다. 그것까지 미상으로 잡으면 오탐만 쌓인다. */
  for(const kind of ['Q','N'])
    for(const body of Object.values(S.presets[kind]))
      for(const t of body.replace(/-?[\d.]+::/g,'').replace(/::/g,'').split(','))
        if(t.trim()) S.preset_vocab.add(norm(t));

  $('#stat').textContent = `${S.files.length}개 파일 · 태그 ${S.tagset.size.toLocaleString()}`;
  loadCart(); drawSide(); show(S.files.find(f=>f==='README.md')||S.files[0]);
}

   부팅 때 한 번만 훑기 때문에 이걸 안 하면 저장해도 목록에 안 나온다. */
async function addFile(path, content){
  S.md[path] = content;
  if(!S.files.includes(path)){ S.files.push(path); S.files.sort(); }
  drawSide();
}
/* 저장소를 다시 훑는다 — 터미널에서 파일을 만들었을 때 */
async function reload(){
  const before=S.files.length;
  try{
    const r=await fetch(ROOT+'viewer/manifest.json',{cache:'no-store'});
    S.files = r.ok ? (await r.json()).files : await walk(ROOT);
  }catch{ S.files = await walk(ROOT); }
  await Promise.all(S.files.filter(f=>f.endsWith('.md') && !(f in S.md))
    .map(async f=>{ S.md[f]=await (await fetch(ROOT+f)).text(); }));
  drawSide();
  toast(`${S.files.length}개 파일${S.files.length>before?` (+${S.files.length-before})`:''}`);
}

/* ── 저장 (99_작업중/) ──────────────────────────
   정적 서버(python http.server)에는 쓰기 엔드포인트가 없다.
   그때는 파일 내려받기로 대체한다. */
async function saveDraft(name, content, kind){
  if(!name){ toast('이름을 입력하세요'); return; }
  try{
    let r = await fetch(ROOT+'_save', {method:'POST', headers:{'content-type':'application/json'},
      body:JSON.stringify({name, content})});
    if(r.status===409){
      if(!confirm(`99_작업중/${name}.md 가 이미 있습니다. 덮어쓸까요?`)) return;
      r = await fetch(ROOT+'_save', {method:'POST', headers:{'content-type':'application/json'},
        body:JSON.stringify({name, content, overwrite:true})});
    }
    if(r.ok){
      const j=await r.json();
      await addFile(j.path, content);       /* 목록에 즉시 반영 */
      toast(j.path+' 저장됨');
      return;
    }
    toast('저장 실패: '+ await r.text());
  }catch{
    /* 정적 서버 — 내려받기로 */
    const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([content],{type:'text/markdown'}));
    a.download=name+'.md'; a.click(); URL.revokeObjectURL(a.href);
    toast('서버가 쓰기를 지원하지 않아 내려받았습니다');
  }
}

function head(o){

          (o.limit?'글자수: '+o.count+' / '+o.limit:'글자수: '+o.count),

/* ── 입력 중 기호 변환 (노션식) ─────────────────
   저장소 표기 규칙이 → · · 를 쓰므로 타이핑을 그쪽으로 유도한다. */
const SUBS = [[/->$/,'→'],[/<-$/,'←'],[/=>$/,'⇒'],[/\.\.\.$/,'…'],[/!=$/,'≠'],[/>=$/,'≥'],[/<=$/,'≤']];
function autoSym(ta){
  const p=ta.selectionStart, before=ta.value.slice(0,p);
  for(const [re,ch] of SUBS){
    const m=before.match(re);
    if(m){
      const cut=before.length-m[0].length;
      ta.value = ta.value.slice(0,cut) + ch + ta.value.slice(p);
      ta.selectionStart = ta.selectionEnd = cut + ch.length;
      return true;
    }
  }
  return false;
}

const botKey='char.bot';
const botLoad=()=>{ try{ return JSON.parse(localStorage.getItem(botKey))||{}; }catch{ return {}; } };
const botSave=o=>localStorage.setItem(botKey,JSON.stringify(o));
function botAssemble(d){
  return BLOCKS.map(([n])=>{
    const v=(d[n]||'').trim();
    return v ? `[${n}]\n${v}` : '';
  }).filter(Boolean).join('\n\n');
}
function countOf(t){
  const ch=t.length, ns=t.replace(/\s/g,'').length, ko=(t.match(/[가-힣]/g)||[]).length;
  return { ch, ns, ko, tok: Math.round(ko*1.4 + (ch-ko)*0.3) };
}

/* ── 챗봇 검토 (05_검토/01 A·B절 기계 판정) ──── */
function drawBotCheck(){
  $('#main').innerHTML=`<div class="bar"><strong>챗봇 프롬프트 검토</strong>
      <span class="muted">05_검토/01 의 A절(형식)과 B절(블록 유무)을 판정합니다</span>
      <span class="sp" style="flex:1"></span>
      <button class="btn" id="bload">작성 탭에서 가져오기</button></div>
    <textarea id="bin" placeholder="프롬프트를 붙여넣으세요"></textarea>
    <div class="bar" style="margin-top:10px"><button class="btn pri" id="bgo">검사</button>
      <span class="muted">C절 밀도는 판단이 필요해 Claude 에게 맡기세요</span></div>
    <div id="brep"></div>`;
  $('#bload').onclick=()=>{ $('#bin').value=botAssemble(botLoad()); };
  $('#bgo').onclick=()=>{
    const t=$('#bin').value;
    const R=(ok,title,body)=>`<div class="res ${ok?'ok':'no'}"><strong>${title}</strong>${body?'<br>'+body:''}</div>`;
    const N=(title,body)=>`<div class="res"><strong>${title}</strong>${body?'<br>'+body:''}</div>`;

    /* A1 형식 혼용 */
    const fm=[];
    if(/^\s*<\w+>/m.test(t)&&/<\/\w+>/.test(t)) fm.push('XML');
    if(/^#{1,6}\s+\S/m.test(t)) fm.push('Markdown');
    if(/^\s{2,}\w[\w-]*:\s*\S/m.test(t)) fm.push('YAML');
    if(/^\w[\w ]*\s=\s\S/m.test(t)) fm.push('INI');
    if(/^\[[^\]]+\]\s*$/m.test(t)) fm.push('블록([ ])');

    /* A2 언어 혼용 — 줄 단위로 어느 문자가 주도하는지 */
    const lines=t.split('\n').filter(l=>l.trim().length>8);
    let ko=0,en=0,zh=0;
    for(const l of lines){
      const k=(l.match(/[가-힣]/g)||[]).length,
            e=(l.match(/[A-Za-z]/g)||[]).length,
            c=(l.match(/[\u4e00-\u9fff]/g)||[]).length;
      const m=Math.max(k,e,c); if(!m) continue;
      if(m===k) ko++; else if(m===c) zh++; else en++;
    }
    const langs=[['한국어',ko],['영어',en],['중국어',zh]].filter(([,n])=>n/Math.max(lines.length,1)>0.15);

    /* A3 OOC · A4 유저 지칭 */
    const ooc=/\bOOC\b/i.test(t);
    const uu=(t.match(/\{\{user\}\}/g)||[]).length;
    const alt=[...new Set((t.match(/유저|사용자|당신|그대/g)||[]))];

    /* A5 메타 헤더 · A6 코드블록 */
    const meta=['플랫폼','언어','형식','글자수','토큰'].filter(k=>new RegExp('^\\s*'+k+'\\s*[:：]','m').test(t));

    /* B 하네스 블록 */
    const found=BLOCKS.map(([n])=>[n, new RegExp('\\[\\s*'+n+'\\s*\\]').test(t)]);
    const missB=found.filter(([,v])=>!v).map(([n])=>n);
    const trg=(t.match(/→/g)||[]).length;

    const cc=countOf(t), ch=cc.ch, koc=cc.ko, est=cc.tok;

    $('#brep').innerHTML=`<h3>결과</h3>`
      + R(fm.length<=1, `A1 형식 — ${fm.length?fm.join(' · '):'감지 안 됨'}`,
          fm.length>1?'<span class="muted">한 프롬프트 칸 안에서는 하나로 통일합니다. Claude 계열이면 XML 이 유리합니다.</span>':'')
      + R(langs.length<=1, `A2 언어 — ${langs.map(([n,c])=>n+' '+c+'줄').join(' · ')||'판정 불가'}`,
          langs.length>1?'<span class="muted">문맥 이탈·엉뚱한 언어 답변의 직접 원인입니다. 한 칸 안에서는 통일하세요.</span>':'')
      + R(!ooc, `A3 OOC 표기 — ${ooc?'발견':'없음'}`,
          ooc?'<span class="muted">몰입이 깨지고 메타 발언을 학습합니다. <code>[출력 규칙]</code> 으로 옮기세요.</span>':'')
      + R(uu>0 && !alt.length, `A4 유저 지칭 — {{user}} ${uu}회${alt.length?' · 다른 표기 '+alt.join(', '):''}`,
          alt.length ? '<span class="muted">'+(uu?'혼재하면 AI가 다른 인물로 해석합니다. ':'{{user}} 대신 다른 표기를 쓰고 있습니다. ')+'플랫폼 표기법으로 통일하세요.</span>'
          : (uu?'':'<span class="muted">{{user}} 지칭이 없습니다. 유저를 부르는 자리가 정말 없는지 확인하세요.</span>'))
      + R(meta.length>=3, `A5 메타 헤더 — ${meta.length?meta.join(' · '):'없음'}`,
          meta.length<3?'<span class="muted">플랫폼 · 언어 · 형식 · 글자수/토큰을 맨 위에 적어두면 나중에 옮길 때 편합니다.</span>':'')
      + R(!missB.length, `B 하네스 블록 — ${9-missB.length}/9`,
          missB.length?missB.map(n=>`<code>[${esc(n)}]</code>`).join(' ')
            +'<br><span class="muted">없는 블록입니다. 증상↔블록 대응은 <code>05_검토/01</code> 하단 표.</span>':'')
      + R(trg>=5, `B ③ Trigger — 조건 → 반응 ${trg}개`,
          trg<5?'<span class="muted">최소 5개를 권합니다. 형용사 한 줄("냉소적이다")은 트리거가 아닙니다.</span>':'')
      + N(`분량 — ${ch.toLocaleString()}자 · 공백 제외 ${cc.ns.toLocaleString()} · 한글 ${koc.toLocaleString()}`,
          `<span class="muted">대략 ${est.toLocaleString()} 토큰 추정. 플랫폼이 글자수제면 자릿수만 보고,
           토큰제면 <code>04_생성기/02</code> 로 영문 변환을 검토하세요.</span>`)
      + N('C 밀도 — 기계 판정 불가',
          '<span class="muted">고도·고신호 최소 집합·로어북 이관은 판단이 필요합니다. 터미널에서 Claude 에게 <code>05_검토/01</code> 의 C절로 봐달라고 하세요.</span>');
  };
}

/* ── 이미지 검토 (05_검토/02 A·B절 기계 판정) ── */
function drawCheck(){
  $('#main').innerHTML = `<div class="bar"><strong>이미지 프롬프트 검토</strong>
    <span class="muted">05_검토/02 의 A·B절을 사전 대조로 판정합니다</span></div>
    <textarea id="in" placeholder="프롬프트를 붙여넣으세요"></textarea>
    <div class="bar" style="margin-top:10px"><button class="btn pri" id="go">검사</button>
      <span class="muted">A1 태그 실재 · A2 언더바 · A3 NSFW · B2 숫자 끝 공백 · B4 :: 짝</span></div>
    <div id="rep"></div>`;
  $('#go').onclick=()=>{
    const raw=$('#in').value;

    /* `3::a, b, c::` 처럼 가중치 그룹 안의 쉼표로는 자르지 않는다. */
    const splitTop = s => {
      const out=[]; let cur='', depth=0;
      for(let i=0;i<s.length;i++){
        if(s[i]===':'&&s[i+1]===':'){ depth=depth?0:1; cur+='::'; i++; continue; }
        if(s[i]===','&&!depth){ out.push(cur); cur=''; continue; }
        cur+=s[i];
      }
      out.push(cur); return out.map(t=>t.trim()).filter(Boolean);
    };
    const content = t => t.replace(/^-?[\d.]+::/,'').replace(/::$/,'').trim();
    const norm = t => t.replace(/_/g,' ').trim().toLowerCase();

    const groups = splitTop(raw);
    const miss=[], preset=[], und=[], nsfw=[], numsp=[];
    const nsfwSet=new Set(S.dict.filter(r=>r['NSFW']==='TRUE')
      .flatMap(r=>(r['태그']||'').split(',').map(x=>norm(x))));

    let count=0;
    for(const g of groups){
      const inner = content(g);
      /* 가중치 그룹의 닫는 :: 바로 앞이 숫자면 한 칸 띄어야 한다 */
      if(/::/.test(g) && /\d$/.test(inner) && !/\d\s::/.test(g)) numsp.push(g);
      for(const t of inner.split(',')){       /* 그룹 안 개별 태그까지 검사 */
        const b=t.trim(); if(!b) continue;
        count++;
        if(b.includes('_')) und.push(b);
        const n=norm(b.replace(/^artist:\s*/,''));
        if(nsfwSet.has(n)) nsfw.push(b);
        if(!S.tagset.has(n) && !/^artist:/.test(b)){
          (S.preset_vocab.has(n) ? preset : miss).push(b);
        }
      }
    }
    const colons=(raw.match(/::/g)||[]).length;
    const uniq=a=>[...new Set(a)];
    const chips=a=>uniq(a).map(t=>`<code>${esc(t)}</code>`).join(' ');
    const R=(ok,title,body)=>`<div class="res ${ok?'ok':'no'}"><strong>${title}</strong>${body?'<br>'+body:''}</div>`;

    $('#rep').innerHTML = `<h3>결과 <span class="muted" style="font-weight:400">태그 ${count}개 · 최상위 ${groups.length}덩어리</span></h3>`
      + R(!miss.length, `A1 태그 실재 — ${miss.length?uniq(miss).length+'개 확인 필요':'전부 확인됨'}`,
          miss.length?chips(miss)
            +'<br><span class="muted">태그사전·스타일태그·프리셋 어디에도 없습니다. 지어낸 태그이거나 표기가 다를 수 있으니 태그 탭에서 확인하세요.</span>'
          :'')
      + (preset.length?`<div class="res"><strong>참고 — 프리셋 어휘 ${uniq(preset).length}개</strong><br>${chips(preset)}
          <br><span class="muted">태그사전엔 없지만 Q·N 프리셋에서 쓰는 퀄리티·조명 어휘입니다. 정상입니다.</span></div>`:'')
      + R(!und.length, `A2 언더바 — ${und.length?uniq(und).length+'개':'없음'}`,
          und.length?chips(und)+'<br><span class="muted">띄어쓰기로 바꿔야 합니다.</span>':'')
      + R(!nsfw.length, `A3 NSFW — ${nsfw.length?uniq(nsfw).length+'개 포함':'없음'}`, nsfw.length?chips(nsfw):'')
      + R(!numsp.length, `B2 숫자로 끝나는 태그 — ${numsp.length?uniq(numsp).length+'개':'문제 없음'}`,
          numsp.length?chips(numsp)+'<br><span class="muted">닫는 <code>::</code> 앞이 숫자면 한 칸 띄웁니다 → <code>1.2::year 2024 ::</code></span>':'')
      + R(colons%2===0, `B4 <code>::</code> 짝 — ${colons}개 ${colons%2?'(홀수 · 짝이 안 맞습니다)':'(맞음)'}`,
          colons%2?'<span class="muted">짝이 안 맞으면 해당 구간이 통째로 무시됩니다.</span>':'');
  };
}

function setGroup(g){

/* ── 패널 너비 · 접기 ─────────────────────────── */
const app=$('#app'), LS={sw:'char.sw', cw:'char.cw', ps:'char.ps'};
const MINW=150, MAXW=560;   /* 패널 최소·최대 너비 */
(function initPanels(){
  const sw=localStorage.getItem(LS.sw), cw=localStorage.getItem(LS.cw);
  if(sw) app.style.setProperty('--sw',sw);
  if(cw) app.style.setProperty('--cw',cw);
  try{ const st=JSON.parse(localStorage.getItem(LS.ps))||{};
    if(st.s) app.classList.add('nos'); }catch{}
  app.classList.add('noc');            /* 첫 화면은 읽기 그룹 — 담은 태그 숨김 */
})();
const savePanels=()=>localStorage.setItem(LS.ps,
  JSON.stringify({s:app.classList.contains('nos'),
                  c:(S.group==='img') ? app.classList.contains('noc') : cartPref()}));
/* 이미지 그룹에서 사용자가 담은 태그를 접어뒀는지 */
function cartPref(){ try{ return !!(JSON.parse(localStorage.getItem(LS.ps))||{}).c; }catch{ return false; } }

function drag(el, which){
  el.onmousedown = e => {
    e.preventDefault();
    const side = which==='sw';
    if(side && app.classList.contains('nos')){ app.classList.remove('nos'); savePanels(); }
    if(!side && app.classList.contains('noc')){ app.classList.remove('noc'); savePanels(); }
    el.classList.add('drag'); document.body.classList.add('resizing');
    const move = ev => {
      const w = side ? ev.clientX : window.innerWidth - ev.clientX;
      const v = Math.max(MINW, Math.min(MAXW, w)) + 'px';
      app.style.setProperty('--'+which, v);
      localStorage.setItem(LS[which], v);
    };
    const up = () => {
      el.classList.remove('drag'); document.body.classList.remove('resizing');
      removeEventListener('mousemove',move); removeEventListener('mouseup',up);
    };
    addEventListener('mousemove',move); addEventListener('mouseup',up);
  };
  el.ondblclick = () => { app.classList.toggle(which==='sw'?'nos':'noc'); savePanels(); };
}

/* 패널 폭에 따라 data-w 를 붙인다. 드래그 중에도 갱신된다. */
function widthClass(el, bp){
  const set=()=>{ const w=el.getBoundingClientRect().width;
    el.dataset.w = w>=bp[0] ? 'lg' : (w>=bp[1] ? 'md' : 'sm'); };
  new ResizeObserver(set).observe(el); set();
}
widthClass($('#cart'), [230,165]);
widthClass($('#side'), [210,170]);
