<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>luvheil 에셋</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <header class="hdr" id="hdr">
    <div class="hdr-top">
      <div class="brand"><b>luvheil 에셋</b><span id="sub"></span></div>
      <div class="hdr-actions">
        <button class="ctl i" id="tgCartM" title="담은 태그 열기/닫기">◨</button>
        <button class="ctl i" id="reload" title="저장소 다시 읽기 (터미널에서 만든 파일 반영)">⟳</button>
      </div>
    </div>
    <div class="hdr-tools" id="tools">
      <div class="hdr-row"><div class="segwrap"><div class="seg" id="subs"></div></div></div>
    </div>
  </header>
  <main id="main"></main>
  <div class="rz" id="rzR" title="드래그로 너비 조절 · 더블클릭으로 접기"></div>
  <aside id="cart">
    <div class="head">
      <strong><span class="ttl-lg">담은 태그</span><span class="ttl-md">태그</span><span class="ttl-sm">태</span></strong>
      <span class="muted" id="cn">0</span>
      <span style="flex:1"></span>
      <button class="btn i danger" id="clear" title="담은 태그 비우기">✕</button>
    </div>
    <div class="list" id="clist"></div>
  </aside>
</div>
<div id="scrim"></div>
<div id="toast"></div>

<script src="js/core.js"></script>
<script src="js/asset.js"></script>
<script>boot();</script>
</body>
</html>
