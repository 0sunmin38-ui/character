<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>luvheilassistant — 작업 뷰어</title>
<style>
/* ═══ 디자인 토큰 — AIchatCollector 와 같은 체계 ═══════════════
   두 도구를 오갈 때 색·간격·컨트롤이 같아야 손이 헷갈리지 않는다.  */
:root{
  --bg:#f5f8fc; --panel:#fff; --sunken:#eef3fa;
  --ink:#152232; --ink2:#3d5068; --dim:#7488a0; --faint:#9aabc0;
  --line:#dde6f1; --line2:#eaf0f7;
  --accent:#2166cf; --accent-h:#1a55b0; --accent-w:#e7f0fd; --accent-b:#b9d3f7;
  --chip:#eef3fa; --hi:#ffeeb0; --ok:#1d7f5e; --warn:#b3781a; --bad:#c0413c;
  --ctl:24px; --r:6px; --r-sm:5px;   /* r=입력·버튼 / r-sm=칩·세그먼트 */
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0e141d; --panel:#161e2a; --sunken:#111925;
  --ink:#e8eff8; --ink2:#c2d0e2; --dim:#8497ae; --faint:#6b7e96;
  --line:#243244; --line2:#1c2735;
  --accent:#5b9df5; --accent-h:#7ab0f8; --accent-w:#16283f; --accent-b:#2f4d73;
  --chip:#1c2735; --hi:#5a4a12; --ok:#5fc79b; --warn:#dfb457; --bad:#e2726c;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
img,video{max-width:100%}

/* ── 컨트롤 공통 ─────────────────────────────────────────── */
.ctl{height:var(--ctl);border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:var(--r);padding:0 9px;font-size:12.5px;line-height:1;vertical-align:middle}
button.ctl{cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:.12s}
/* display 를 지정한 클래스는 hidden 속성을 이긴다 — 그래서 담은 태그 버튼이
   캐릭터 탭에서도 계속 보였다. 여기서 못 박아 둔다. */
[hidden]{display:none !important}
button.ctl:hover{border-color:var(--accent-b);background:var(--accent-w);color:var(--accent)}
button.ctl.on,button.ctl.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.ctl.primary:hover{background:var(--accent-h);border-color:var(--accent-h);color:#fff}
button.ctl.danger{color:var(--bad)}
button.ctl.danger:hover{border-color:var(--bad);background:transparent;color:var(--bad)}
button.ctl:disabled{opacity:.55;cursor:default}
.ctl.i{width:var(--ctl);min-width:var(--ctl);padding:0;justify-content:center;font-size:13px}
input.ctl,select.ctl{background:var(--sunken)}
input.ctl:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--panel);
  box-shadow:0 0 0 3px var(--accent-w)}
select.ctl{cursor:pointer;padding-right:23px;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--dim) 50%),linear-gradient(135deg,var(--dim) 50%,transparent 50%);
  background-position:calc(100% - 13px) calc(50% + 1px),calc(100% - 9px) calc(50% + 1px);
  background-size:4px 4px;background-repeat:no-repeat}
select.ctl:hover{border-color:var(--accent-b)}
/* 폭이 부족하면 글자를 이모지로 대체한다 — .t 는 글자, .e 는 이모지 */
.e{display:none} .t{display:inline}
.count{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums;margin-left:auto;white-space:nowrap}
.muted{color:var(--dim)}

/* ── 레이아웃 ────────────────────────────────────────────── */
/* 문서는 별도 페이지가 됐으므로 좌측은 상시 칼럼이 아니라 서랍이다 —
   작업 화면(에셋·캐릭터)은 가로를 다 쓴다. */
#app{display:grid;grid-template-columns:1fr 5px var(--cw,300px);
  grid-template-rows:auto 1fr;height:100dvh}
.rz{background:var(--line2);cursor:col-resize;transition:background .12s}
.rz:hover,.rz.drag{background:var(--accent)}
body.resizing{cursor:col-resize;user-select:none}
#app.noc{grid-template-columns:1fr 5px 0}
#app.noc #cart{overflow:hidden;border:none}
#rzL{display:none}
/* 담은 태그는 에셋에서만 쓴다 — 다른 데선 리사이저도 죽인다 */
#app:not([data-g=img]) #rzR{pointer-events:none;opacity:0}
/* 좌측 서랍 — 폭에 상관없이 겹쳐 뜬다 */
#side{position:fixed;top:0;bottom:0;left:0;z-index:50;width:min(84vw,300px);
  transform:translateX(-101%);transition:transform .22s ease;
  box-shadow:0 0 34px rgba(11,20,32,.28);padding-bottom:env(safe-area-inset-bottom)}
#side.open{transform:none}

/* ── 헤더 (GNB) ──────────────────────────────────────────── */
.hdr{grid-column:1/-1;background:var(--panel);border-bottom:1px solid var(--line);
  box-shadow:0 1px 3px rgba(21,34,50,.04);z-index:30}
.hdr-top{display:flex;align-items:center;gap:18px;padding:0 20px;height:52px}
.brand{display:flex;flex-direction:column;min-width:0;gap:2px}
.brand b{font-size:15.5px;letter-spacing:-.015em;line-height:1.25;color:var(--ink)}
.brand span{font-size:11.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:44ch}
.nav{display:flex;gap:4px;align-self:stretch;align-items:stretch;margin-left:8px}
.nav button{padding:0 17px;display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--dim);
  background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:.12s}
.nav button:hover{color:var(--accent);background:var(--accent-w)}
.nav button.active{color:var(--accent);font-weight:600;border-bottom-color:var(--accent)}
/* 글씨 ↔ 이모지는 창 크기가 아니라 헤더의 실제 좌우 너비로 정한다.
   사이드바를 넓히면 창은 그대로여도 헤더가 좁아지므로 미디어 쿼리로는 못 잡는다. */
.nav button .ico{display:none}
.hdr[data-w=md] .brand span{display:none}
.hdr[data-w=sm] .brand{display:none}
.hdr[data-w=sm] .nav button .txt{display:none}
.hdr[data-w=sm] .nav button .ico{display:inline;font-size:17px}
.hdr[data-w=sm] .nav button{padding:0 12px}
.hdr-actions{margin-left:auto;display:flex;gap:8px;flex:none;align-items:center;min-height:var(--ctl)}
/* 테두리 없는 아이콘 버튼 — 햄버거 · 닫기처럼 글자가 필요 없는 것들 */
button.iconbtn{display:inline-flex;align-items:center;justify-content:center;
  border:none;background:none;color:var(--dim);cursor:pointer;
  width:26px;height:26px;border-radius:var(--r);font-size:17px;line-height:1;flex:none;transition:.12s}
button.iconbtn:hover{color:var(--accent);background:var(--accent-w)}
button.iconbtn.x:hover{color:var(--bad);background:transparent}

.hdr-tools{border-top:1px solid var(--line2)}
.hdr-row{display:flex;gap:9px;align-items:center;padding:7px 20px;min-height:calc(var(--ctl) + 14px)}
/* 같은 줄에 서는 것은 전부 --ctl 높이로 맞춘다.
   세그먼트는 테두리 1px 이 있으니 안쪽 버튼은 그만큼 뺀다. */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden;
  background:var(--panel);flex:0 1 auto;min-width:0;height:var(--ctl)}
.seg button{border:none;background:none;color:var(--dim);font-size:12px;
  padding:0 12px;height:calc(var(--ctl) - 2px);cursor:pointer;border-right:1px solid var(--line);
  white-space:nowrap;transition:.12s}
.seg button:last-child{border-right:none}
.seg button:hover{background:var(--accent-w);color:var(--accent)}
.seg button.on{background:var(--accent);color:#fff}
.segwrap{min-width:0;display:flex;align-items:center}
/* 화면 안쪽 두 번째 줄 탭 — 헤더의 것보다 한 단 작게 둬서 층이 보이게 한다 */
.seg2 button{font-size:11.5px;padding:0 11px}

/* 작가 견본 표 — 그림체는 눈으로 고른다 */
td.samp{width:170px;padding:5px 8px;vertical-align:middle}
td.samp img{display:block;width:100%;max-width:158px;height:auto;max-height:190px;object-fit:cover;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--sunken);cursor:zoom-in}
td.samp img:hover{border-color:var(--accent-b)}
td.samp .drop{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3px;
  min-height:76px;border:1px dashed var(--line);border-radius:var(--r-sm);background:var(--sunken);
  font-family:var(--mono);font-size:10.5px;color:var(--faint);text-align:center;padding:6px;line-height:1.5}
td.samp.over .drop,td.samp.over img{border-color:var(--accent);background:var(--accent-w);border-style:solid}
#main[data-w=sm] td.samp{width:104px}
#main[data-w=sm] td.samp img{max-width:92px}

/* ── 패널 ────────────────────────────────────────────────── */
#side,#cart{background:var(--panel);overflow:auto;overscroll-behavior:contain}
#side{border-right:1px solid var(--line)}
#cart{border-left:1px solid var(--line);display:flex;flex-direction:column}
main{overflow:auto;padding:15px 22px 70px}
#scrim{display:none;position:fixed;inset:0;background:rgba(11,20,32,.42);z-index:40}
#scrim.on{display:block}

/* ── 문서 보기 ─ 작업 화면을 덮고, 닫으면 하던 자리로 ── */
#docpage{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
#docpage[hidden]{display:none}
.docbar{display:flex;gap:9px;align-items:center;padding:0 20px;height:46px;flex:none;
  background:var(--panel);border-bottom:1px solid var(--line)}
.docbar strong{font-size:14.5px;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.docbody{flex:1;overflow:auto;padding:24px 26px 90px}
.docbody .md{max-width:78ch;margin:0 auto}
body.reading{overflow:hidden}
@media (max-width:700px){
  .docbar{padding:0 12px;height:48px}
  .docbody{padding:16px 13px 80px}
}

/* ── 표 열 너비 직접 조절 ──────────────────────
   사전은 사람마다 보고 싶은 칸이 다르다. 경계선을 끌어 넓힌다. */
table.grid{table-layout:fixed}
table.grid th{position:relative;user-select:none}
/* 열 경계가 안 보이면 어디까지가 그 열인지 알 수 없다 — 세로선을 넣는다 */
table.grid th,table.grid td{border-right:1px solid var(--line2);overflow:hidden;text-overflow:ellipsis}
table.grid th{border-right-color:var(--line)}
table.grid th:last-child,table.grid td:last-child{border-right:none}
table.grid th .cgrip{position:absolute;top:0;right:-3px;width:7px;height:100%;cursor:col-resize;z-index:2}
table.grid th .cgrip:hover::after,table.grid th .cgrip.drag::after{
  content:'';position:absolute;left:2px;top:0;bottom:0;width:2px;background:var(--accent)}
table.grid td.wrap{white-space:normal}

/* 사이드바 */
.grp{padding:9px 13px 3px;font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.08em;
  cursor:pointer;user-select:none;display:flex;align-items:center;gap:5px;text-transform:uppercase}
.grp:hover{color:var(--accent)}
.grp .ar{display:inline-block;transition:transform .15s;font-size:8px}
.grp.fold .ar{transform:rotate(-90deg)}
.grp .n{margin-left:auto;font-weight:400;opacity:.7;letter-spacing:0}
.f{display:flex;align-items:center;gap:7px;padding:3px 13px;cursor:pointer;font-size:13px;
  border-left:2px solid transparent;color:var(--ink2)}
.f:hover{background:var(--sunken)}
.f.on{background:var(--accent-w);border-left-color:var(--accent);color:var(--accent);font-weight:600}
.f span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;flex:none}
.dot.원문{background:var(--ok)} .dot.정리{background:var(--accent)}
.dot.작업{background:var(--warn)} .dot.도구{background:var(--faint)} .dot.csv{background:var(--faint)}
.sidefoot{padding:10px 13px 16px;border-top:1px solid var(--line2);margin-top:8px}
.sidefoot label{display:flex;gap:7px;align-items:center;font-size:11.5px;color:var(--dim);cursor:pointer}
.badge{display:inline-block;padding:1px 8px;border-radius:var(--r-sm);font-size:11px;font-weight:700;
  border:1px solid currentColor}
.badge.원문{color:var(--ok)} .badge.정리{color:var(--accent)}
.badge.작업{color:var(--warn)} .badge.도구{color:var(--dim)}

/* ── 바 · 버튼 줄 ────────────────────────────────────────── */
.bar{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-bottom:10px;min-height:var(--ctl)}
/* 체크박스 딸린 라벨·제목도 같은 높이로 세워야 줄이 흔들리지 않는다 */
.bar>label,.bar>strong,.bar>span:not(.sp){display:inline-flex;align-items:center;height:var(--ctl)}
.bar>label{gap:5px}
.bar .sp{flex:1}
.bar input[type=search]{min-width:200px}
.btn{height:var(--ctl);border:1px solid var(--line);background:var(--panel);color:var(--ink2);
  border-radius:var(--r);padding:0 9px;font-size:12.5px;cursor:pointer;transition:.12s;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{border-color:var(--accent-b);background:var(--accent-w);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--accent-h);border-color:var(--accent-h);color:#fff}
.btn.danger{color:var(--bad)}
.btn.danger:hover{border-color:var(--bad);background:transparent}
/* 글자 없이 기호만 쓰는 버튼 — 정사각으로 맞춰 줄이 뚱뚱해지지 않게 한다 */
.btn.i{width:var(--ctl);min-width:var(--ctl);padding:0;justify-content:center;font-size:13px}
h3{font-size:13.5px;margin:16px 0 6px;color:var(--ink)}

/* ── 표 ──────────────────────────────────────────────────── */
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{border-bottom:1px solid var(--line2);padding:3px 8px;text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--panel);z-index:1;font-size:10.5px;color:var(--faint);
  letter-spacing:.04em;text-transform:uppercase;border-bottom-color:var(--line)}
/* 목적·분류 칸이 두 줄로 넘어가면 표가 들쭉날쭉해진다. 한 줄로 눌러 둔다. */
td.meta,th.meta{font-size:11.5px;white-space:nowrap}
code,.tag{font-size:12px}
tbody tr:hover{background:var(--sunken)}
code,.tag{font-family:var(--mono);font-size:12.5px}
.tag{cursor:pointer;padding:1px 8px;border-radius:var(--r-sm);background:var(--accent-w);
  border:1px solid var(--accent-b);color:var(--accent);line-height:1.6;display:inline-block}
.tag:hover{background:var(--accent);color:#fff}
.nsfw{color:var(--bad);font-weight:700;font-size:11px}
/* 본문 표 — 좁으면 부가 컬럼부터 접는다 */
#main[data-w=md] .opt,#main[data-w=sm] .opt{display:none}
#main[data-w=sm] .opt2{display:none}

/* ── 담은 태그 ───────────────────────────────────────────── */
#cart .head{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px}
#cart .list{flex:1;overflow:auto}
.ci{padding:5px 12px;border-bottom:1px solid var(--line2);display:flex;gap:7px;align-items:center}
.ci select{flex:none;width:92px;padding:0 5px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--sunken);font-size:11px;height:22px}
.ci .t{flex:1;font-family:var(--mono);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci .x{cursor:pointer;color:var(--faint);border:none;background:none;padding:0 3px;font-size:13px}
.ci .x:hover{color:var(--bad)}
#cart .head .ttl-md,#cart .head .ttl-sm{display:none}
#cart[data-w=md] .head .ttl-lg{display:none} #cart[data-w=md] .head .ttl-md{display:inline}
#cart[data-w=sm] .head .ttl-lg{display:none} #cart[data-w=sm] .head .ttl-sm{display:inline}
#cart[data-w=sm] .head{padding:11px 7px;justify-content:center}
#cart[data-w=md] .ci select{width:62px}
#cart[data-w=sm] .ci{padding:6px 7px;gap:5px}
#cart[data-w=sm] .ci select{display:none}

/* ── 마크다운 ────────────────────────────────────────────── */
.md{max-width:78ch}
.md h1{font-size:23px;margin:0 0 6px;letter-spacing:-.02em}
.md h2{font-size:18px;margin:28px 0 9px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.md h3{font-size:15px;margin:22px 0 7px}
.md h4{font-size:14.5px;margin:18px 0 5px}
.md h5{font-size:13.5px;margin:16px 0 5px}
.md h6{font-size:13px;margin:14px 0 4px;color:var(--ink2)}
.md del{color:var(--faint)}
.md p{margin:9px 0;color:var(--ink2)}
.md blockquote{margin:11px 0;padding:9px 14px;border-left:3px solid var(--accent-b);
  background:var(--sunken);border-radius:0 var(--r) var(--r) 0;color:var(--dim)}
.md blockquote strong{color:var(--ink2)}
.md blockquote p{margin:4px 0}
.md table{margin:11px 0}
.md ul,.md ol{padding-left:21px;margin:9px 0;color:var(--ink2)}
.md li{margin:3px 0}
.md hr{border:none;border-top:1px solid var(--line);margin:22px 0}
.md code{background:var(--sunken);border:1px solid var(--line2);padding:1px 5px;border-radius:var(--r-sm)}
.md pre code{background:none;border:none;padding:0}
/* 이미지 — 원문 글의 스크린샷. 눌러서 원본을 연다 */
.md figure{margin:14px 0}
.md .imglink{display:block;line-height:0}
.md .imglink img{border:1px solid var(--line);border-radius:var(--r);background:var(--sunken);
  max-height:640px;object-fit:contain}
.md .imglink:hover img{border-color:var(--accent-b)}
.md .imglink.dead{line-height:1.5}
.md .imgdead{display:inline-block;padding:9px 13px;border:1px dashed var(--line);
  border-radius:var(--r);background:var(--sunken);color:var(--dim);font-size:12.5px}
.md .imglink.dead:hover .imgdead{border-color:var(--accent-b);color:var(--accent)}
.md figcaption{font-size:11.5px;color:var(--faint);line-height:1.5;margin-top:5px}
/* 링크 카드 — 포스타입 글이 쓰는 여러 줄 링크(`[` … `](url)`) */
.md .linkcard{display:block;text-decoration:none;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel);padding:11px 14px;margin:10px 0;transition:.12s}
.md .linkcard:hover{border-color:var(--accent-b);background:var(--accent-w)}
.md .linkcard b{display:block;font-size:13.5px;color:var(--ink);line-height:1.45}
.md .linkcard span{display:block;font-size:12px;color:var(--dim);margin-top:3px;line-height:1.5}
.md .linkcard em{display:block;font-style:normal;font-size:11px;color:var(--faint);margin-top:5px;
  font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.md a{overflow-wrap:anywhere}

pre{background:var(--sunken);border:1px solid var(--line);border-radius:var(--r);padding:10px 11px;
  overflow:auto;font-family:var(--mono);font-size:12.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.md pre{position:relative}
.md pre .cp{position:absolute;top:7px;right:7px;padding:2px 10px;font-size:11px;
  border:1px solid var(--line);border-radius:var(--r-sm);background:var(--panel);color:var(--dim);
  cursor:pointer;opacity:0;transition:.15s}
.md pre:hover .cp,.md pre .cp:focus{opacity:1}
.md pre .cp:hover{color:var(--accent);border-color:var(--accent-b)}
textarea{width:100%;min-height:110px;padding:9px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--panel);font-family:var(--mono);font-size:12.5px;resize:vertical;line-height:1.65}
/* 조립 결과 — 읽기만 하는 자리가 아니라 손대는 자리다 */
textarea.pbox{min-height:82px;background:var(--sunken);margin-bottom:2px}
textarea.pbox:focus{background:var(--panel)}

/* ── 챗봇 작성 ───────────────────────────────────────────── */
.blk{margin:0 0 9px}
.blk label{display:flex;align-items:baseline;gap:7px;font-weight:700;font-size:12.5px;margin-bottom:3px}
.blk .hint{font-weight:400;color:var(--dim);font-size:11.5px}
.blk .bc{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);font-weight:400}
.blk .bc.z{opacity:.4}
.blk textarea{min-height:50px}
.sum{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:8px 13px;margin-bottom:11px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);position:sticky;top:0;z-index:2}
.sum b{font-family:var(--mono);font-size:17px;font-weight:700;letter-spacing:-.03em}
.sum .u{font-size:11px;color:var(--dim);margin-left:2px}
.sum .it{display:flex;flex-direction:column;gap:1px}
.sum .k{font-size:10.5px;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.sum input{width:80px;height:var(--ctl);padding:0 7px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--sunken);font-family:var(--mono);font-size:12px}
.gauge{flex:1;min-width:110px;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.gauge i{display:block;height:100%;background:var(--ok);transition:width .15s}
.gauge i.warn{background:var(--warn)} .gauge i.over{background:var(--bad)}
.over-t{color:var(--bad);font-weight:700}
.cnt{font-family:var(--mono);font-size:12px;color:var(--dim)}

/* ── 판정 결과 ───────────────────────────────────────────── */
.res{margin:6px 0;padding:8px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.res.ok{border-left:3px solid var(--ok)} .res.no{border-left:3px solid var(--bad)}
.res strong{color:var(--ink)}
.slot{display:grid;grid-template-columns:34px 116px 1fr;gap:9px;padding:2px 0;
  border-bottom:1px solid var(--line2);align-items:baseline}
.slot .n{font-family:var(--mono);color:var(--faint);font-size:12px}
.slot .v{font-family:var(--mono);font-size:12.5px;color:var(--ink2);overflow-wrap:anywhere}
.slot.empty{opacity:.35}

/* ── 작업중 (초안) ───────────────────────────────────────── */
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:7px 12px;margin-bottom:5px;transition:.12s}
.card:hover{border-color:var(--accent-b)}
.card .row{display:flex;gap:9px;align-items:center;flex-wrap:nowrap}
.card .nm{font-weight:600;font-size:13.5px;color:var(--ink);flex:1 1 0;min-width:0;cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .nm:hover{color:var(--accent)}
.card .meta{font-size:11.5px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums;flex:none}
.kindbadge{flex:none;font-size:11px;padding:1px 8px;border-radius:var(--r-sm);
  background:var(--chip);color:var(--dim);white-space:nowrap}
/* 파츠 안의 태그 사전 — 짜는 자리를 떠나지 않고 고른다 */
.pick-wrap{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  padding:8px 11px;margin:0 0 11px}
.pick-wrap summary{cursor:pointer;font-size:13px;font-weight:600;list-style:none;
  display:flex;align-items:center;gap:8px}
.pick-wrap summary::-webkit-details-marker{display:none}
.pick-wrap summary::before{content:'▸';color:var(--faint);transition:transform .15s;display:inline-block}
.pick-wrap[open] summary::before{transform:rotate(90deg)}
.pick-wrap summary .muted{font-weight:400;font-size:11.5px}
.pick-wrap .bar{margin-bottom:8px}
/* 한 줄 고치기 폼 */
.rowform{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;padding:10px;margin:0 0 10px;
  border:1px solid var(--accent-b);border-radius:var(--r);background:var(--accent-w)}
.rf{display:flex;flex-direction:column;gap:3px;flex:1 1 130px;min-width:0}
.rf>span{font-size:10.5px;color:var(--dim);letter-spacing:.04em;text-transform:uppercase}
.rf textarea{min-height:62px}
.rfbar{display:flex;gap:7px;flex:1 1 100%;margin-top:2px}
/* 볼 열 고르기 */
.colmenu{position:relative;flex:none}
.colmenu summary{list-style:none;cursor:pointer;height:var(--ctl);display:inline-flex;align-items:center;
  justify-content:center;min-width:var(--ctl);padding:0 7px;font-size:13px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  color:var(--ink2);font-size:13px;white-space:nowrap;transition:.12s}
.colmenu summary::-webkit-details-marker{display:none}
.colmenu summary:hover{border-color:var(--accent-b);background:var(--accent-w);color:var(--accent)}
.colmenu[open] summary{border-color:var(--accent);color:var(--accent)}
.colmenu-body{position:absolute;top:calc(100% + 5px);right:0;z-index:20}
/* 버튼 메뉴와 머리글 팝오버가 같은 옷을 입는다 */
.colmenu-body,.colpop{min-width:176px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:7px;box-shadow:0 8px 26px rgba(21,34,50,.18);
  display:flex;flex-direction:column;gap:1px}
.colpop{position:fixed;z-index:80}
.colmenu-body label,.colpop label{display:flex;gap:8px;align-items:center;font-size:12.5px;
  color:var(--ink2);cursor:pointer;white-space:nowrap;padding:3px 7px;border-radius:var(--r-sm)}
.colmenu-body label:hover,.colpop label:hover{background:var(--sunken)}
.colitem{text-align:left;border:none;background:none;color:var(--ink2);font:inherit;font-size:12.5px;
  padding:4px 7px;border-radius:var(--r-sm);cursor:pointer;white-space:nowrap}
.colitem:hover{background:var(--accent-w);color:var(--accent)}
.colmenu .sep,.colpop .sep{display:block;height:1px;background:var(--line2);margin:4px 2px}
button.mini{height:22px;min-width:22px;padding:0 6px;font-size:12.5px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer;white-space:nowrap}
button.mini:hover{border-color:var(--accent-b);color:var(--accent)}
.card.preset pre{margin:9px 0 0}
.pickrows{max-height:250px;overflow:auto;border:1px solid var(--line2);border-radius:var(--r-sm);
  background:var(--sunken);overscroll-behavior:contain}
.pr{display:flex;gap:9px;align-items:baseline;padding:2px 9px;border-bottom:1px solid var(--line2);font-size:12.5px}
.pr:last-child{border-bottom:none}
.pr:hover{background:var(--panel)}
.pk{flex:0 0 132px;color:var(--faint);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pv{flex:0 0 150px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pt{flex:1;min-width:0}
#main[data-w=sm] .pk,#main[data-w=md] .pk{display:none}
#main[data-w=sm] .pv{flex:0 0 110px}
.card .acts{display:flex;gap:5px;flex:none}
.card .acts button{height:24px;min-width:24px;padding:0 7px;font-size:13px;border-radius:var(--r-sm);
  border:1px solid var(--line);background:var(--panel);color:var(--ink2);cursor:pointer;transition:.12s}
.card .acts button:hover{border-color:var(--accent-b);color:var(--accent)}
.card .acts button.del:hover{border-color:var(--bad);color:var(--bad)}
.card .edit{display:none;margin-top:10px;padding-top:10px;border-top:1px solid var(--line2)}
.card.open .edit{display:block}
.card.open .nm{color:var(--accent)}
.card .edit textarea{min-height:260px;background:var(--sunken)}
.card .editbar{display:flex;gap:7px;align-items:center;margin-top:8px;flex-wrap:wrap}
.empty{color:var(--dim);text-align:center;padding:64px 20px;font-size:13.5px;line-height:1.85}

/* ── 토스트 ──────────────────────────────────────────────── */
#toast{position:fixed;right:20px;bottom:20px;background:var(--panel);border:1px solid var(--line);
  border-left:3px solid var(--ok);border-radius:9px;padding:11px 16px;font-size:12.5px;opacity:0;
  transition:opacity .2s;pointer-events:none;z-index:99;box-shadow:0 8px 26px rgba(21,34,50,.16);color:var(--ink)}
#toast.on{opacity:1}
#toast.bad{border-left-color:var(--bad)}

/* ═══ 반응형 ═══════════════════════════════════════════════
   1180↓ 여백 축소 · 900↓ 패널을 서랍으로 + GNB 2단 + 도구 접기
   600↓  브랜드 부제 삭제 · 480↓ 최소 여백                      */
@media (max-width:1180px){
  .hdr-top{padding:0 15px;gap:12px}
  .hdr-row{padding:10px 15px}
  main{padding:17px 18px 80px}
  .brand span{max-width:30ch}
}

@media (max-width:900px){
  /* 한 칸으로 눕히고, 파일 목록·담은 태그는 서랍으로 뺀다.
     예전처럼 display:none 으로 지워버리면 좁은 화면에서 파일을 아예 고를 수 없었다. */
  #app,#app.noc{grid-template-columns:1fr}
  .rz{display:none}
  #cart{position:fixed;top:0;bottom:0;right:0;z-index:50;width:min(84vw,320px);
    transform:translateX(101%);transition:transform .22s ease;border-left:1px solid var(--line);
    box-shadow:0 0 34px rgba(11,20,32,.28);padding-bottom:env(safe-area-inset-bottom)}
  #app.noc #cart{overflow:auto}     /* 서랍은 접힘 클래스와 무관하다 */
  #cart.open{transform:none}

  .hdr-top{height:auto;min-height:54px;flex-wrap:wrap;gap:9px;padding:9px 14px 0;
    border-bottom:1px solid var(--line2)}
  .brand{order:1;flex:1 1 auto;min-width:0}
  .hdr[data-w=sm] .brand{display:none}
  .brand b{font-size:14.5px}
  .brand span{font-size:11px;max-width:100%}
  .hdr-actions{order:2;margin-left:auto;flex-shrink:0;gap:6px}
  .nav{order:3;flex:1 0 100%;margin:0 -14px;padding:0 14px;border-top:1px solid var(--line2)}
  .nav button{flex:1;justify-content:center;height:44px;padding:0}
  .hdr-tools{border-top:none}
  .hdr-row{padding:10px 14px}
  .segwrap{flex:1 1 auto;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .segwrap::-webkit-scrollbar{display:none}
  .seg{flex:none}

  main{padding:15px 14px 90px}
  .md{max-width:none}
  .sum{gap:13px;padding:10px 12px}
  #toast{left:14px;right:14px;bottom:calc(14px + env(safe-area-inset-bottom));text-align:center}
}

@media (max-width:700px){
  /* 폭이 부족하면 버튼 글자를 이모지로 바꾼다 */
  .hdr-actions .t{display:none}
  .hdr-actions .e{display:inline;font-size:15px;line-height:1}
  .hdr-actions button.ctl{gap:0;padding:0 11px}
  .brand span{display:none}               /* 부가 정보 먼저 버린다 */
  .card .row{gap:7px}
  .card .meta{display:none}
}

@media (max-width:480px){
  .hdr-top{padding:8px 11px 0;gap:6px;min-height:44px}
  .brand b{font-size:14px}
  .nav{margin:0 -11px;padding:0 11px}
  .nav button{height:42px;font-size:13px}
  .hdr-row{padding:9px 11px}
  main{padding:13px 11px 90px}
  .seg button{padding:0 11px;font-size:12px}
  .sum{gap:11px}
  .sum b{font-size:15px}
  .card{padding:9px 11px}
  .card .acts button{padding:0 8px}
  .slot{grid-template-columns:30px 1fr;gap:6px}
  .slot .v{grid-column:1/-1;padding-left:36px}
}
</style>
</head>
<body>
<div id="app">
  <header class="hdr" id="hdr">
    <div class="hdr-top">
      <button class="iconbtn" id="tgSideM" aria-label="문서" title="문서 열기">☰</button>
      <div class="brand"><b>luvheil</b><span id="sub"></span></div>
      <nav class="nav">
        <button data-g="img" class="active" title="에셋"><span class="txt">에셋</span><span class="ico">🎨</span></button>
        <button data-g="bot" title="캐릭터"><span class="txt">캐릭터</span><span class="ico">👤</span></button>
      </nav>
      <div class="hdr-actions">
        <button class="ctl" id="tgCartM" title="담은 태그 열기/닫기" hidden>◨</button>
        <button class="ctl i" id="reload" title="저장소 다시 읽기 (터미널에서 만든 파일 반영)">⟳</button>
      </div>
    </div>
    <div class="hdr-tools" id="tools">
      <div class="hdr-row">
        <div class="segwrap"><div class="seg" id="subs"></div></div>
        <span class="count" id="cnt"></span>
      </div>
    </div>
  </header>
  <nav id="side"></nav>
  <div class="rz" id="rzL" title="드래그로 너비 조절 · 더블클릭으로 접기"></div>
  <main id="main"></main>
  <!-- 문서는 작업 화면이 아니라 읽는 화면이다. 겹쳐 띄우고 닫으면 하던 자리로 돌아온다. -->
  <section id="docpage" hidden>
    <div class="docbar">
      <span class="badge" id="docgrade"></span>
      <strong id="docname"></strong>
      <span class="sp" style="flex:1"></span>
      <button class="btn i" id="docCopy" title="본문 복사">⧉</button>
      <button class="iconbtn x" id="docClose" aria-label="닫기" title="닫기 · Esc">✕</button>
    </div>
    <div class="docbody"><div class="md" id="docmd"></div></div>
  </section>
  <div class="rz" id="rzR" title="드래그로 너비 조절 · 더블클릭으로 접기"></div>
  <aside id="cart">
    <div class="head">
      <strong><span class="ttl-lg">담은 태그</span><span class="ttl-md">태그</span><span class="ttl-sm">태</span></strong>
      <span class="muted" id="cn">0</span>
      <span style="flex:1"></span>
      <button class="btn i danger" id="clear" title="담은 태그 비우기">✕</button>
    </div>
    <div class="list" id="clist"></div>
  </aside>
</div>
<div id="scrim"></div>
<div id="toast"></div>

<script>
/* ─────────────────────────────────────────────
   luvheilassistant 작업 뷰어
   - 저장소 파일을 런타임에 읽는다. 데이터를 박아넣지 않는다.
   - 디렉터리 목록으로 파일을 자동 발견하므로 파일을 추가해도 코드를 고칠 필요 없다.
   ───────────────────────────────────────────── */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SKIP = /^(\.|dcgall\/|viewer\/|node_modules)/;
/* 뷰어가 viewer/ 안에 있으므로 저장소 루트를 기준으로 잡는다. */
const ROOT = location.pathname.replace(/viewer\/[^/]*$/, '');

/* 초안이 사는 곳 — 만들어진 그룹을 따라 갈라 둔다.
   읽기 목록에는 넣지 않는다. 이미지·챗봇 그룹의 '작업중' 탭에서 다룬다. */
const DRAFT_DIR = { img:'99_작업중/이미지/', bot:'99_작업중/챗봇/' };
/* 저장소를 굴리기 위한 문서 — 읽을거리가 아니라 정비용이라 기본으로 숨긴다 */
const CHORE = /(^|\/)(README\.md|CLAUDE\.md|문서구분표\.md)$/;
/* 01_자료 는 사전 탭이 훨씬 잘 보여준다. 목록에서 CSV 를 열 이유가 없다. */
const HIDDEN_DIR = /^01_자료\//;
const isDraft = f => f.startsWith('99_작업중/');
const isChore = f => CHORE.test(f);
/* 화면에는 확장자를 내보내지 않는다 — 무슨 파일인지는 위치와 점 색으로 안다.
   터미널에 넘길 '경로' 복사만 진짜 경로를 그대로 쓴다. */
const pretty = p => String(p).replace(/\.(md|csv)$/i,'');

/* 목록에 보여줄 이름 ─────────────────────────────────
   파일명은 정렬 때문에 번호와 원래 글 제목을 그대로 달고 있다.
   목록에서는 그게 다 군더더기라 '무엇에 대한 글인지'만 남긴다.
   파일을 옮기거나 이름을 바꿔도 여기만 고치면 된다 — 실제 경로는 건드리지 않는다. */
const DOCNAME = {
  '00_가이드/이미지/01_작가태그조합'                  : '작가태그',
  '00_가이드/이미지/02-1_퀄리티올리기_스타일프롬프트'   : '스타일프롬',
  '00_가이드/이미지/02-2_퀄리티올리기_퀄리티·부정프롬프트': '퀄리티/부정프롬',
  '00_가이드/이미지/03_원하는컨셉으로프롬프트만들기'    : '심화',
  '00_가이드/이미지/04_NAI팁_설정과문법'              : '설정과 문법',
  '00_가이드/이미지/05_NAI팁_프롬프팅과기능'           : '프롬프팅과 기능',
  '00_가이드/챗봇/01_기초다지기와도구선택'             : '기초·도구',
  '00_가이드/챗봇/02_프롬프트짜기'                    : '프롬프트 짜기',
  '00_가이드/챗봇/04_하네스엔지니어링_기초다지기'       : '하네스',
  '00_가이드/챗봇/05_문체지침_앵커작품_50선'           : '문체지침 50선',
  '00_가이드/챗봇/03_컨텍스트엔지니어링_요약_Anthropic' : '컨텍스트 엔지니어링',
};
/* 폴더 이름도 상단 탭과 맞춘다 — 실제 폴더명은 그대로 둔다 */
const FOLDER = { '챗봇':'캐릭터', '이미지':'에셋' };
/* 파일 이름만. 앞의 폴더는 사이드바가 제목으로 따로 보여준다 —
   여기에 폴더를 붙이면 '퀄리티/부정프롬' 의 / 가 경로처럼 읽혀 헷갈린다. */
function docName(f){
  const p = pretty(f);
  return DOCNAME[p] || p.split('/').pop()
      .replace(/^\d+(?:[-.]\d+)*[_-]/,'')   /* 앞의 정렬용 번호 */
      .replace(/_/g,' ');
}

/* ── 저장소 훑기 ────────────────────────────── */
async function listDir(path){
  const r = await fetch(path);
  if(!r.ok) throw new Error(path+' '+r.status);
  const html = await r.text();
  const out = [];
  for(const m of html.matchAll(/href="([^"]+)"/g)){
    let h = decodeURIComponent(m[1]);
    if(h.startsWith('/')||h.startsWith('?')||h.startsWith('..')||h==='./') continue;
    out.push(path + h);
  }
  return out;
}
async function walk(path, depth=0){
  if(depth > 4) return [];
  let items;
  try{ items = await listDir(path); }catch{ return []; }
  const files = [];
  for(const it of items){
    const rel = it.slice(ROOT.length);
    if(SKIP.test(rel.replace(/^\//,''))) continue;
    if(it.endsWith('/')) files.push(...await walk(it, depth+1));
    else if(/\.(md|csv)$/i.test(it)) files.push(rel);
  }
  return files;
}

/* ── CSV ────────────────────────────────────── */
function parseCSV(text){
  const rows=[]; let row=[], cell='', q=false;
  text = text.replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(cell); cell=''; }
    else if(c==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell+=c;
  }
  if(cell||row.length){ row.push(cell); rows.push(row); }
  const hdr = rows.shift().map(h=>h.trim());
  return rows.filter(r=>r.some(c=>c.trim()))
             .map(r=>Object.fromEntries(hdr.map((h,i)=>[h,(r[i]??'').trim()])));
}

/* ── 아주 작은 마크다운 렌더러 ─────────────────
   CDN 의존 없이 저장소 문서를 렌더한다.
   원문 글(포스타입 전재)이 쓰는 표기까지 받아내야 해서 링크·이미지는 직접 훑는다:
     · `![](url)`            대체 텍스트가 빈 이미지
     · `[[Nai] 제목](url)`   링크 글자 안에 대괄호가 또 있는 경우
     · `[` … `](url)`        여러 줄에 걸친 링크 (포스타입 링크 카드)
     · 맨 URL                자동 링크
   정규식 하나로는 이 중 앞의 둘을 못 잡아 통째로 글자로 새어 나왔다. */
const SAFE = /^(?:https?:\/\/|mailto:|#|\/|\.\/|\.\.\/)/i;
const safeURL = u => { u=String(u||'').trim(); return SAFE.test(u) ? u : ''; };
const hostOf = u => { try{ return new URL(u, location.href).host.replace(/^www\./,''); }catch{ return ''; } };
/* 링크 글자 안에서는 강조까지만 본다 — 링크 안의 링크는 만들지 않는다 */
const label = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>')
                         .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');

function anchor(url, text){
  const u = safeURL(url), t = String(text||'').trim();
  if(!u) return label(t || url);
  return `<a href="${esc(u)}" target="_blank" rel="noopener">${t ? label(t) : esc(url)}</a>`;
}
function imgTag(url, alt){
  const u = safeURL(url);
  if(!u) return label(alt||'');
  const a = String(alt||'').trim();
  /* 원문 글의 그림은 남의 CDN 에 있고 그쪽이 핫링크를 막는다 (포스타입 CDN 은 403).
     브라우저는 <img> 에 가짜 Referer 를 실을 수 없으니 세 단계로 내려간다.
       ① viewer/img/ 에 보존해 둔 사본 — 어디서나 되고 원본이 죽어도 남는다
       ② 서버의 /_img 통로   — 아직 보존 안 한 그림 (archive-images.mjs 를 안 돌린 것)
       ③ 원본 주소          — 정적 호스팅. 막히면 링크 자리로 바뀐다 */
  const local = S.img[url] || S.img[u];
  const src = local ? ROOT+'viewer/'+local
            : (!S.static && /^https?:\/\//i.test(u)) ? ROOT+'_img?u='+encodeURIComponent(u)
            : u;
  return `<figure><a class="imglink" href="${esc(u)}" target="_blank" rel="noopener">`
       + `<img src="${esc(src)}" alt="${esc(a)}" loading="lazy" decoding="async" onerror="imgFail(this)"></a>`
       + (a?`<figcaption>${esc(a)}</figcaption>`:'') + `</figure>`;
}
/* 못 받아온 그림은 깨진 아이콘 대신 원본으로 가는 자리를 남긴다 */
function imgFail(el){
  const a = el.closest('a'); el.remove();
  if(a && !a.querySelector('.imgdead')){
    a.classList.add('dead');
    a.insertAdjacentHTML('beforeend','<span class="imgdead">🖼 그림을 불러오지 못했습니다 — 원본 열기</span>');
  }
}

/* `[텍스트](주소)` · `![대체](주소)` 를 대괄호·괄호 짝을 세며 찾는다.
   짝이 맞지 않으면 링크로 치지 않고 글자 그대로 흘려보낸다. */
function linkify(src, keep){
  let out='', i=0;
  while(i < src.length){
    const c = src[i];
    const img = c==='!' && src[i+1]==='[';
    if(c!=='[' && !img){ out+=c; i++; continue; }
    const start = img ? i+1 : i;
    let d=0, j=start;
    for(; j<src.length; j++){
      if(src[j]==='[') d++;
      else if(src[j]===']'){ d--; if(!d) break; }
    }
    if(d!==0 || src[j+1]!=='('){ out+=c; i++; continue; }
    const text = src.slice(start+1, j);
    let k=j+2, p=1, url='';
    for(; k<src.length; k++){
      const ch=src[k];
      if(ch==='(') p++;
      else if(ch===')'){ p--; if(!p) break; }
      url += ch;
    }
    if(p!==0){ out+=c; i++; continue; }
    out += keep(img ? imgTag(url, text) : anchor(url, text));
    i = k+1;
  }
  return out;
}

function inline(s){
  /* 완성된 HTML 조각은 자리표시자로 빼 둔다 — 뒤 단계가 다시 건드리지 않도록 */
  const slot=[]; const keep = h => { slot.push(h); return '\u0000'+(slot.length-1)+'\u0000'; };
  let t = String(s);
  t = t.replace(/`([^`]+)`/g, (_,c)=> keep('<code>'+esc(c)+'</code>'));   /* 코드 먼저 */
  /* `\#` 처럼 백슬래시로 막아둔 기호 — 코드 안에서는 escape 가 아니므로 코드 다음에 본다 */
  t = t.replace(/\\([\\`*_{}\[\]()#+\-.!~>])/g, (_,c)=> keep(esc(c)));
  t = linkify(t, keep);                                                   /* 이미지·링크 */
  t = esc(t);                                                             /* 남은 글자만 */
  t = t.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
       .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>')
       .replace(/~~([^~\n]+)~~/g,'<del>$1</del>');
  /* 마크다운 표기 없이 그냥 적힌 주소도 눌리게 한다 */
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<>()]+[^\s<>().,;:!?])/g,
        (m,pre,u)=> pre + keep(`<a href="${u}" target="_blank" rel="noopener">${u}</a>`));
  return t.replace(/\u0000(\d+)\u0000/g, (_,n)=> slot[+n]);
}

function renderMD(src){
  const L = src.split('\n'), out=[]; let i=0;
  const flushList = (tag, items)=> out.push(`<${tag}>`+items.map(x=>`<li>${inline(x)}</li>`).join('')+`</${tag}>`);
  while(i<L.length){
    const l = L[i];
    if(/^```/.test(l)){
      const buf=[]; i++;
      while(i<L.length && !/^```/.test(L[i])) buf.push(L[i++]);
      i++; out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>'); continue;
    }
    /* 여러 줄에 걸친 링크 — `[` 만 있는 줄로 열고 `](주소)` 로 닫는다.
       포스타입이 두 가지로 쓴다:
         · 안이 그림뿐   → 그림에 원본 링크를 건 것. 그림으로 낸다
         · 안이 글       → 링크 카드. 제목 + 부연으로 낸다 */
    if(l.trim()==='['){
      let j=i+1; const inner=[];
      while(j<L.length && !/^\]\(/.test(L[j].trim()) && j-i < 16) inner.push(L[j++]);
      /* 닫는 줄이 `](주소)[` 처럼 다음 블록과 붙어 나오기도 한다 — 그 `[` 는 되돌려 준다 */
      const m = (L[j]||'').trim().match(/^\]\((.*)\)\s*(\[)?\s*$/);
      if(m){
        const u = safeURL(m[1]);
        const rows = inner.map(x=>x.trim()).filter(Boolean);
        const pics = rows.filter(r=>/^!\[[^\]]*\]\(/.test(r));
        const txt  = rows.filter(r=>!/^!\[[^\]]*\]\(/.test(r)).map(x=>x.replace(/^#{1,6}\s+/,''));
        if(pics.length) out.push(pics.map(r=>inline(r)).join(''));
        if(txt.length || !pics.length){
          const ttl = txt.shift() || hostOf(m[1]) || m[1];
          out.push(`<a class="linkcard" href="${esc(u||'#')}" ${u?'target="_blank" rel="noopener"':''}>`
            + `<b>${label(ttl)}</b>`
            + (txt.length?`<span>${label(txt.join(' · '))}</span>`:'')
            + `<em>${esc(hostOf(m[1])||m[1])}</em></a>`);
        }
        if(m[2]){ L[j]='['; i = j; } else i = j+1;
        continue;
      }
    }
    if(/^\s*\|/.test(l) && /^\s*\|[\s:|-]+\|\s*$/.test(L[i+1]||'')){
      const cells = r => r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const head = cells(l); i+=2; const body=[];
      while(i<L.length && /^\s*\|/.test(L[i])) body.push(cells(L[i++]));
      out.push('<table><thead><tr>'+head.map(h=>`<th>${inline(h)}</th>`).join('')+'</tr></thead><tbody>'
        +body.map(r=>'<tr>'+r.map(c=>`<td>${inline(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table>');
      continue;
    }
    let m;
    /* 포스타입 글은 ##### 를 본문 소제목으로 쓴다 (71회로 제일 많다) — 6단계까지 받는다 */
    if(m=l.match(/^(#{1,6})\s+(.*)$/)){ out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); i++; continue; }
    if(/^\s*(---|===)\s*$/.test(l)){ out.push('<hr>'); i++; continue; }
    if(/^>\s?/.test(l)){
      const buf=[]; while(i<L.length && /^>\s?/.test(L[i])) buf.push(L[i++].replace(/^>\s?/,''));
      out.push('<blockquote>'+renderMD(buf.join('\n'))+'</blockquote>'); continue;
    }
    if(/^\s*[-*]\s+/.test(l)){
      const buf=[]; while(i<L.length && /^\s*[-*]\s+/.test(L[i])) buf.push(L[i++].replace(/^\s*[-*]\s+/,''));
      flushList('ul',buf); continue;
    }
    if(/^\s*\d+\.\s+/.test(l)){
      const buf=[]; while(i<L.length && /^\s*\d+\.\s+/.test(L[i])) buf.push(L[i++].replace(/^\s*\d+\.\s+/,''));
      flushList('ol',buf); continue;
    }
    if(l.trim()===''){ i++; continue; }
    /* 이미지만 있는 줄은 문단으로 묶지 않는다 — figure 가 <p> 안에 들어가면 안 된다 */
    if(/^!\[[^\]]*\]\(/.test(l.trim())){ out.push(inline(l.trim())); i++; continue; }
    const buf=[];
    while(i<L.length && L[i].trim()
          && !/^(#{1,6}\s|>|\s*[-*]\s|\s*\d+\.\s|```|\s*\|)/.test(L[i])
          && !/^!\[[^\]]*\]\(/.test(L[i].trim())
          && L[i].trim()!=='[') buf.push(L[i++]);
    if(!buf.length){ out.push(inline(L[i])); i++; continue; }
    out.push('<p>'+inline(buf.join(' '))+'</p>');
  }
  return out.join('\n');
}

/* ── 로드 ───────────────────────────────────── */
const norm = t => t.replace(/_/g,' ').trim().toLowerCase();
async function boot(){
  /* GitHub Pages 처럼 디렉터리 목록을 주지 않는 곳에서는 manifest.json 을 쓴다.
     로컬에서 파일을 추가했는데 목록에 없다면 node viewer/build-manifest.mjs 로 다시 만든다. */
  try{
    const r = await fetch(ROOT+'viewer/manifest.json', {cache:'no-store'});
    if(r.ok){ const j = await r.json(); S.files = j.files; S.samples = j.samples||[]; }
  }catch{}
  /* 저장소에 보존해 둔 그림 지도 — 원본 주소 → viewer/img/<파일>.
     node viewer/archive-images.mjs 가 만든다. 없으면 그냥 프록시로 내려간다. */
  try{
    const r = await fetch(ROOT+'viewer/images.json', {cache:'no-store'});
    if(r.ok) S.img = await r.json();
  }catch{}
  /* 쓰기가 되는지는 서버에 직접 묻는다.
     예전에는 manifest.json 이 있으면 정적으로 쳤는데, manifest 는 로컬에도 있어서
     serve.mjs 로 띄워도 저장 버튼이 사라졌다. */
  try{
    const r = await fetch(ROOT+'_ping', {cache:'no-store'});
    S.static = !r.ok;
    if(r.ok) S.asset = !!(await r.json()).asset;
  }catch{ S.static = true; }
  /* 견본은 확장자가 달라 walk() 가 안 줍는다. 서버에서는 폴더를 직접 훑는다. */
  if(!S.static && !(S.samples||[]).length){
    try{
      const list = await listDir(ROOT+SAMPLE_DIR+'/');
      S.samples = list.map(x=>decodeURIComponent(x.split('/').pop()))
                      .filter(n=>/\.(webp|png|jpe?g|gif|avif)$/i.test(n));
    }catch{ S.samples=[]; }
  }
  if(!S.files.length){ try{ S.files = await walk(ROOT); }catch{} }
  if(!S.files.length){
    $('#main').innerHTML='<p class="res no">파일 목록을 읽지 못했습니다.<br>'
      +'로컬이면 저장소 루트에서 <code>node viewer/serve.mjs</code> 로 열고,<br>'
      +'정적 호스팅이면 <code>node viewer/build-manifest.mjs</code> 로 목록을 만들어 커밋하세요.</p>';
    return;
  }

  const get = async p => (await fetch(ROOT + p)).text();
  const find = re => S.files.find(f=>re.test(f));

  await Promise.all(S.files.filter(f=>f.endsWith('.md')).map(async f=>{ S.md[f]=await get(f); }));

  const d=find(/1-태그사전\.csv$/), st=find(/1-스타일태그\.csv$/), ar=find(/1-작가태그\.csv$/);
  if(d)  S.dict   = parseCSV(await get(d));
  if(st) S.style  = parseCSV(await get(st));
  if(ar) S.artist = parseCSV(await get(ar));
  for(const f of S.files.filter(f=>/참고링크\.csv$/.test(f)))
    S.links.push(...parseCSV(await get(f)).map(r=>({...r, _file:f})));

  for(const r of S.dict) for(const t of (r['태그']||'').split(',')) if(t.trim()) S.tagset.add(norm(t));
  for(const r of S.style) if(r['태그']) S.tagset.add(norm(r['태그']));
  for(const r of S.artist) if(r['태그']) S.tagset.add(norm(r['태그']));

  loadPresets();
  /* 프리셋에 쓰인 어휘도 '아는 태그'로 친다.
     태그사전은 2022년 danbooru 기준이라 8k · dramatic contrast 같은
     퀄리티·조명 어휘가 아예 없다. 그것까지 미상으로 잡으면 오탐만 쌓인다. */
  for(const kind of ['Q','N'])
    for(const body of Object.values(S.presets[kind]))
      for(const t of body.replace(/-?[\d.]+::/g,'').replace(/::/g,'').split(','))
        if(t.trim()) S.preset_vocab.add(norm(t));

  buildTags();
  const readable = S.files.filter(f=>!isDraft(f) && !isChore(f));
  /* 개수는 헤더에 두지 않는다 — 매번 읽을 정보가 아니다.
     저장이 안 되는 상태일 때만 그 사실을 알린다. */
  $('#sub').textContent = S.static ? '정적 모드 — 저장할 수 없어요' : '';
  loadCart(); drawSide(); setGroup('img');   /* 문서는 ☰ 로 연다 */
}

/* 퀄리티·부정 프리셋을 정본 파일에서 읽는다. 고친 뒤에도 다시 부른다. */
function loadPresets(){
  S.presets={Q:{},N:{}}; S.presetTitle={};
  for(const f of S.files.filter(f=>/스타일프리셋\/.*\.md$/.test(f))){
    const src=S.md[f]||'', kind=/부정/.test(f)?'N':'Q';
    for(const m of src.matchAll(/^## ([QN]\d+)([^\n]*)\n(?:[\s\S]*?)```\n([\s\S]*?)```/gm)){
      S.presets[kind][m[1]] = m[3].trim();
      S.presetTitle[m[1]] = (m[2]||'').replace(/^\s*[—-]\s*/,'').replace(/★/g,'').trim();
    }
  }
}

/* ── 사이드바 ───────────────────────────────────
   초안(99_작업중)은 여기 넣지 않는다. 만들어진 그룹의 '작업중' 탭에서 다룬다.
   README·CLAUDE·문서구분표는 저장소를 굴리기 위한 문서라 기본으로 접어둔다. */
const foldKey='char.fold';
let FOLD = (()=>{ try{ return new Set(JSON.parse(localStorage.getItem(foldKey))||[]); }catch{ return new Set(); } })();

function drawSide(){
  const files = readList();
  /* 하위 폴더까지 그룹으로 올린다. 그래야 파일 줄에 '이미지/' 같은 접두어가 안 붙고
     이름만 남는다 — 목록을 훑을 때 읽어야 할 글자가 절반이 된다. */
  const groups={};
  for(const f of files){ const g=f.includes('/')?f.slice(0,f.lastIndexOf('/')):'· 루트'; (groups[g] ||= []).push(f); }
  $('#side').innerHTML = Object.keys(groups).sort().map(g=>{
    const fold=FOLD.has(g);
    return `<div class="grp${fold?' fold':''}" data-g="${esc(g)}">
        <span class="ar">▼</span>${esc(dirName(g))}<span class="n">${groups[g].length}</span></div>`
      + (fold?'':groups[g].map(f=>{
          const grade = f.endsWith('.csv') ? 'csv' : (gradeOf(S.md[f]||'')||'작업');
          const name = docName(f);
          return `<div class="f${S.cur===f?' on':''}" data-f="${esc(f)}" title="${esc(pretty(f))}">
            <i class="dot ${grade}"></i><span>${esc(name)}</span></div>`;
        }).join(''));
  }).join('')
  + `<div class="sidefoot"><label><input type="checkbox" id="chore"${S.chore?' checked':''}>
       정비 문서도 보기 <span class="muted">(README · CLAUDE · 문서구분표)</span></label></div>`;
  $('#side').onclick = e => {
    if(e.target.id==='chore'){
      S.chore = e.target.checked;
      localStorage.setItem('char.chore', S.chore?'1':'0');
      drawSide(); return;
    }
    const g=e.target.closest('.grp');
    if(g){ const k=g.dataset.g; FOLD.has(k)?FOLD.delete(k):FOLD.add(k); foldSave(); drawSide(); return; }
    const el=e.target.closest('.f');
    if(el){ show(el.dataset.f); closeDrawers(); }
  };
}

/* ── 읽기 ───────────────────────────────────── */
/* ── 문서 보기 ───────────────────────────────
   문서는 작업 화면이 아니라 읽는 화면이다. 탭을 차지하지 않고 겹쳐 띄운다 —
   닫으면 하던 자리(에셋·캐릭터)로 그대로 돌아온다. */
function show(f){
  if(!f) return;
  S.cur=f; drawSide();
  if(f.endsWith('.csv')){
    if(/참고링크/.test(f)) return showDoc(f, drawLinksHTML(f), '참고링크');
    /* 사전 CSV 는 사전 탭이 훨씬 잘 보여준다 */
    subSet('dict', /스타일태그/.test(f) ? 'style' : /작가태그/.test(f) ? 'artist' : 'plain');
    closeDoc(); setGroup('img'); return;
  }
  const src=S.md[f]||'', g=gradeOf(src);
  const bodyMD = src.replace(/^> `\[[^\]]+\][\s\S]*?\n/,'');   /* 배너 줄 제외 */
  S.body = bodyMD;
  showDoc(f, renderMD(bodyMD), g);
}
function showDoc(f, html, grade){
  $('#docgrade').textContent = grade||'';
  $('#docgrade').className = 'badge '+(grade||'');
  $('#docgrade').style.display = grade ? '' : 'none';
  $('#docname').textContent = docName(f);
  $('#docmd').innerHTML = html;
  $('#docpage').hidden = false;
  document.body.classList.add('reading');
  /* 코드블록마다 복사 버튼 — 템플릿·프리셋은 이 안이 실제 쓸 내용이다 */
  $('#docmd').querySelectorAll('pre').forEach((pre,i)=>{
    const b=document.createElement('button');
    b.className='cp'; b.textContent='복사';
    b.onclick=()=>copy(pre.querySelector('code').textContent,`코드블록 ${i+1}`);
    pre.appendChild(b);
  });
  $('#docpage').querySelector('.docbody').scrollTop=0;
}
function closeDoc(){ $('#docpage').hidden = true; document.body.classList.remove('reading'); }

/* ── 태그 ───────────────────────────────────
   태그사전·스타일태그·작가태그를 한 표로 합친다. 셋은 파일이 다를 뿐 쓰는 자리는 같다.
   맨 위 갈래는 '어느 파일에서 왔나' 가 아니라 **지금 무엇을 짜고 있나** 로 잡는다 —
   시트 이름은 내용과 어긋나기도 한다 (`태그동작2` 안은 전부 옷을 다루는 동작이다). */
const PURPOSE = [
  ['scene',  '장면·구도', '배경 · 장소 · 연출 · 초점 · 품질'],
  ['who',    '캐릭터',    '인원 · 인종 · 종족 · 직업 · 특징'],
  ['look',   '외형',      '얼굴 · 머리 · 피부 · 체형'],
  ['wear',   '의상',      '상의 · 하의 · 속옷 · 신발 · 장신구'],
  ['act',    '동작·표정', '신체 동작 · 옷을 다루는 동작 · 동사'],
  ['artist', '작가',      '그림체를 정하는 작가 태그'],
  ['style',  '스타일',    '매체 · 아트스타일 · 색상 · 특수효과'],
  ['cast',   '등장·원작', '관계 · 원작 · 등장 캐릭터'],
  ['adult',  '성인',      'NSFW'],
];
const PNAME = Object.fromEntries(PURPOSE.map(([k,n])=>[k,n]));
const SHEET2P = {
  '태그기본':'scene', '태그인물':'who', '태그외모':'look', '태그체형':'look',
  '태그의상':'wear',  '태그장신구':'wear',
  '태그동작1':'act',  '태그동작2':'act', '태그행동':'act',
  '태그작품':'cast',  '태그섹스':'adult',
};
/* 시트만으로는 안 갈리는 것.
   `태그인물 / 인물` 은 전부 관계 태그(father_and_daughter · aunt_and_nephew)다 —
   그 캐릭터의 외형이 아니라 '이 그림에 누가 같이 나오는가' 라서 장면 쪽이다. */
const P_OVERRIDE = { '태그인물|인물':'cast' };

/* 세 CSV 를 한 모양으로 눕힌다.
   ko 는 '이 태그가 한국어로 무엇인가' — 사전은 한글명, 스타일태그는 설명이 그 자리다. */
function buildTags(){
  const T=[];
  /* src 에 원본 행을 그대로 물려 둔다 — 화면에서 고친 값을 CSV 로 되쓰려면 필요하다 */
  for(const r of S.dict) T.push({
    p: P_OVERRIDE[r['시트']+'|'+r['분류1']] || SHEET2P[r['시트']] || 'scene',
    g: r['분류1']||'', s: r['분류2']||'',
    ko: r['한글명']||'', tags: (r['태그']||'').split(',').map(t=>t.trim()).filter(Boolean),
    nsfw: r['NSFW']==='TRUE', note: r['비고']||'', src: r, from:'태그사전' });
  for(const r of S.style) T.push({
    p:'style', g: r['분류']||'', s: r['세부']||'',
    ko: r['설명']||'', tags: [r['태그']].filter(Boolean),
    nsfw:false, note: r['비고']||'', src: r, from:'스타일태그' });
  for(const r of S.artist) T.push({
    /* CSV 값에 이미 `artist:` 가 붙어 있고, '기타_artist 태그 X' 섹션은 붙이면 안 되는 것들이다.
       예전에는 여기서 한 번 더 붙여 `artist:artist: …` 를 만들고 있었다. 값을 그대로 쓴다. */
    p:'artist', g: /X$/.test(r['섹션']||'') ? 'artist 안 붙임' : '작가태그', s:'',
    ko:'', tags: [r['태그']].filter(Boolean), nsfw:false,
    note: r['네거티브_추천']==='Y' ? '네거티브 추천' : '', src: r, from:'작가태그' });
  S.tags = T;
}



/* ── 표 열 너비 ──────────────────────────────
   사전은 사람마다 넓게 보고 싶은 칸이 다르다. 머리글 경계선을 끌어 조절하고,
   조절한 값은 표마다 기억한다. */
function gridWidths(key){ try{ return JSON.parse(localStorage.getItem('char.col.'+key))||{}; }catch{ return {}; } }
function gridHidden(key){ try{ return JSON.parse(localStorage.getItem('char.hide.'+key))||[]; }catch{ return []; } }
const setHidden = (key,set) => localStorage.setItem('char.hide.'+key, JSON.stringify([...set]));
/* 숨긴 열은 머리글과 모든 줄에서 함께 지운다. 표를 다시 그려도 남는다. */
function applyHidden(table, key){
  const hide = new Set(gridHidden(key));
  for(const row of table.rows)
    [...row.cells].forEach((c,i)=>{ c.style.display = hide.has(i) ? 'none' : ''; });
}
const colLabel = (labels,i) => labels[i] || '작업';

/* 열 목록 — ▥ 버튼과 머리글 팝오버가 같은 내용을 쓴다.
   clicked 가 있으면 그 열을 바로 숨기는 항목을 맨 위에 얹는다. */
function colListHTML(key, labels, clicked){
  const h = new Set(gridHidden(key));
  return (clicked!=null && !h.has(clicked)
      ? `<button class="colitem" data-a="one">「${esc(colLabel(labels,clicked))}」 숨기기</button><i class="sep"></i>` : '')
    + labels.map((t,i)=>`<label><input type="checkbox" data-i="${i}"${h.has(i)?'':' checked'}>${esc(colLabel(labels,i))}</label>`).join('')
    + `<i class="sep"></i><button class="colitem" data-a="all">전부 보기</button>`;
}
/* 목록에서 일어난 일을 한 곳에서 처리한다 — 마지막 한 열은 남긴다 */
function colAct(e, table, key, labels, clicked, close){
  const h = new Set(gridHidden(key));
  const cb = e.target.closest('input[type=checkbox]');
  const a  = e.target.closest('[data-a]')?.dataset.a;
  if(cb){ cb.checked ? h.delete(+cb.dataset.i) : h.add(+cb.dataset.i); }
  else if(a==='one'){ h.add(clicked); }
  else if(a==='all'){ h.clear(); }
  else return;
  if(h.size >= labels.length){ toast('열을 전부 숨길 수는 없습니다', true); return; }
  setHidden(key, h); applyHidden(table, key); syncColMenus(key, labels);
  if(a) close && close();
}
/* 열려 있는 두 곳(버튼 메뉴·팝오버)의 체크 상태를 맞춘다 */
function syncColMenus(key, labels){
  const h = new Set(gridHidden(key));
  document.querySelectorAll(`#colmenu-${key} input[data-i], .colpop input[data-i]`)
    .forEach(cb=>{ cb.checked = !h.has(+cb.dataset.i); });
  const sum = document.querySelector(`#colmenu-${key} > summary`);
  if(sum) sum.title = `볼 열 고르기 (${labels.length-h.size}/${labels.length}) · 머리글 우클릭`;
}

/* ── 머리글 팝오버 ─ 우클릭 · 길게 누르기 ────── */
let colpop = null;
function closeColPop(){ if(colpop){ colpop.remove(); colpop = null; } }
addEventListener('mousedown', e => { if(colpop && !colpop.contains(e.target)) closeColPop(); }, true);
addEventListener('keydown',   e => { if(e.key==='Escape') closeColPop(); });
addEventListener('scroll',    closeColPop, true);
function openColPop(x, y, table, key, labels, i){
  closeColPop();
  colpop = document.createElement('div');
  colpop.className = 'colpop';
  colpop.innerHTML = colListHTML(key, labels, i);
  document.body.appendChild(colpop);
  const r = colpop.getBoundingClientRect();
  colpop.style.left = Math.max(6, Math.min(x, innerWidth  - r.width  - 8)) + 'px';
  colpop.style.top  = Math.max(6, Math.min(y, innerHeight - r.height - 8)) + 'px';
  colpop.onclick = e => colAct(e, table, key, labels, i, closeColPop);
}

/* ▥ 버튼. 표를 다시 그릴 때마다 같은 자리에 새로 단다. */
function mountColMenu(bar, table, key, labels){
  const id = 'colmenu-'+key;
  const old = document.getElementById(id); if(old) old.remove();
  const el = document.createElement('details');
  el.className = 'colmenu'; el.id = id;
  el.innerHTML = `<summary class="iconsum">▥</summary>
    <div class="colmenu-body">${colListHTML(key, labels, null)}</div>`;
  el.onclick = e => { if(!e.target.closest('summary')) colAct(e, table, key, labels, null, null); };
  bar.appendChild(el);
  syncColMenus(key, labels);
}

function wireGrid(host, key, barSel){
  const table = host.querySelector('table.grid'); if(!table) return;
  const ths = [...table.tHead.rows[0].cells];
  const saved = gridWidths(key);
  ths.forEach((th,i)=>{ if(saved[i]) th.style.width = saved[i]+'px'; });
  applyHidden(table, key);
  const labels = ths.map(th=>th.textContent.trim());
  if(barSel && $(barSel)) mountColMenu($(barSel), table, key, labels);

  ths.forEach((th,i)=>{
    /* 머리글에서 바로 고른다 — 메뉴를 찾아 들어가는 것보다 '이 열' 을 가리키는 게 빠르다.
       다만 누르자마자 숨기지는 않는다. 무엇을 숨길지는 팝오버에서 고른다. */
    th.oncontextmenu = e => { e.preventDefault(); openColPop(e.clientX, e.clientY, table, key, labels, i); };
    let timer = null, pt = null;
    th.ontouchstart = e => {
      pt = e.touches[0];
      timer = setTimeout(()=>{ timer=null; openColPop(pt.clientX, pt.clientY, table, key, labels, i); }, 500);
    };
    const cancel = () => { if(timer){ clearTimeout(timer); timer=null; } };
    th.ontouchend = th.ontouchmove = th.ontouchcancel = cancel;
  });

  ths.forEach((th,i)=>{
    if(i===ths.length-1) return;                 /* 마지막 칸은 남는 폭을 먹는다 */
    const g=document.createElement('span'); g.className='cgrip'; th.appendChild(g);
    g.onmousedown = e => {
      e.preventDefault(); e.stopPropagation();
      g.classList.add('drag'); document.body.classList.add('resizing');
      const x0=e.clientX, w0=th.getBoundingClientRect().width;
      const move = ev => { th.style.width = Math.max(46, Math.round(w0+ev.clientX-x0))+'px'; };
      const up = () => {
        g.classList.remove('drag'); document.body.classList.remove('resizing');
        const o=gridWidths(key); o[i]=parseInt(th.style.width,10);
        localStorage.setItem('char.col.'+key, JSON.stringify(o));
        removeEventListener('mousemove',move); removeEventListener('mouseup',up);
      };
      addEventListener('mousemove',move); addEventListener('mouseup',up);
    };
    g.ondblclick = e => {                        /* 더블클릭이면 그 칸만 초기화 */
      e.stopPropagation(); th.style.width='';
      const o=gridWidths(key); delete o[i];
      localStorage.setItem('char.col.'+key, JSON.stringify(o));
    };
  });
}

/* head 항목은 '이름' 또는 '이름|클래스' — 클래스가 붙으면 좁을 때 접힌다 */
function tbl(head,body,grid){
  const th=head.map(h=>{ const [t,c]=String(h).split('|');
    return `<th${c?` class="${c}"`:''}>${t}</th>`; }).join('');
  return `<table class="${grid?'grid':''}"><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table>`;
}
/* 담는 자리(태그 탭)와 바로 넣는 자리(파츠 피커)가 다르다 — 후자는 상위에서 클릭을 받는다 */

/* ── 참고링크 ────────────────────────────────
   태그가 아니라 '아직 안 옮긴 바깥 자료' 다. 사전에 섞지 않고 문서로 띄운다. */
function drawLinksHTML(f){
  /* 누른 파일의 것만 보여준다. 에셋과 캐릭터는 참고링크 파일이 따로 있는데
     예전에는 둘을 합쳐 놓아, 에셋 링크 아래에 캐릭터 쪽 Gem 이 딸려 나왔다. */
  const rows = S.links.filter(r=>r._file===f);
  const by={};
  for(const r of rows) (by[r['분류']||'기타'] ||= []).push(r);
  return Object.keys(by).sort().map(k=>`<h3>${esc(k)}</h3>`
      + tbl(['이름','용도|opt','수집|opt2'], by[k].map(x=>`<tr>
          <td><a href="${esc(x['URL'])}" target="_blank" rel="noopener">${esc(x['이름'])}</a>
            ${x['로컬 파일']?`<br><span class="muted" style="font-size:11.5px">${esc(x['로컬 파일'])}</span>`:''}</td>
          <td class="muted opt">${esc(x['용도']||'')}</td>
          <td class="muted opt2">${esc(x['자동수집']||'')}</td></tr>`).join(''))).join('')
    || '<p class="empty">이 갈래에는 남은 참고링크가 없습니다.</p>';
}


/* ── 에셋 화면 구성 ──────────────────────────
   사전에서 찾고 → 태그조합에서 파츠를 짜고 → 최종에서 합친다.

const subGet = (k,def) => localStorage.getItem('char.sub.'+k) || def;

/* ── 작가 사전 ───────────────────────────────
   140개를 글자만 보고 고를 수는 없다 — 그림체는 눈으로 고르는 것이다.
   태그마다 남캐·여캐 견본을 붙인다. */
const slugOf = t => String(t).replace(/^artist\s*:\s*/i,'').trim().toLowerCase()
  .replace(/[^a-z0-9가-힣]+/g,'-').replace(/^-+|-+$/g,'');
const SEXES = [['남', /_(남|m|male)$/i], ['여', /_(여|f|female)$/i]];
function sampleIndex(){
  const idx = {};
  for(const f of S.samples||[]){
    const base = f.replace(/\.[^.]+$/,'');
    for(const [sex, re] of SEXES)
      if(re.test(base)){ (idx[base.replace(re,'')] ||= {})[sex] = f; break; }
  }
  return idx;
}
function dictArtist(){
  const idx = sampleIndex();
  const rows = S.tags.filter(r=>r.p==='artist');
  const have = rows.filter(r=>idx[slugOf(r.tags[0])]).length;
  $('#dbody').innerHTML = `<div class="bar" id="abar">
      <input class="ctl" type="search" id="aq" placeholder="작가 태그 검색">
      <select class="ctl" id="ag"><option value="">섹션 전체</option>
        ${[...new Set(rows.map(r=>r.g))].map(g=>`<option>${esc(g)}</option>`).join('')}</select>
      <label class="muted"><input type="checkbox" id="aonly"> 견본 있는 것만</label>
      <span class="sp"></span>
      ${S.static?'':'<button class="btn i" id="padd" title="추가">＋</button>'}
    </div>
    <div id="form"></div>
    <div id="arows"></div>`;
  const run=()=>{
    const q=$('#aq').value.trim().toLowerCase(), g=$('#ag').value, only=$('#aonly').checked;
    let r=rows;
    if(g) r=r.filter(x=>x.g===g);
    if(q) r=r.filter(x=>x.tags.join(' ').toLowerCase().includes(q));
    if(only) r=r.filter(x=>idx[slugOf(x.tags[0])]);
    $('#arows').innerHTML = tbl(['태그','남캐','여캐','비고|opt meta','섹션|opt2 meta',''], r.map((x,i)=>{
      const tag=x.tags[0], sl=slugOf(tag), got=idx[sl]||{};
      const cell=sex=>`<td class="samp" data-slug="${esc(sl)}" data-sex="${sex}">`
        + (got[sex]
            ? `<img src="${esc(ROOT+SAMPLE_DIR+'/'+got[sex])}" alt="${esc(tag)} ${sex}" loading="lazy">`
            : `<span class="drop">${esc(sl)}_${sex}<br><span class="muted">여기로 끌어놓기</span></span>`)
        + `</td>`;
      return `<tr data-i="${i}"><td class="wrap">${tagCell(tag)}</td>${cell('남')}${cell('여')}
        <td class="muted opt meta">${esc(x.note)}</td>
        <td class="muted opt2 meta">${esc(x.g)}</td>
        <td class="meta">${S.static?'':'<button class="mini" data-a="edit" title="수정">✎</button>'}</td></tr>`;
    }).join(''), true);
    wireGrid($('#arows'), 'artist', '#abar');
    wireDrop(idx, run);
    $('#arows').addEventListener('click', e=>{
      if(e.target.dataset.a!=='edit') return;
      openRowForm($('#form'), 'artist', r[+e.target.closest('tr').dataset.i].src, ()=>dictArtist());
    });
  };
  ['#aq','#ag','#aonly'].forEach(x=>{const e=$(x); e.oninput=e.onchange=run;});
  if($('#padd')) $('#padd').onclick=()=>openRowForm($('#form'),'artist',null,()=>dictArtist());
  run();
}
function wireDrop(idx, redraw){
  $('#arows').querySelectorAll('td.samp').forEach(td=>{
    td.ondragover  = e => { e.preventDefault(); td.classList.add('over'); };
    td.ondragleave = () => td.classList.remove('over');
    td.ondrop = async e => {
      e.preventDefault(); td.classList.remove('over');
      const file = (e.dataTransfer.files||[])[0];
      if(!file) return;
      if(!S.asset){ toast('서버로 열어야 저장할 수 있습니다', true); return; }
      const ext  = (file.name.match(/\.[^.]+$/)||['.png'])[0].toLowerCase();
      const name = `${td.dataset.slug}_${td.dataset.sex}${ext}`;
      const data = await new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(file); });
      const res = await post('_asset', {name, data});
      if(!res.ok){ toast('저장 실패: '+await res.text(), true); return; }
      S.samples = (S.samples||[]).filter(f=>f!==name).concat(name);
      (idx[td.dataset.slug] ||= {})[td.dataset.sex] = name;
      toast(name+' 저장됨'); redraw();
    };
  });
  $('#arows').querySelectorAll('td.samp img').forEach(img=>{
    img.onclick = () => window.open(img.src,'_blank');
  });
}

/* ── 저장한 것 — 만든 자리 바로 아래 ────────── */
function draftSection(kind, host){
  const label = kind==='final' ? '완성본' : PART_NAME[kind];
  const list = savedParts().filter(p=>kind==='final' ? p.kind==='final' : p.kind===kind);
  $(host).innerHTML = `<h3>저장한 ${label} <span class="muted" style="font-weight:400">${list.length}개</span></h3>`
    + (list.length ? list.map(p=>cardHTML(p.path)).join('')
       : '<p class="empty">아직 없습니다.</p>');
  wireDraftCards($(host), ()=>draftSection(kind, host));
}
/* 카드의 열기·복사·저장·삭제 — 작업중 탭과 같은 동작 */
function wireDraftCards(host, redraw){
  host.onclick = e => {
    const card = e.target.closest('.card'); if(!card) return;
    const path = card.dataset.p, act = e.target.dataset.a;
    if(act==='copy'){ copy(S.md[path]||'', card.dataset.n); return; }
    if(act==='del'){
      if(!confirm(`${pretty(path)} 를 지울까요? 되돌릴 수 없습니다.`)) return;
      post('_delete',{path}).then(async r=>{
        if(r.ok){ dropFile(path); redraw(); toast(pretty(path)+' 삭제됨'); }
        else toast('삭제 실패: '+await r.text(), true);
      }).catch(()=>toast('삭제 실패 — 쓰기를 지원하지 않는 서버입니다', true));
      return;
    }
    if(act==='save'){
      const ta = card.querySelector('textarea');
      post('_edit',{path, content:ta.value}).then(async r=>{
        if(r.ok){ S.md[path]=ta.value; toast(pretty(path)+' 저장됨'); }
        else toast('저장 실패: '+await r.text(), true);
      }).catch(()=>toast('저장 실패 — 쓰기를 지원하지 않는 서버입니다', true));
      return;
    }
    if(act==='close'){ card.classList.remove('open'); return; }
    if(e.target.closest('.nm') || act==='open') card.classList.toggle('open');
  };
}


/* ── 사전 고치기 ─────────────────────────────
   AI가 지어낸 태그를 걸러내려면 사전이 맞아야 하고, 맞추려면 여기서 고칠 수 있어야 한다.
   CSV 를 그대로 다시 써내므로 터미널에서 연 것과 같은 파일이 된다. */
const CSV_OF = { plain:'1-태그사전', style:'1-스타일태그', artist:'1-작가태그' };
const CSV_COLS = {
  plain:  ['시트','분류1','분류2','한글명','태그','NSFW','비고'],
  style:  ['분류','세부','태그','설명','비고'],
  artist: ['섹션','태그','네거티브_추천'],
};
const csvPath = which => S.files.find(f=>f.endsWith(CSV_OF[which]+'.csv')) || '';

function toCSV(cols, rows){
  const q = v => { v = String(v ?? ''); return /[",\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v; };
  return '﻿' + [cols.join(','), ...rows.map(r=>cols.map(c=>q(r[c])).join(','))].join('\n') + '\n';
}
/* 원본 배열(S.dict·S.style·S.artist)을 고쳐 파일로 되쓴다 */
async function csvSave(which){
  const path = csvPath(which);
  const src = ({plain:S.dict, style:S.style, artist:S.artist})[which];
  if(!path){ toast('원본 파일을 못 찾았습니다', true); return false; }
  const r = await post('_edit', {path, content: toCSV(CSV_COLS[which], src)});
  if(!r.ok){ toast('저장 실패: '+await r.text(), true); return false; }
  buildTags();                       /* 통합 표를 다시 만든다 */
  toast(pretty(path)+' 저장됨');
  return true;
}

/* 한 줄을 고치거나 새로 넣는 폼. row 가 없으면 새 줄. */
function rowForm(which, row){
  const cols = CSV_COLS[which];
  const pick = { '시트':[...new Set(S.dict.map(r=>r['시트']))],
                 '분류':[...new Set(S.style.map(r=>r['분류']))],
                 '섹션':[...new Set(S.artist.map(r=>r['섹션']))] };
  return `<div class="rowform">
    ${cols.map(c=>{
      const v = row ? (row[c]||'') : '';
      if(c==='NSFW'||c==='네거티브_추천')
        return `<label class="rf"><span>${esc(c)}</span>
          <select class="ctl" data-c="${esc(c)}">
            <option value=""></option>
            <option${v==='TRUE'?' selected':''}>TRUE</option>
            <option${v==='FALSE'?' selected':''}>FALSE</option>
            <option${v==='Y'?' selected':''}>Y</option></select></label>`;
      if(pick[c]) return `<label class="rf"><span>${esc(c)}</span>
          <input class="ctl" list="dl-${esc(c)}" data-c="${esc(c)}" value="${esc(v)}">
          <datalist id="dl-${esc(c)}">${pick[c].map(x=>`<option>${esc(x)}</option>`).join('')}</datalist></label>`;
      return `<label class="rf"><span>${esc(c)}</span>
          <input class="ctl" data-c="${esc(c)}" value="${esc(v)}"></label>`;
    }).join('')}
    <div class="rfbar">
      <button class="btn pri" data-a="ok">${row?'고치기':'추가'}</button>
      <button class="btn" data-a="cancel">취소</button>
      ${row?'<button class="btn danger" data-a="rm">이 줄 삭제</button>':''}
    </div>
  </div>`;
}
/* 폼을 열고 저장까지 — done() 은 목록을 다시 그린다 */
function openRowForm(host, which, row, done){
  host.innerHTML = rowForm(which, row);
  host.onclick = async e => {
    const b = e.target.closest('button[data-a]'); if(!b) return;
    if(b.dataset.a==='cancel'){ host.innerHTML=''; return; }
    const src = ({plain:S.dict, style:S.style, artist:S.artist})[which];
    if(b.dataset.a==='rm'){
      if(!confirm('이 줄을 지울까요?')) return;
      const i=src.indexOf(row); if(i>=0) src.splice(i,1);
      if(await csvSave(which)){ host.innerHTML=''; done(); }
      return;
    }
    const o = {};
    host.querySelectorAll('[data-c]').forEach(el=>o[el.dataset.c]=el.value.trim());
    if(!o['태그']){ toast('태그는 비울 수 없습니다', true); return; }
    if(row) Object.assign(row, o); else src.push(o);
    if(await csvSave(which)){ host.innerHTML=''; done(); }
  };
  const first = host.querySelector('input'); if(first) first.focus();
}

/* ── 퀄리티·부정 프리셋 ───────────────────────
   Q·N 은 그림체의 절반인데 그동안 문서로만 볼 수 있었다. 여기서 고치고 더한다.
   정본은 03_프롬프트/이미지/스타일프리셋/ 두 파일이다 — 그 파일을 직접 다시 쓴다. */
const PRESET_FILE = {
  Q: f=>/스타일프리셋\/퀄리티/.test(f),
  N: f=>/스타일프리셋\/부정/.test(f),
};
const presetPath = k => S.files.find(PRESET_FILE[k]) || '';

function drawPresets(){
  const cur = subGet('preset','Q');
  const name = cur==='Q' ? '퀄리티' : '부정';
  const map = S.presets[cur];
  const keys = Object.keys(map);
  $('#dbody').innerHTML = `<div class="bar">
      ${segHTML('pseg', [['Q','퀄리티 Q'],['N','부정 N']], cur)}
      <span class="sp"></span>
      ${S.static?'':`<button class="btn i" id="padd" title="추가">＋</button>`}
    </div>
    <div id="pform"></div>
    ${keys.map(k=>`<div class="card preset" data-k="${esc(k)}">
      <div class="row">
        <span class="kindbadge">${esc(k)}</span>
        <span class="nm">${esc((S.presetTitle||{})[k]||'')}</span>
        <span class="acts">
          <button data-a="copy" title="복사">⧉</button>
          ${S.static?'':'<button data-a="edit" title="수정">✎</button><button class="del" data-a="rm" title="삭제">✕</button>'}
        </span>
      </div>
      <pre>${esc(map[k])}</pre>
    </div>`).join('') || '<p class="empty">프리셋이 없습니다.</p>'}`;
  $('#pseg').onclick = e => { const b=e.target.closest('button'); if(!b) return;
    subSet('preset', b.dataset.k); drawPresets(); };
  if($('#padd')) $('#padd').onclick = ()=>presetForm(cur, '');
  $('#dbody').addEventListener('click', e=>{
    const card=e.target.closest('.card.preset'); if(!card) return;
    const k=card.dataset.k, a=e.target.dataset.a;
    if(a==='copy') copy(map[k], k);
    if(a==='edit') presetForm(cur, k);
    if(a==='rm' && confirm(`${k} 를 지울까요?`)) presetWrite(cur, k, null, null);
  });
}
function presetForm(kind, key){
  const map=S.presets[kind];
  const next = key || (kind+((Math.max(0,...Object.keys(map).map(k=>+k.slice(1)||0)))+1));
  $('#pform').innerHTML = `<div class="rowform">
    <label class="rf"><span>번호</span><input class="ctl" id="pk" value="${esc(key||next)}"></label>
    <label class="rf"><span>이름</span><input class="ctl" id="pt"
      value="${esc((S.presetTitle||{})[key]||'')}" placeholder="예: 눈·피부 강조형"></label>
    <label class="rf" style="flex:1 1 100%"><span>프롬프트</span>
      <textarea id="pv" spellcheck="false">${esc(key?map[key]:'')}</textarea></label>
    <div class="rfbar">
      <button class="btn pri" id="pok">${key?'고치기':'추가'}</button>
      <button class="btn" id="pcancel">취소</button>
    </div></div>`;
  $('#pcancel').onclick=()=>{ $('#pform').innerHTML=''; };
  $('#pok').onclick=()=>presetWrite(kind, key, $('#pk').value.trim(), $('#pv').value.trim(), $('#pt').value.trim());
}
/* 파일을 다시 쓴다. body 가 null 이면 그 절을 지운다. */
async function presetWrite(kind, oldKey, newKey, body, title){
  const path = presetPath(kind);
  if(!path){ toast('정본 파일을 못 찾았습니다', true); return; }
  let src = S.md[path]||'';
  const sec = k => new RegExp(`^## ${k}\\\\b[\\\\s\\\\S]*?(?=\\\\n## |$)`, 'm');
  if(body===null){
    src = src.replace(sec(oldKey), '').replace(/\\n{3,}/g,'\n\n');
  } else {
    const block = `## ${newKey}${title?' — '+title:''}\n\`\`\`\n${body}\n\`\`\`\n`;
    src = oldKey && sec(oldKey).test(src) ? src.replace(sec(oldKey), block)
                                          : src.replace(/\s*$/, '\n\n'+block);
  }
  const r = await post('_edit', {path, content: src});
  if(!r.ok){ toast('저장 실패: '+await r.text(), true); return; }
  S.md[path]=src; loadPresets(); $('#pform').innerHTML=''; drawPresets();
  toast(body===null ? `${oldKey} 삭제됨` : `${newKey} 저장됨`);
}
